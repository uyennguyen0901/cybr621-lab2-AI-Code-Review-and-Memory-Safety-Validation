  relativeQueryPath: Likely Bugs/Memory Management/UsingExpiredStackAddress.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/UsingExpiredStackAddress.bqrs
  metadata:
    name: Use of expired stack-address
    description: |-
      Accessing the stack-allocated memory of a function
                    after it has returned can lead to memory corruption.
    kind: path-problem
    problem.severity: error
    security-severity: 9.3
    precision: high
    id: cpp/using-expired-stack-address
    tags: |-
      reliability
             security
             external/cwe/cwe-825
  queryHelp: |
    # Use of expired stack-address
    This rule finds uses of pointers that likely point to local variables in expired stack frames. A pointer to a local variable is only valid until the function returns, after which it becomes a dangling pointer.


    ## Recommendation
    1. If it is necessary to take the address of a local variable, then make sure that the address is only stored in memory that does not outlive the local variable. For example, it is safe to store the address in another local variable. Similarly, it is also safe to pass the address of a local variable to another function provided that the other function only uses it locally and does not store it in non-local memory.
    1. If it is necessary to store an address which will outlive the current function scope, then it should be allocated on the heap. Care should be taken to make sure that the memory is deallocated when it is no longer needed, particularly when using low-level memory management routines such as `malloc`/`free` or `new`/`delete`. Modern C++ applications often use smart pointers, such as `std::shared_ptr`, to reduce the chance of a memory leak.

    ## Example

    ```cpp
    static const int* xptr;

    void localAddressEscapes() {
      int x = 0;
      xptr = &x;
    }

    void example1() {
      localAddressEscapes();
      const int* x = xptr; // BAD: This pointer points to expired stack allocated memory.
    }

    void localAddressDoesNotEscape() {
      int x = 0;
      xptr = &x;
      // ...
      // use `xptr`
      // ...
      xptr = nullptr;
    }

    void example2() {
      localAddressDoesNotEscape();
      const int* x = xptr; // GOOD: This pointer does not point to expired memory.
    }

    ```

    ## References
    * Wikipedia: [Dangling pointer](https://en.wikipedia.org/wiki/Dangling_pointer).
    * Common Weakness Enumeration: [CWE-825](https://cwe.mitre.org/data/definitions/825.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/NestedLoopSameVar.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/NestedLoopSameVar.bqrs
  metadata:
    name: Nested loops with same variable
    description: |-
      When a nested loop uses the same iteration variable as its outer loop, the
         behavior of the outer loop easily becomes difficult to understand as the
         inner loop will affect its control flow. It is likely to be a typo.
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/nested-loops-with-same-variable
    tags: |-
      maintainability
             correctness
  queryHelp: "# Nested loops with same variable\nThis rule finds nested loops in which\
    \ the iteration variable is the same for both loops. The behavior of the loop\
    \ will be difficult to understand as the inner loop will affect the iteration\
    \ variable of the outer loop; this is most likely a typo.\n\nThe rule flags the\
    \ condition expression in the inner loop that uses the same variable as the iteration\
    \ variable of the outer loop.\n\n\n## Recommendation\nIf the inner loop is starting\
    \ by initializing the variable to 0, it's most likely a typo and then the inner\
    \ loop variable should be changed. It is good practice to use descriptive names\
    \ in nested loops rather than i and j to avoid confusion. If the inner loop is\
    \ merely consuming the rest of the iteration as a special case, then it's better\
    \ to replace the inner for loop with a while loop and also document it.\n\n\n\
    ## Example\n\n```cpp\nint x1 = 0;\nfor (x1 = 0; x1 < 100; x1++) {\n    int x2\
    \ = 0;\n    for (x1 = 0; x1 < 300; x1++) {\n    // this is most likely a typo\n\
    \    // the outer loop will exit immediately\n    } \n}\n\nfor (x1 = 0; x1 < 100;\
    \ x1++) {\n  if(x1 == 10 && condition) {\n    for (; x1 < 75; x1++) {\n      //\
    \ this should be written as a while loop\n    }   \n  }\n}\n\n```\n\n## References\n\
    * Tutorialspoint - The C++ Programming Language: [C++ nested loops](http://www.tutorialspoint.com/cplusplus/cpp_nested_loops.htm)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/OO/IncorrectConstructorDelegation.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/OO/IncorrectConstructorDelegation.bqrs
  metadata:
    name: Incorrect constructor delegation
    description: |-
      A constructor in C++ cannot delegate part of the object
                    initialization to another by calling it. This is likely to
                    leave part of the object uninitialized.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/constructor-delegation
    tags: |-
      maintainability
             readability
             language-features
  queryHelp: "# Incorrect constructor delegation\nPrior to C++11, there is no mechanism\
    \ for a constructor to delegate part of the object initialization to another,\
    \ although other languages provide this feature. Consequently, any instance where\
    \ a constructor call appears in the body of a constructor without being used is\
    \ suspect.\n\n\n## Recommendation\nThe rule flags constructor calls in constructors\
    \ which are not used in some way. This is usually a misguided attempt to share\
    \ some initialization code between multiple constructors, or to provide sensible\
    \ defaults for some constructor parameters. The effect of a flagged expression\
    \ would be to initialize an instance of the current class on the stack, and then\
    \ let it go out of scope at the end of the constructor call.\n\nThere are several\
    \ ways to address the underlying issue of sharing initialization code, and the\
    \ most appropriate needs to picked in each case. Roughly speaking, the options\
    \ are:\n\n* Introduce actual default values for the constructor parameters.\n\
    * Duplicate the initialization code in each constructor.\n* Factor out the initialization\
    \ code into a member function that is called from each constructor.\n* If your\
    \ compiler supports it, use C++11's constructor delegation feature.\n\n## Example\n\
    ```cpp\n\nclass Circle {\nprivate:\n  double m_x;\n  double m_y;\n  double m_radius;\n\
    \  \n  double m_area;\n  \npublic:\n  // Real constructor:\n  Circle(double x,\
    \ double y, double radius) :\n    m_x(x), m_y(y), m_radius(radius)\n  {\n    m_area\
    \ = 3.14159 * m_radius * m_radius;\n  }\n  \n  Circle() {\n    // WRONG: Attempt\
    \ to define the unit circle by default fails.\n    Circle(0, 0, 1);\n  }\n};\n\
    \n```\n\n## References\n* Dr Dobb's Journal: [ Delegating constructors?](http://www.drdobbs.com/delegating-constructors/184401647)\n\
    * Wikipedia: [ Object construction improvement in C++11](https://en.wikipedia.org/wiki/C%2B%2B11#Object_construction_improvement).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/OO/NonVirtualDestructorInBaseClass.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/OO/NonVirtualDestructorInBaseClass.bqrs
  metadata:
    name: Non-virtual destructor in base class
    description: "All base classes with a virtual function should define a virtual\
      \ destructor. If an application attempts to delete a derived class object through\
      \ a base class pointer, the result is undefined if the base class destructor\
      \ is non-virtual."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/virtual-destructor
    tags: |-
      reliability
             readability
             language-features
  queryHelp: "# Non-virtual destructor in base class\nThis rule finds classes with\
    \ virtual functions but no virtual destructor. Deleting a class without a virtual\
    \ destructor will only call the destructor of the type of the pointer being deleted.\
    \ This can cause a defect if the pointer type is a base type while the object\
    \ instance is a derived type.\n\n\n## Recommendation\nMake sure that all classes\
    \ with virtual functions also have a virtual destructor, especially if other classes\
    \ derive from them.\n\n\n## Example\n\n```cpp\nclass Base {\npublic:\n\tResource\
    \ *p;\n\tBase() {\n\t\tp = createResource();\n\t}\n\tvirtual void f() { //has\
    \ virtual function\n\t\t//...\n\t}\n\t//...\n\t~Base() { //wrong: is non-virtual\n\
    \t\tfreeResource(p);\n\t}\n};\n\nclass Derived: public Base {\npublic:\n\tResource\
    \ *dp;\n\tDerived() {\n\t\tdp = createResource2();\n\t}\n\t~Derived() {\n\t\t\
    freeResource2(dp);\n\t}\n};\n\nint f() {\n\tBase *b = new Derived(); //creates\
    \ resources for both Base::p and Derived::dp\n\t//...\n\n\t//will only call Base::~Base(),\
    \ leaking the resource dp.\n\t//Change both destructors to virtual to ensure they\
    \ are both called.\n\tdelete b;\n}\n\n```\n\n## References\n* S. Meyers. *Effective\
    \ C++ 3d ed.* pp 40-44. Addison-Wesley Professional, 2005.\n* [When should your\
    \ destructor be virtual?](https://devblogs.microsoft.com/oldnewthing/20040507-00/?p=39443)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/OO/ThrowInDestructor.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/OO/ThrowInDestructor.bqrs
  metadata:
    name: Exception thrown in destructor
    description: |-
      Throwing an exception from a destructor may cause immediate
                    program termination.
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/throw-in-destructor
    tags: |-
      reliability
             readability
             language-features
  queryHelp: "# Exception thrown in destructor\nThis rule finds exceptions thrown\
    \ in destructors. This is dangerous: If the destructor is called during stack\
    \ unwinding as part of the handling of another exception, throwing an additional\
    \ exception will immediately terminate the program as per the C++ specification.\n\
    \n\n## Recommendation\nHandle the error condition in a different way.\n\n\n##\
    \ Example\n\n```cpp\nclass C {\npublic:\n\t//...\n\t~C(){\n\t\tif (error) {\n\t\
    \t\tthrow \"Exception in destructor\"; //wrong: exception thrown in destructor\n\
    \t\t}\n\t}\n};\n\nvoid f() {\n\tC* c = new C();\n\ttry {\n\t\tdoOperation(c);\n\
    \t\tdelete c;\n\t} catch ( char * do_operation_exception) {\n\t\tdelete c; //would\
    \ immediately terminate program if C::~C throws an exception\n\t}\n}\n\n```\n\n\
    ## References\n* M. Cline, [C++ FAQ: How can I handle a destructor that fails?](https://isocpp.org/wiki/faq/exceptions#dtors-shouldnt-throw)\n\
    * B. Stroustrup. *The C++ Programming Language Special Edition* p 380. Addison\
    \ Wesley. 2000.\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/OO/UnsafeUseOfThis.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/OO/UnsafeUseOfThis.bqrs
  metadata:
    name: Unsafe use of this in constructor
    description: |-
      A call to a pure virtual function using a 'this'
                    pointer of an object that is under construction
                    may lead to undefined behavior.
    kind: path-problem
    id: cpp/unsafe-use-of-this
    problem.severity: error
    security-severity: 7.5
    precision: very-high
    tags: |-
      correctness
             language-features
             security
             external/cwe/cwe-670
  queryHelp: |
    # Unsafe use of this in constructor
    This rule finds calls to pure virtual member functions in constructors and destructors. When executing the body of a constructor of class `T`, the virtual table of `T` refers to the virtual table of one of `T`'s base classes. This can produce unexpected behavior, including program abort that can lead to denial of service attacks. The same problem exists during destruction of an object.


    ## Recommendation
    Do not rely on virtual dispatch in constructors and destructors. Instead, each class should be responsible for acquiring and releasing its resources. If a base class needs to refer to a derived class during initialization, use the Dynamic Binding During Initialization idiom.


    ## Example

    ```cpp
    class Base {
    private:
        // pure virtual member function used for initialization of derived classes.
        virtual void construct() = 0;
    public:
        Base() {
            // wrong: the virtual table of `Derived` has not been initialized yet. So this
            // call will resolve to `Base::construct`, which cannot be called as it is a pure
            // virtual function.
            construct();
        }
    };

    class Derived : public Base {
        int field;

        void construct() override {
            field = 1;
        }
    };

    ```

    ## References
    * ISO C++ FAQ: [When my base class's constructor calls a virtual function on its this object, why doesn't my derived class's override of that virtual function get invoked?](https://isocpp.org/wiki/faq/strange-inheritance#calling-virtuals-from-ctors)
    * SEI CERT C++ Coding Standard [OOP50-CPP. Do not invoke virtual functions from constructors or destructors](https://wiki.sei.cmu.edu/confluence/display/cplusplus/OOP50-CPP.+Do+not+invoke+virtual+functions+from+constructors+or+destructors)
    * ISO C++ FAQ: [Okay, but is there a way to simulate that behavior as if dynamic binding worked on the this object within my base class's constructor?](https://isocpp.org/wiki/faq/strange-inheritance#calling-virtuals-from-ctor-idiom)
    * Common Weakness Enumeration: [CWE-670](https://cwe.mitre.org/data/definitions/670.html).
 -
