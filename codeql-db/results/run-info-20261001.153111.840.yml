  relativeQueryPath: jsf/4.10 Classes/AV Rule 79.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.10 Classes/AV Rule 79.bqrs
  metadata:
    name: Resource not released in destructor
    description: "All resources acquired by a class should be released by its destructor.\
      \ Avoid the use of the 'open / close' pattern, since C++ constructors and destructors\
      \ provide a safer way to handle resource acquisition and release. Best practice\
      \ in C++ is to use the 'RAII' technique: constructors allocate resources and\
      \ destructors free them."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/resource-not-released-in-destructor
    tags: |-
      efficiency
             readability
             external/cwe/cwe-404
             external/jsf
  queryHelp: "# Resource not released in destructor\nThis rule finds resources that\
    \ are allocated by a class, but not released in the destructor of that class.\
    \ Allocating a resource includes:\n\n* Allocating memory with `malloc`\n* Creating\
    \ objects using `new`\n* Opening files\n* Opening network sockets\nResource management\
    \ can be a complex task, so a standard best practice is the pattern of *Resource\
    \ Acquisition is Initialization* (RAII). In an RAII class, the constructor allocates\
    \ all required resources, and the destructor frees all resources. This guarantees\
    \ that simply deleting an instance of the class is enough to free resources, and\
    \ benefits from C++'s automatic object lifetime management. A well-designed RAII\
    \ class cannot be a source of resource leaks as long as its lifetime is properly\
    \ managed:\n\n* If it is allocated with `new` it should be released with `delete`\
    \ by the client that created it\n* If its lifetime is lexical (it is only used\
    \ in one function), then it is enough to declare it as a local variable of that\
    \ function (not a pointer) and the C++ runtime will ensure it is released on exit.\n\
    There are two possible messages:\n\n* \"Resource *x* is acquired by class *C*\
    \ but not released in the destructor. It is released from *f*, so this function\
    \ may need to be called in the destructor\".\nThis indicates that the resource\
    \ (*x*) is being released, just not in the destructor of the class. Typically,\
    \ it is released in a function called `close`, `free` or something similar. This\
    \ does not always indicate a resource leak, but it shows that the class is unnecessarily\
    \ difficult to use because it does not conform to the RAII pattern.\n\n* \"Resource\
    \ *x* is acquired by class *C* but not released anywhere in this class\".\nThis\
    \ indicates that the class is allocating resources but not responsible for releasing\
    \ them. This is very error-prone: even if a class requires an explicit close operator,\
    \ it should manage any resources it allocates rather than forcing clients to manage\
    \ them. In the worst case this can be a resource leak, if client code does not\
    \ free the resource.\n\n\n## Recommendation\nIf the resource is not being released\
    \ at all, ensure that the class does release the resource, normally by adding\
    \ the release to the destructor of the class. This change needs to be carefully\
    \ validated: client code may be relying on the resource outliving the class that\
    \ allocated it, and must be reviewed and updated if necessary.\n\nIn the other\
    \ case, for instance a class that has an explicit `close` function, the aim is\
    \ to migrate the class to a straightforward RAII pattern. This can be achieved\
    \ in several steps:\n\n1. First, ensure that the `close` function (or its equivalent)\
    \ is safe to call twice, by releasing resources only if they have not been released\
    \ before.\n1. Next, call the `close` function from the destructor. This does not\
    \ require changing the client code, since it is safe to call it twice.\n1. Migrate\
    \ client code to remove direct uses of the `close` function, taking the opportunity\
    \ to check that the object itself is being deleted appropriately.\n1. Finally,\
    \ when possible also migrate initialization code to the constructor of the class\
    \ to make it follow the RAII pattern precisely.\n\n## Example\n\n```cpp\n// This\
    \ class opens a file but never closes it. Even its clients\n// cannot close the\
    \ file\nclass ResourceLeak {\nprivate:\n    int sockfd;\n    FILE* file;\npublic:\n\
    \    C() {\n        sockfd = socket(AF_INET, SOCK_STREAM, 0);\n    }\n\n    void\
    \ f() {\n        file = fopen(\"foo.txt\", \"r\");\n        ...\n    }\n};\n\n\
    // This class relies on its client to release any stream it\n// allocates. Note\
    \ that this means the client must have\n// intimate knowledge of the implementation\
    \ of the class to\n// decide whether it is safe to release the stream. \nclass\
    \ StreamPool {\nprivate:\n  Stream *instance;\npublic:\n  Stream *createStream(char\
    \ *name) {\n    if (!instance) \n      instance = new Stream(name);\n    return\
    \ instance;\n  }\n}\n\n// This class handles its resources, but does not do that\
    \ in\n// the constructor/destructor. It can be rewritten easily to\n// be safer\
    \ to use.\nclass StreamHandler {\nprivate:\n  char *_name;\n  Stream *stream;\n\
    public:\n  C(char *name) {\n    _name = strdup(name):\n  }\n  void open() {\n\
    \    stream = new Stream();\n  }\n  void close() {\n    delete stream;\n  }\n\
    \  ~StreamHandler() {\n    free(_name);\n    // stream should be deleted here,\
    \ not in close()\n  }\n}\n```\n\n## References\n* AV Rule 79, *Joint Strike Fighter\
    \ Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation, 2005.\n* S.\
    \ Meyers. *Effective C++ 3d ed.* pp 61-66. Addison-Wesley Professional, 2005.\n\
    * [Resource Acquisition Is Initialization](https://en.wikipedia.org/wiki/Resource_Acquisition_Is_Initialization)\n\
    * Common Weakness Enumeration: [CWE-404](https://cwe.mitre.org/data/definitions/404.html).\n"
 -
