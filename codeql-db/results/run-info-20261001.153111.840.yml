  queryHelp: "# Potentially overrunning write with float to string conversion\nThe\
    \ program performs a buffer copy or write operation that includes one or more\
    \ float to string conversions (i.e. the %f format specifier), which may overflow\
    \ the destination buffer if extreme inputs are given. In addition to causing program\
    \ instability, techniques exist which may allow an attacker to use this vulnerability\
    \ to execute arbitrary code.\n\n\n## Recommendation\nAlways control the length\
    \ of buffer copy and buffer write operations. `strncpy` should be used over `strcpy`,\
    \ `snprintf` over `sprintf`, and in other cases 'n-variant' functions should be\
    \ preferred.\n\n\n## Example\n\n```c\nvoid displayValue(double value)\n{\n\tchar\
    \ buffer[256];\n\n\t// BAD: extreme values may overflow the buffer\n\tsprintf(buffer,\
    \ \"%f\", value);\n\n\tMessageBox(hWnd, buffer, \"A Number\", MB_OK);\n}\n```\n\
    In this example, the call to `sprintf` contains a `%f` format specifier. Though\
    \ a 256 character buffer has been allowed, it is not sufficient for the most extreme\
    \ floating point inputs. For example the representation of double value 1e304\
    \ (that is 1 with 304 zeroes after it) will overflow a buffer of this length.\n\
    \nTo fix this issue three changes should be made:\n\n* Control the size of the\
    \ buffer using a preprocessor define.\n* Replace the call to `sprintf` with `snprintf`,\
    \ specifying the define as the maximum length to copy. This will prevent the buffer\
    \ overflow.\n* Consider using the `%g` format specifier instead of `%f`.\n\n##\
    \ References\n* CERT C Coding Standard: [STR31-C. Guarantee that storage for strings\
    \ has sufficient space for character data and the null terminator](https://www.securecoding.cert.org/confluence/display/c/STR31-C.+Guarantee+that+storage+for+strings+has+sufficient+space+for+character+data+and+the+null+terminator).\n\
    * CERT C++ Coding Standard: [STR50-CPP. Guarantee that storage for strings has\
    \ sufficient space for character data and the null terminator](https://www.securecoding.cert.org/confluence/display/cplusplus/STR50-CPP.+Guarantee+that+storage+for+strings+has+sufficient+space+for+character+data+and+the+null+terminator).\n\
    * Common Weakness Enumeration: [CWE-120](https://cwe.mitre.org/data/definitions/120.html).\n\
    * Common Weakness Enumeration: [CWE-787](https://cwe.mitre.org/data/definitions/787.html).\n\
    * Common Weakness Enumeration: [CWE-805](https://cwe.mitre.org/data/definitions/805.html).\n"
 -
