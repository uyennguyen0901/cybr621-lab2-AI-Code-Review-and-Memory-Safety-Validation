  relativeBqrsPath: codeql/cpp-queries/Best Practices/Likely Errors/EmptyBlock.bqrs
  metadata:
    name: Empty branch of conditional
    description: |-
      An empty block after a conditional can be a sign of an omission
                    and can decrease maintainability of the code. Such blocks
                    should contain an explanatory comment to aid future
                    maintainers.
    kind: problem
    problem.severity: recommendation
    precision: very-high
    id: cpp/empty-block
    tags: |-
      reliability
             readability
  queryHelp: "# Empty branch of conditional\nThis rule finds empty blocks that occur\
    \ as a branch of a conditional or as a loop body. This may indicate badly maintained\
    \ code or a defect due to an unhandled case. It is common to find commented-out\
    \ code in the empty body. Commented-out code is discouraged and is a source of\
    \ defects and maintainability issues.\n\n\n## Recommendation\nIf the conditional\
    \ or loop is useless, remove it.\n\nIf only the else-branch of an `if` statement\
    \ is empty, omit it. If the then-branch is empty, invert the sense of the condition.\n\
    \n\n## Example\n\n```cpp\nvoid f(int i) {\n\tif (i == 10); //empty then block\n\
    \t\t... //won't be part of the if statement\n\n\tif (i == 12) {\n\t\t...\n\t}\
    \ else { //empty else block, most likely a mistake\n\t}\n}\n\n```\n"
 -
