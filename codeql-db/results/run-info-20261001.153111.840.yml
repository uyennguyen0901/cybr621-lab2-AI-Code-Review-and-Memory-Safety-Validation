  queryHelp: "# Potentially unsafe use of strcat\nThe standard library function `strcat`\
    \ appends a source string to a target string. If you do not check the size of\
    \ the source string then you cannot guarantee that appending the data to the target\
    \ string will not cause a buffer overflow. Buffer overflows can lead to anything\
    \ from a segmentation fault to a security vulnerability.\n\n\n## Recommendation\n\
    Check the highlighted function calls carefully to ensure that no buffer overflow\
    \ is possible. For a more robust solution, consider adding explicit range checks\
    \ or using the `strncat` function instead.\n\n\n## Example\n\n```cpp\nvoid f(char\
    \ *s) {\n\tchar buf[80];\n\tstrcpy(buf, \"s: \");\n\tstrcat(buf, s);  // wrong:\
    \ buffer not checked before strcat\n}\n\nvoid g(char *s) {\n\tchar buf[80];\n\t\
    strcpy(buf, \"s: \");\n\tif(strlen(s) < 77)\n\t\tstrcat(buf, s);  // correct:\
    \ buffer size checked before strcat\n}\n\n```\n\n## References\n* I. Gerg, *An\
    \ Overview and Example of the Buffer-Overflow Exploit*. IANewsletter vol 7, no\
    \ 4, 2005.\n* M. Donaldson, *Inside the Buffer Overflow Attack: Mechanism, Method\
    \ &amp; Prevention*. SANS Institute InfoSec Reading Room. 2002.\n* Common Weakness\
    \ Enumeration: [CWE-676](https://cwe.mitre.org/data/definitions/676.html).\n*\
    \ Common Weakness Enumeration: [CWE-120](https://cwe.mitre.org/data/definitions/120.html).\n\
    * Common Weakness Enumeration: [CWE-251](https://cwe.mitre.org/data/definitions/251.html).\n"
 -
