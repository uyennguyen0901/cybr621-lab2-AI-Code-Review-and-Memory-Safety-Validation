    id: cpp/use-in-own-initializer
    description: Loading from a variable in its own initializer may lead to undefined
      behavior.
    kind: problem
    problem.severity: warning
    precision: high
    tags: |-
      maintainability
             correctness
  queryHelp: "# Variable used in its own initializer\nA variable is in scope in its\
    \ own initializer, but it is undefined behavior to load from it before it is first\
    \ assigned to.\n\n\n## Recommendation\nDo not use a variable in its own initializer\
    \ unless it is part of an address calculation or a `sizeof` expression.\n\n\n\
    ## Example\n\n```cpp\nint f() {\n\tint x = x; // BAD: undefined behavior occurs\
    \ here\n\tx = 0;\n\treturn x;\n}\n\nint g() {\n\tint x = 0; // GOOD\n\treturn\
    \ x;\n}\n\n```\n\n## References\n* [ SEI CERT Secure Coding Standard: EXP53-CPP.\
    \ Do not read uninitialized memory ](https://wiki.sei.cmu.edu/confluence/display/cplusplus/EXP53-CPP.+Do+not+read+uninitialized+memory)\n"
