  relativeQueryPath: Likely Bugs/RedundantNullCheckSimple.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/RedundantNullCheckSimple.bqrs
  metadata:
    name: Redundant null check due to previous dereference
    description: |-
      Checking a pointer for nullness after dereferencing it is
                    likely to be a sign that either the check can be removed, or
                    it should be moved before the dereference.
    kind: path-problem
    problem.severity: error
    security-severity: 7.5
    precision: high
    id: cpp/redundant-null-check-simple
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-476
  queryHelp: "# Redundant null check due to previous dereference\nThis rule finds\
    \ comparisons of a pointer to null that occur after a reference of that pointer.\
    \ It's likely either the check is not required and can be removed, or it should\
    \ be moved to before the dereference so that a null pointer dereference does not\
    \ occur.\n\n\n## Recommendation\nThe check should be moved to before the dereference,\
    \ in a way that prevents a null pointer value from being dereferenced. If it's\
    \ clear that the pointer cannot be null, consider removing the check instead.\n\
    \n\n## Example\n\n```cpp\nint f(MyList *list) {\n\tlist->append(1);\n\n\t// ...\n\
    \n\tif (list != NULL)\n\t{\n\t\tlist->append(2);\n\t}\n}\n\n```\n\n## References\n\
    * [ Null Dereference ](https://www.owasp.org/index.php/Null_Dereference)\n* Common\
    \ Weakness Enumeration: [CWE-476](https://cwe.mitre.org/data/definitions/476.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/ReturnConstType.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/ReturnConstType.bqrs
  metadata:
    name: Constant return type
    description: A 'const' modifier on a function return type is useless and should
      be removed for clarity.
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/non-member-const-no-effect
    tags: |-
      maintainability
             readability
             language-features
  queryHelp: |
    # Constant return type
    This rule finds non-member functions with a superfluous `const` qualifier on their return type.


    ## Recommendation
    The superfluous `const` qualifier should be removed, as it serves no purpose. If the return type contains embedded qualifiers, then care should be taken to remove only the superfluous one.


    ## Example

    ```cpp
    // The leftmost const has no effect here.
    const int square(const int x) {
      return x * x;
    }

    // The const has no effect here, and can easily be mistaken for const char*.
    char* const id(char* s) {
      return s;
    }

    ```

    ## References
    * [comp.lang.c FAQ list · Question 6.3 ](http://c-faq.com/aryptr/aryptrequiv.html)
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/ReturnConstTypeMember.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/ReturnConstTypeMember.bqrs
  metadata:
    name: Constant return type on member
    description: "A 'const' modifier on a member function return type is useless.\
      \ It is usually a typo or misunderstanding, since the syntax for a 'const' function\
      \ is 'int foo() const', not 'const int foo()'."
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/member-const-no-effect
    tags: |-
      maintainability
             readability
             language-features
  queryHelp: "# Constant return type on member\nThis rule finds member functions with\
    \ a superfluous `const` qualifier on their return type. This might be caused by\
    \ confusion about how to declare a `const` method. In particular, when C++11 trailing\
    \ return types are used, it becomes much easier to mis-declare a `const` method\
    \ by putting `const` on the wrong side of `->`.\n\n\n## Recommendation\nThe superfluous\
    \ `const` qualifier should be removed, as it serves no purpose. If the return\
    \ type contains embedded qualifiers, then care should be taken to remove only\
    \ the superfluous one.\n\nAlternatively, if the intention was to have a `const`\
    \ method, then the qualifier should be moved to immediately after the argument\
    \ list.\n\n\n## Example\n\n```cpp\nstruct S {\n  int val;\n  \n  // The const\
    \ has no effect here.\n  auto getValIncorrect() -> const int {\n    return val;\n\
    \  }\n  \n  // Whereas here it does make a semantic difference.\n  auto getValCorrect()\
    \ const -> int {\n    return val;\n  }\n};\n\n```\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Underspecified Functions/ImplicitFunctionDeclaration.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Underspecified Functions/ImplicitFunctionDeclaration.bqrs
  metadata:
    name: Implicit function declaration
    description: |-
      An implicitly declared function is assumed to take no
       arguments and return an integer. If this assumption does not hold, it
       may lead to unpredictable behavior.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/implicit-function-declaration
    tags: |-
      correctness
             maintainability
  queryHelp: "# Implicit function declaration\nA function is called without a prior\
    \ function declaration or definition. When this happens, the compiler generates\
    \ an implicit declaration of the function, specifying an integer return type and\
    \ no parameters. If the implicit declaration does not match the true signature\
    \ of the function, the function may behave unpredictably.\n\nThis may indicate\
    \ a misspelled function name, or that the required header containing the function\
    \ declaration has not been included.\n\nNote: This query is not compatible with\
    \ `build-mode: none` databases, and produces no results on those databases.\n\n\
    \n## Recommendation\nProvide an explicit declaration of the function before invoking\
    \ it.\n\n\n## Example\n\n```c\n/* '#include <stdlib.h>' was forgotten */\n\nint\
    \ main(void) {\n\t/* 'int malloc()' assumed */\n\tunsigned char *p = malloc(100);\n\
    \t*p = 'a';\n\treturn 0;\n}\n```\n\n## References\n* SEI CERT C Coding Standard:\
    \ [DCL31-C. Declare identifiers before using them](https://wiki.sei.cmu.edu/confluence/display/c/DCL31-C.+Declare+identifiers+before+using+them)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Underspecified Functions/MistypedFunctionArguments.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Underspecified Functions/MistypedFunctionArguments.bqrs
  metadata:
    name: Call to a function with one or more incompatible arguments
    description: |-
      When the type of a function argument is not compatible
       with the type of the corresponding parameter, it may lead to
       unpredictable behavior.
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/mistyped-function-arguments
    tags: |-
      correctness
             maintainability
  queryHelp: "# Call to a function with one or more incompatible arguments\nA function\
    \ is called with at least one argument whose type is incompatible with the type\
    \ of the corresponding parameter of the function being called. This may cause\
    \ the called function to behave unpredictably.\n\nThis may indicate that an incorrect\
    \ function is being called, or that the signature (parameter list and parameter\
    \ types) of the called function is not known to the author.\n\n\n## Recommendation\n\
    Call the function with the proper argument types. In some cases, it may suffice\
    \ to provide an explicit cast of an argument to the desired (parameter) type.\n\
    \n\n## Example\n\n```c\nvoid three_arguments(int x, int y, int z);\n\nvoid calls()\
    \ {\n\tint three = 3;\n\tthree_arguments(1, 2, three); // GOOD\n\tthree_arguments(1,\
    \ 2, &three); // BAD\n}\n\n```\n\n## References\n* SEI CERT C Coding Standard:\
    \ [ DCL20-C. Explicitly specify void when a function accepts no arguments ](https://wiki.sei.cmu.edu/confluence/display/c/DCL20-C.+Explicitly+specify+void+when+a+function+accepts+no+arguments)\n"
 -
