  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/NewArrayDeleteMismatch.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/NewArrayDeleteMismatch.bqrs
  metadata:
    name: "'new[]' array freed with 'delete'"
    description: "An array allocated with 'new[]' is being freed using 'delete'. Behavior\
      \ in such cases is undefined and should be avoided. Use 'delete[]' when freeing\
      \ arrays allocated with 'new[]'."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/new-array-delete-mismatch
    tags: reliability
  queryHelp: |
    # 'new[]' array freed with 'delete'
    This rule finds `delete` expressions that are using a pointer that points to memory allocated using the `new[]` operator. This should be avoided since it results in undefined behavior, as per &sect;5.3.5 of the ISO/IEC C++ Standard:

    > "In the first alternative (*delete object*), the value of the operand of `delete` may be a null pointer value, a pointer to a non-array object created by a previous *new-expression*, or a pointer to a sub-object representing a base class of such an object. If not, the behavior is undefined."

    Besides being formally undefined, there are two practical reasons why this is likely to cause defects. For the first of these, consider what happens when invoking `X *p = new X[23]`:

    1. Sufficient memory is allocated to hold `23` instances of type `X` by invoking `::operator new(sizeof(X) * 23)`.
    1. Each of the `23` instances of `X` is constructed at its correct place in memory (as if doing a *placement new*).
    If `delete[] p` is subsequently executed, the reverse happens:

    1. The destructor for each of the `23` instances of `X` is invoked (as if doing an explicit `(p + i)->~X()`).
    1. The memory allocated by `::operator new` is deallocated by invoking `::operator delete(p)`.
    By contrast, `delete p` (without the `[]` brackets) would generally assume that `p` points to exactly one instance of `X`, and only call the destructor for that (although this behavior cannot be relied upon, since the results are formally undefined). The practical result of this is that the destructors for the remaining `X` instances, which might do crucial things such as freeing resources, will not be called.

    There is also a second practical reason why this may cause a defect. In order to call the destructors of the array elements when `delete[]` is called, the implementation must know the size of array to which `p` points at deletion time. Bearing in mind that `p` is a pointer, and carries no array size information in its type, this information would not in general be available unless the implementation somehow stores it when `new[]` is invoked. There are two common ways in which this is done:

    * The most common approach is to allocate a small amount of extra memory (a *header*) before the start of the array and store the size in it. When invoking `delete[] p`, the implementation then just needs to walk back a fixed amount from the passed-in pointer to read the size. The implication of this is that `p` itself (the pointer to the first element in the array) is *not* the pointer returned by `::operator new`, and so it is not safe to call `::operator delete` on it. Instead, it should be called on a pointer that points to the start of the header. Invoking `delete p` would use the wrong address, with potentially catastrophic results.
    * An alternative, less common, approach is to store a map from pointers to the sizes of the arrays (if any) to which they point. When invoking `delete[] p`, the implementation looks up the pointer in the map, invokes the relevant number of destructors, deallocates the memory *and removes the pointer from the map*. If `delete p` is called instead, not only will the relevant number of destructors likely not be called (as previously noted), but the pointer will also likely not be removed from the map. In practical terms, this is potentially less of a serious issue than that posed by the first approach, but it should still be avoided.
    > WARNING: This check is an approximation, so some results may not be actual defects in the program. It is not possible in general to compute the values of pointers without running the program with all input data.

    ## Recommendation
    Use the `delete[]` operator when freeing memory allocated with `new[]`.


    ## Example

    ```cpp
    Record* record = new Record[SIZE];

    ...

    delete record; //record was created using 'new[]', but was freed using 'delete'

    ```

    ## References
    * S. Meyers. *Effective C++ 3d ed.* pp 73-75. Addison-Wesley Professional, 2005.
    * *ISO/IEC 14882:2011, Information technology - Programming languages - C++* &sect;5.3.5. International Organization for Standardization, Geneva, Switzerland, 2011.
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/NewDeleteArrayMismatch.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/NewDeleteArrayMismatch.bqrs
  metadata:
    name: "'new' object freed with 'delete[]'"
    description: "An object that was allocated with 'new' is being freed using 'delete[]'.\
      \ Behavior in such cases is undefined and should be avoided. Use 'delete' instead."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/new-delete-array-mismatch
    tags: reliability
  queryHelp: |
    # 'new' object freed with 'delete[]'
    This rule finds `delete[]` expressions that are using a pointer that points to memory allocated using the `new` operator. Behavior in such cases is undefined and should be avoided.

    The `new` operator allocates memory for just *one* object, then calls that object's constructor, and `delete` does the opposite. The array `delete[]` operator, however, expects the pointer to be pointing to the first element of an array (which could have header data specifying the length of the array) and would attempt to call the destructor on each element of the 'array', which would likely lead to a segfault due to the invalid header data.

    > WARNING: This check is an approximation, so some results may not be actual defects in the program. It is not possible in general to compute the values of pointers without running the program with all input data.

    ## Recommendation
    Use the `delete` operator when freeing memory allocated with `new`.


    ## Example

    ```cpp
    Record *ptr = new Record(...);

    ...

    delete [] ptr; // ptr was created using 'new', but was freed using 'delete[]'

    ```

    ## References
    * S. Meyers. *Effective C++ 3d ed.* pp 73-75. Addison-Wesley Professional, 2005.
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/NewFreeMismatch.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/NewFreeMismatch.bqrs
  metadata:
    name: Mismatching new/free or malloc/delete
    description: An object that was allocated with 'malloc' or 'new' is being freed
      using a mismatching 'free' or 'delete'.
    kind: problem
    problem.severity: warning
    security-severity: 7.5
    precision: high
    id: cpp/new-free-mismatch
    tags: |-
      reliability
             security
             external/cwe/cwe-762
  queryHelp: |
    # Mismatching new/free or malloc/delete
    This rule finds `delete` expressions whose argument is a pointer that points to memory allocated using the `malloc` function, and calls to `free` whose argument is a pointer that points to memory allocated using the `new` operator. Behavior in such cases is undefined and should be avoided.


    ## Recommendation
    Use the `delete` operator when freeing memory allocated with `new`, and the `free` function when freeing memory allocated with `malloc`.


    ## Example

    ```cpp
    Record *ptr = new Record(...);

    ...

    free(ptr); // BAD: ptr was created using 'new', but is being freed using 'free'

    ```

    ## References
    * isocpp.org 'Standard C++', "[Can I free() pointers allocated with new? Can I delete pointers allocated with malloc()?](https://isocpp.org/wiki/faq/freestore-mgmt#mixing-malloc-and-delete)"
    * Wikipedia, "[Relation to malloc and free](https://en.wikipedia.org/wiki/New_and_delete_(C%2B%2B)#Relation_to_malloc_and_free)" in *new and delete (C++)*.
    * Common Weakness Enumeration: [CWE-762](https://cwe.mitre.org/data/definitions/762.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/OverflowStatic.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/OverflowStatic.bqrs
  metadata:
    name: Static array access may cause overflow
    description: |-
      Exceeding the size of a static array during write or access operations
                    may result in a buffer overflow.
    kind: problem
    problem.severity: warning
    security-severity: 9.3
    precision: high
    id: cpp/static-buffer-overflow
    tags: |-
      reliability
             security
             external/cwe/cwe-119
             external/cwe/cwe-131
  queryHelp: "# Static array access may cause overflow\nWhen you use static arrays\
    \ you must ensure that you do not exceed the size of the array during write and\
    \ access operations. If an operation attempts to write to or access an element\
    \ that is outside the range of the array then this results in a buffer overflow.\
    \ Buffer overflows can lead to anything from a segmentation fault to a security\
    \ vulnerability.\n\n\n## Recommendation\nCheck the offsets and sizes used in the\
    \ highlighted operations to ensure that a buffer overflow will not occur.\n\n\n\
    ## Example\n\n```cpp\n#define SIZE 30\n\nint f(char * s) {\n\tchar buf[20]; //buf\
    \ not set to use SIZE macro\n\n\tstrncpy(buf, s, SIZE); //wrong: copy may exceed\
    \ size of buf\n\n\tfor (int i = 0; i < SIZE; i++) { //wrong: upper limit that\
    \ is higher than array size\n\t\tcout << array[i];\n\t}\n}\n\n```\n\n## References\n\
    * I. Gerg. *An Overview and Example of the Buffer-Overflow Exploit*. IANewsletter\
    \ vol 7 no 4. 2005.\n* M. Donaldson. *Inside the Buffer Overflow Attack: Mechanism,\
    \ Method &amp; Prevention*. SANS Institute InfoSec Reading Room. 2002.\n* Common\
    \ Weakness Enumeration: [CWE-119](https://cwe.mitre.org/data/definitions/119.html).\n\
    * Common Weakness Enumeration: [CWE-131](https://cwe.mitre.org/data/definitions/131.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/SizeCheck.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/SizeCheck.bqrs
  metadata:
    name: Not enough memory allocated for pointer type
    description: |-
      Calling 'malloc', 'calloc' or 'realloc' without allocating enough memory to contain
                    an instance of the type of the pointer may result in a buffer overflow
    kind: problem
    problem.severity: warning
    security-severity: 8.1
    precision: medium
    id: cpp/allocation-too-small
    tags: |-
      reliability
             security
             external/cwe/cwe-131
             external/cwe/cwe-122
  queryHelp: "# Not enough memory allocated for pointer type\nWhen you allocate an\
    \ array from memory using `malloc`, `calloc` or `realloc`, you should ensure that\
    \ you allocate enough memory to contain an instance of the required pointer type.\
    \ Calls that are assigned to a non-void pointer variable, but do not allocate\
    \ enough memory will cause a buffer overflow when a field accessed on the pointer\
    \ points to memory that is beyond the allocated array. Buffer overflows can lead\
    \ to anything from a segmentation fault to a security vulnerability.\n\n\n## Recommendation\n\
    The highlighted call allocates memory that is too small to contain an instance\
    \ of the type of the pointer, which can cause a memory overrun. Use the `sizeof`\
    \ operator to ensure that the function call allocates enough memory for that type.\n\
    \n\n## Example\n\n```cpp\n#define RECORD_SIZE 30  //incorrect or outdated size\
    \ for record\ntypedef struct {\n\tchar name[30];\n\tint status;\n} Record;\n\n\
    void f() {\n\tRecord* p = malloc(RECORD_SIZE); //not of sufficient size to hold\
    \ a Record\n\t...\n}\n\n```\n\n## References\n* I. Gerg. *An Overview and Example\
    \ of the Buffer-Overflow Exploit*. IANewsletter vol 7 no 4. 2005.\n* M. Donaldson.\
    \ *Inside the Buffer Overflow Attack: Mechanism, Method &amp; Prevention*. SANS\
    \ Institute InfoSec Reading Room. 2002.\n* Common Weakness Enumeration: [CWE-131](https://cwe.mitre.org/data/definitions/131.html).\n\
    * Common Weakness Enumeration: [CWE-122](https://cwe.mitre.org/data/definitions/122.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/SizeCheck2.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/SizeCheck2.bqrs
  metadata:
    name: Not enough memory allocated for array of pointer type
    description: |-
      Calling 'malloc', 'calloc' or 'realloc' without allocating enough memory to contain
                    multiple instances of the type of the pointer may result in a buffer overflow
    kind: problem
    problem.severity: warning
    security-severity: 8.1
    precision: medium
    id: cpp/suspicious-allocation-size
    tags: |-
      reliability
             security
             external/cwe/cwe-131
             external/cwe/cwe-122
  queryHelp: "# Not enough memory allocated for array of pointer type\nWhen you allocate\
    \ an array from memory using `malloc`, `calloc` or `realloc`, you should ensure\
    \ that you allocate enough memory to contain a multiple of the size of the required\
    \ pointer type. Calls that are assigned to a non-void pointer variable, but do\
    \ not allocate enough memory will cause a buffer overflow when a field accessed\
    \ on the pointer points to memory that is beyond the allocated array. Buffer overflows\
    \ can lead to anything from a segmentation fault to a security vulnerability.\n\
    \n\n## Recommendation\nThe highlighted call allocates memory that is not a multiple\
    \ of the size of the pointer type, which can cause a memory overrun. Use the `sizeof`\
    \ operator to ensure that the function call allocates enough memory for that type.\n\
    \n\n## Example\n\n```cpp\n#define RECORD_SIZE 30  //incorrect or outdated size\
    \ for record\ntypedef struct {\n\tchar name[30];\n\tint status;\n} Record;\n\n\
    void f() {\n\tRecord* p = malloc(RECORD_SIZE * 4); //wrong: not a multiple of\
    \ the size of Record\n\tp[3].status = 1; //will most likely segfault\n\t...\n\
    }\n\n```\n\n## References\n* I. Gerg. *An Overview and Example of the Buffer-Overflow\
    \ Exploit*. IANewsletter vol 7 no 4. 2005.\n* M. Donaldson. *Inside the Buffer\
    \ Overflow Attack: Mechanism, Method &amp; Prevention*. SANS Institute InfoSec\
    \ Reading Room. 2002.\n* Common Weakness Enumeration: [CWE-131](https://cwe.mitre.org/data/definitions/131.html).\n\
    * Common Weakness Enumeration: [CWE-122](https://cwe.mitre.org/data/definitions/122.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/UseAfterFree.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/UseAfterFree.bqrs
  metadata:
    name: Potential use after free
    description: An allocated memory block is used after it has been freed. Behavior
      in such cases is undefined and can cause memory corruption.
    kind: path-problem
    precision: high
    id: cpp/use-after-free
    problem.severity: warning
    security-severity: 9.3
    tags: |-
      reliability
             security
             external/cwe/cwe-416
  queryHelp: "# Potential use after free\nThis rule finds accesses through a pointer\
    \ of a memory location that has already been freed (i.e. through a dangling pointer).\
    \ Such memory blocks have already been released to the dynamic memory manager,\
    \ and modifying them can lead to anything from a segfault to memory corruption\
    \ that would cause subsequent calls to the dynamic memory manager to behave erratically,\
    \ to a possible security vulnerability.\n\n> WARNING: This check is an approximation,\
    \ so some results may not be actual defects in the program. It is not possible\
    \ in general to compute the values of pointers without running the program with\
    \ all input data.\n\n## Recommendation\nEnsure that all execution paths that access\
    \ memory through a pointer never access that pointer after it is freed.\n\n\n\
    ## Example\n\n```cpp\nvoid f() {\n\tchar* buf = new char[SIZE];\n\t...\n\tif (error)\
    \ {\n\t\tdelete buf; //error handling has freed the buffer\n\t}\n\t...\n\tlog_contents(buf);\
    \ //but it is still used here for logging\n\t...\n}\n\n```\n\n## References\n\
    * I. Gerg. *An Overview and Example of the Buffer-Overflow Exploit*. IANewsletter\
    \ vol 7 no 4. 2005.\n* M. Donaldson. *Inside the Buffer Overflow Attack: Mechanism,\
    \ Method &amp; Prevention*. SANS Institute InfoSec Reading Room. 2002.\n* Common\
    \ Weakness Enumeration: [CWE-416](https://cwe.mitre.org/data/definitions/416.html).\n"
 -
