  relativeQueryPath: Best Practices/Exceptions/AccidentalRethrow.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Exceptions/AccidentalRethrow.bqrs
  metadata:
    name: Accidental rethrow
    description: "When there is nothing to rethrow, attempting to rethrow an exception\
      \ will terminate the program."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/rethrow-no-exception
    tags: |-
      reliability
             correctness
             exceptions
  queryHelp: |
    # Accidental rethrow
    The C++ `throw` expression can take several forms. One form throws a new exception, whereas the other re-throws the current exception. In the latter case, if there is no current exception, then the program will be terminated. Presence of a re-throw outside of an exception handling context is often caused by the programmer not knowing what kind of exception to throw.


    ## Recommendation
    The `throw` expression should be changed to throw a particular type of exception.


    ## Example
    ```cpp

    void bad() {
      /* ... */
      if(error_condition)
        throw;
    }

    void good() {
      /* ... */
      if(error_condition)
        throw std::exception("Something went wrong.");
    }

    ```

    ## References
    * Open Standards: [Standard for Programming Language C++, draft n3337](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2012/n3337.pdf) \[except.throw\], clause 9, page 380.
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/Exceptions/CatchingByValue.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Exceptions/CatchingByValue.bqrs
  metadata:
    name: Catching by value
    description: "Catching an exception by value will create a copy of the thrown\
      \ exception, thereby potentially slicing the original exception object."
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/catch-by-value
    tags: |-
      efficiency
             correctness
             exceptions
  queryHelp: |
    # Catching by value
    Catching an exception by value will create a new local variable which is a copy of the originally thrown object. Creating the copy is slightly wasteful, but not catastrophic. More worrisome is the fact that if the type being caught is a strict supertype of the originally thrown type, then the copy might not contain as much information as the original exception.


    ## Recommendation
    The parameter to the `catch` block should have its type changed from `T` to `T&` or `const T&`.


    ## Example
    ```cpp

    void bad() {
      try {
        /* ... */
      }
      catch(std::exception a_copy_of_the_thrown_exception) {
        // Do something with a_copy_of_the_thrown_exception
      }
    }

    void good() {
      try {
        /* ... */
      }
      catch(const std::exception& the_thrown_exception) {
        // Do something with the_thrown_exception
      }
    }

    ```

    ## References
    * C++ FAQ: [ What should I throw?](https://isocpp.org/wiki/faq/exceptions#what-to-throw), [ What should I catch?](https://isocpp.org/wiki/faq/exceptions#what-to-catch).
    * Wikibooks: [ Throwing objects](https://en.wikibooks.org/wiki/C%2B%2B_Programming/Exception_Handling#Throwing_objects).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/Exceptions/LeakyCatch.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Exceptions/LeakyCatch.bqrs
  metadata:
    name: Leaky catch
    description: "If an exception is allocated on the heap, then it should be deleted\
      \ when caught."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/catch-missing-free
    tags: |-
      efficiency
             correctness
             exceptions
             external/cwe/cwe-401
  queryHelp: |
    # Leaky catch
    Modern C++ code and frameworks should not throw or catch pointers. Older frameworks, such as Microsoft's MFC, do throw and catch pointers. Said pointers will generally point to an exception object allocated on the heap, and therefore need to be freed when they are caught. Failure to free them will result in a memory leak.


    ## Recommendation
    The `catch` block should be augmented to delete the exception pointer.


    ## Example
    ```cpp

    void bad() {
      try {
        /* ... */
      }
      catch(CException* e) {
        e->ReportError();
      }
    }

    void good() {
      try {
        /* ... */
      }
      catch(CException* e) {
        e->ReportError();
        e->Delete();
      }
    }

    ```

    ## References
    * MSDN Library for MFC: [Exceptions: Catching and Deleting Exceptions](https://docs.microsoft.com/en-us/cpp/mfc/exceptions-catching-and-deleting-exceptions).
    * Common Weakness Enumeration: [CWE-401](https://cwe.mitre.org/data/definitions/401.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/Exceptions/ThrowingPointers.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Exceptions/ThrowingPointers.bqrs
  metadata:
    name: Throwing pointers
    description: Exceptions should be objects rather than pointers to objects.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/throwing-pointer
    tags: |-
      efficiency
             correctness
             exceptions
  queryHelp: |
    # Throwing pointers
    As C++ is not a garbage collected language, exceptions should not be dynamically allocated. Dynamically allocating an exception puts an onus on every `catch` site to ensure that the memory is freed.

    As a special case, it is permissible to throw anything derived from Microsoft MFC's `CException` class as a pointer. This is for historical reasons; modern code and modern frameworks should not throw pointer values.


    ## Recommendation
    The `new` keyword immediately following the `throw` keyword should be removed. Any `catch` sites which previously caught the pointer should be changed to catch by reference or `const` reference.


    ## Example
    ```cpp

    void bad() {
      throw new std::exception("This is how not to throw an exception");
    }

    void good() {
      throw std::exception("This is how to throw an exception");
    }

    ```

    ## References
    * C++ FAQ: [ What should I throw?](https://isocpp.org/wiki/faq/exceptions#what-to-throw), [ What should I catch?](https://isocpp.org/wiki/faq/exceptions#what-to-catch).
    * Wikibooks: [ Throwing objects](https://en.wikibooks.org/wiki/C%2B%2B_Programming/Exception_Handling#Throwing_objects).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/GuardedFree.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/GuardedFree.bqrs
  metadata:
    name: Guarded Free
    description: |-
      NULL-condition guards before function calls to the memory-deallocation
                    function free(3) are unnecessary, because passing NULL to free(3) is a no-op.
    kind: problem
    problem.severity: recommendation
    precision: very-high
    id: cpp/guarded-free
    tags: |-
      maintainability
             readability
  queryHelp: "# Guarded Free\nThe `free` function, which deallocates heap memory,\
    \ may accept a NULL pointer and take no action. Therefore, it is unnecessary to\
    \ check the argument for the value of NULL before a function call to `free`. As\
    \ such, these guards may hinder performance and readability.\n\n\n## Recommendation\n\
    A function call to `free` should not depend upon the value of its argument. Delete\
    \ the condition preceding a function call to `free` when its only purpose is to\
    \ check the value of the pointer to be freed.\n\n\n## Example\n\n```cpp\nvoid\
    \ test()\n{\n    char *foo = malloc(100);\n\n    // BAD\n    if (foo)        \
    \  \n        free(foo);\n\n    // GOOD\n    free(foo);\n}\n```\nIn this example,\
    \ the condition checking the value of `foo` can be deleted.\n\n\n## References\n\
    * The Open Group Base Specifications Issue 7, 2018 Edition: [free - free allocated\
    \ memory](https://pubs.opengroup.org/onlinepubs/9699919799/functions/free.html).\n"
 -
