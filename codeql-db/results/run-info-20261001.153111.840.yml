  relativeQueryPath: Security/CWE/CWE-114/UncontrolledProcessOperation.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-114/UncontrolledProcessOperation.bqrs
  metadata:
    name: Uncontrolled process operation
    description: |-
      Using externally controlled strings in a process
                    operation can allow an attacker to execute malicious
                    commands.
    kind: path-problem
    problem.severity: warning
    security-severity: 8.2
    precision: medium
    id: cpp/uncontrolled-process-operation
    tags: |-
      security
             external/cwe/cwe-073
             external/cwe/cwe-078
             external/cwe/cwe-114
  queryHelp: "# Uncontrolled process operation\nThe code passes user input directly\
    \ to `system`, `dlopen`, `LoadLibrary` or some other process or library routine.\
    \ As a result, the user can cause execution of arbitrary code.\n\n\n## Recommendation\n\
    If possible, use hard-coded string literals for the command to run or library\
    \ to load. Instead of passing the user input directly to the process or library\
    \ function, examine the user input and then choose among hard-coded string literals.\n\
    \nIf the applicable libraries or commands cannot be determined at compile time,\
    \ then add code to verify that the user-input string is safe before using it.\n\
    \n\n## Example\n\n```c\nint main(int argc, char** argv) {\n  char *lib = argv[2];\n\
    \  \n  // BAD: the user can cause arbitrary code to be loaded\n  void* handle\
    \ = dlopen(lib, RTLD_LAZY);\n  \n  // GOOD: only hard-coded libraries can be loaded\n\
    \  void* handle2;\n\n  if (!strcmp(lib, \"inmem\")) {\n    handle2 = dlopen(\"\
    /usr/share/dbwrap/inmem\", RTLD_LAZY);\n  } else if (!strcmp(lib, \"mysql\"))\
    \ {\n    handle2 = dlopen(\"/usr/share/dbwrap/mysql\", RTLD_LAZY);\n  } else {\n\
    \    die(\"Invalid library specified\\n\");\n  }\n}\n\n```\n\n## References\n\
    * Common Weakness Enumeration: [CWE-73](https://cwe.mitre.org/data/definitions/73.html).\n\
    * Common Weakness Enumeration: [CWE-78](https://cwe.mitre.org/data/definitions/78.html).\n\
    * Common Weakness Enumeration: [CWE-114](https://cwe.mitre.org/data/definitions/114.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-119/OverflowBuffer.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-119/OverflowBuffer.bqrs
  metadata:
    name: Call to memory access function may overflow buffer
    description: |-
      Incorrect use of a function that accesses a memory
                    buffer may read or write data past the end of that
                    buffer.
    kind: problem
    id: cpp/overflow-buffer
    problem.severity: warning
    security-severity: 9.3
    precision: medium
    tags: |-
      security
             external/cwe/cwe-119
             external/cwe/cwe-121
             external/cwe/cwe-122
             external/cwe/cwe-126
  queryHelp: |
    # Call to memory access function may overflow buffer
    The software uses a function to access a memory buffer in a way that may read or write data past the end of that buffer. This may result in software instability, improper access to or corruption of sensitive information, or code execution by an attacker.


    ## Recommendation
    When accessing buffers with functions such as `memcpy`, `memset` or `strncpy`, ensure that the size value for the operation is no greater than the amount of space available in the destination buffer. Failure to do this may permit a buffer overwrite to occur. Also ensure that the size value is no greater than the amount of data in the source buffer, to prevent a buffer overread from occurring.


    ## Example
    In the following example, `memcpy` is used to fill a buffer with data from a string.


    ```c
    const char *message = "Hello";
    char password[32];
    char buffer[256];

    memcpy(buffer, message, 256);

    ```
    Although the size of the operation matches the destination buffer, the source is only 6 bytes long so an overread will occur. This could copy sensitive data from nearby areas of memory (such as the local variable `password` in this example) into the buffer as well, potentially making it visible to an attacker.

    To fix this issue, reduce the size of the `memcpy` to the smaller of the source and destination buffers, `min(256, strlen(message) + 1)`. Alternatively in this case it would be more appropriate to use the `strncpy` function rather than `memcpy`.


    ## References
    * Common Weakness Enumeration: [CWE-119](https://cwe.mitre.org/data/definitions/119.html).
