  metadata:
    name: NULL application name with an unquoted path in call to CreateProcess
    description: "Calling a function of the CreateProcess* family of functions, where\
      \ the path contains spaces, introduces a security vulnerability."
    id: cpp/unsafe-create-process-call
    kind: problem
    problem.severity: error
    security-severity: 7.8
    precision: medium
    msrc.severity: important
    tags: |-
      security
             external/cwe/cwe-428
  queryHelp: "# NULL application name with an unquoted path in call to CreateProcess\n\
    This query indicates that there is a call to a function of the `CreateProcess*`\
    \ family of functions, which introduces a security vulnerability.\n\n\n## Recommendation\n\
    Do not use `NULL` for the `lpApplicationName` argument to the `CreateProcess*`\
    \ function.\n\nIf you pass `NULL` for `lpApplicationName`, use quotation marks\
    \ around the executable path in `lpCommandLine`.\n\n\n## Example\nIn the following\
    \ example, `CreateProcessW` is called with a `NULL` value for `lpApplicationName`,\
    \ and the value for `lpCommandLine` that represent the application path is not\
    \ quoted and has spaces in it.\n\nIf an attacker has access to the file system,\
    \ they can elevate privileges by creating a file such as `C:\\Program.exe` that\
    \ will be executed instead of the intended application.\n\n\n```cpp\nSTARTUPINFOW\
    \ si;\nPROCESS_INFORMATION pi;\n\n// ... \n\nCreateProcessW(                 \
    \          // BUG\n    NULL,                                 // lpApplicationName\n\
    \    (LPWSTR)L\"C:\\\\Program Files\\\\MyApp\",  // lpCommandLine\n    NULL, NULL,\
    \ FALSE, 0, NULL, NULL, &si, &pi);\n\n// ...\n```\nTo fix this issue, specify\
    \ a valid string for `lpApplicationName`, or quote the path for `lpCommandLine`.\
    \ For example:\n\n`(LPWSTR)L\"\\\"C:\\\\Program Files\\\\MyApp\\\"\", // lpCommandLine`\n\
    \n\n## References\n* [CreateProcessA function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/processthreadsapi/nf-processthreadsapi-createprocessa)\n\
    * [CreateProcessW function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/processthreadsapi/nf-processthreadsapi-createprocessw)\n\
    * [CreateProcessAsUserA function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/processthreadsapi/nf-processthreadsapi-createprocessasusera)\n\
    * [CreateProcessAsUserW function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/processthreadsapi/nf-processthreadsapi-createprocessasuserw)\n\
    * [CreateProcessWithLogonW function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/winbase/nf-winbase-createprocesswithlogonw)\n\
    * [CreateProcessWithTokenW function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/winbase/nf-winbase-createprocesswithtokenw)\n\
    * Common Weakness Enumeration: [CWE-428](https://cwe.mitre.org/data/definitions/428.html).\n"
