  relativeQueryPath: jsf/4.10 Classes/AV Rule 97.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.10 Classes/AV Rule 97.bqrs
  metadata:
    name: No raw arrays in interfaces
    description: Arrays should not be used in interfaces. Arrays degenerate to pointers
      when passed as parameters. This array decay problem has long been known to be
      a source of errors. Consider using std::vector or encapsulating the array in
      an Array class.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/array-in-interface
    tags: |-
      reliability
             readability
             language-features
             external/jsf
  queryHelp: "# No raw arrays in interfaces\nThis rule finds class members (functions\
    \ or data) that are or use arrays. This is particularly important for functions\
    \ with array type parameters, as these parameters are treated as pointers to the\
    \ array's first element inside the function (array decay). Assuming that it is\
    \ still has the type of the array passed to the function can cause unexpected\
    \ behavior (e.g. when using the `sizeof` operator).\n\n\n## Recommendation\nUse\
    \ the `Array` class, or explicitly declare the variable/parameter as a pointer\
    \ so there is no possibility for confusion.\n\n\n## Example\n\n```cpp\nvoid f(char\
    \ buf[]) { //wrong: uses an array as a parameter type\n\tint length = sizeof(buf);\
    \ //will return sizeof(char*), not the size of the array passed\n\t...\n}\n\n\
    ```\n\n## References\n* AV Rule 97, *Joint Strike Fighter Air Vehicle C++ Coding\
    \ Standards*. Lockheed Martin Corporation, 2005.\n* [comp.lang.c FAQ list · Question\
    \ 6.3 ](http://c-faq.com/aryptr/aryptrequiv.html)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.13 Functions/AV Rule 107.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.13 Functions/AV Rule 107.bqrs
  metadata:
    name: Function declared in block
    description: "Functions should always be declared at file scope. It is confusing\
      \ to declare a function at block scope, and the visibility of the function is\
      \ not what would be expected."
    kind: problem
    problem.severity: recommendation
    precision: very-high
    id: cpp/function-in-block
    tags: |-
      maintainability
             readability
             external/jsf
  queryHelp: "# Function declared in block\nThis rule finds functions that are declared\
    \ in a block. It is confusing to declare a function at block scope, and the visibility\
    \ of the function is not what would be expected. `extern` function declarations\
    \ inside a block, which are allowed in C, are particularly confusing, as the scope\
    \ of the declaration is the entire file, not just the block where it was declared.\n\
    \n\n## Recommendation\nDeclare the function in file scope to prevent any confusion\
    \ as to its visibility.\n\n\n## Example\n\n```cpp\nint f() {\n\textern int other();\
    \ //scope of externs is the entire file, not just the \n\t                   \
    \ //block where it is declared\n\t...\n\tother()\n}\n\nint g() {\n\tother(); //this\
    \ will use the other() function declared inside f()\n}\n\n```\n\n## References\n\
    * AV Rule 107, *Joint Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed\
    \ Martin Corporation, 2005.\n* MISRA C++ Rule 3-1-2, *Guidelines for the use of\
    \ the C++ language in critical systems*. The Motor Industry Software Reliability\
    \ Associate, 2008.\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.13 Functions/AV Rule 114.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.13 Functions/AV Rule 114.bqrs
  metadata:
    name: Missing return statement
    description: All functions that are not void should return a value on every exit
      path.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/missing-return
    tags: |-
      reliability
             readability
             language-features
             external/jsf
  queryHelp: "# Missing return statement\nThis rule finds non-void functions with\
    \ an execution path that does not return through an explicit return statement.\
    \ The return value in such a case is undefined. For example, in the `cdecl` calling\
    \ convention for x86, it would be whatever value was in the AX/EAX register when\
    \ the function returned, assuming the function had a non-float return type that\
    \ can fit in a machine word.\n\n> WARNING: This check is an approximation, so\
    \ some results may not be actual defects in the program. It is not possible in\
    \ general to compute the actual branch taken in conditional statements such as\
    \ \"if\" without running the program with all possible input data. This means\
    \ that it is not possible to determine if a particular statement is going to be\
    \ executed.\n\n## Recommendation\nMake sure that all execution paths in the function\
    \ exit through an explicit return statement.\n\n\n## Example\n\n```cpp\nint f()\
    \ {\n\t...\n\tif (error) {\n\t\treturn -1;\n\t}\n\t...\n\t//wrong: no explicit\
    \ return here, value returned is undefined\n}\n\n```\n\n## References\n* AV Rule\
    \ 114, *Joint Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin\
    \ Corporation, 2005.\n* MISRA C++ Rule 8-4-3, *Guidelines for the use of the C++\
    \ language in critical systems*. The Motor Industry Software Reliability Associate,\
    \ 2008.\n* MSDN Library: [return Statement (C++)](https://docs.microsoft.com/en-us/cpp/cpp/return-statement-cpp).\n"
 -
