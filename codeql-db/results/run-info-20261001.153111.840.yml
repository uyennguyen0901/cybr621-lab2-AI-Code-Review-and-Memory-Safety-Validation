  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-676/DangerousUseOfCin.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-676/DangerousUseOfCin.bqrs
  metadata:
    name: Dangerous use of 'cin'
    description: |-
      Using `cin` without specifying the length of the input
                    may be dangerous.
    kind: problem
    problem.severity: error
    security-severity: 10.0
    precision: high
    id: cpp/dangerous-cin
    tags: |-
      reliability
             security
             external/cwe/cwe-676
  queryHelp: "# Dangerous use of 'cin'\nThis rule finds calls to `std::istream::operator>>`\
    \ on `std::cin` without a preceding call to `cin.width`. Consuming input from\
    \ `cin` without specifying the length of the input is dangerous due to the possibility\
    \ of buffer overflows.\n\n\n## Recommendation\nAlways specify the length of any\
    \ input expected from `cin` by calling `cin.width` before consuming the input.\n\
    \n\n## Example\nThe following example shows both a dangerous and a safe way to\
    \ consume input from `cin`.\n\n\n```cpp\n#define BUFFER_SIZE 20\n\nvoid bad()\n\
    {\n\tchar buffer[BUFFER_SIZE];\n\t// BAD: Use of 'cin' without specifying the\
    \ length of the input.\n\tcin >> buffer;\n\tbuffer[BUFFER_SIZE-1] = '\\0';\n}\n\
    \nvoid good()\n{\n\tchar buffer[BUFFER_SIZE];\n\t// GOOD: Specifying the length\
    \ of the input before using 'cin'.\n\tcin.width(BUFFER_SIZE);\n\tcin >> buffer;\n\
    \tbuffer[BUFFER_SIZE-1] = '\\0';\n}\n\n```\n\n## References\n* Common Weakness\
    \ Enumeration: [CWE-676](https://cwe.mitre.org/data/definitions/676.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-676/PotentiallyDangerousFunction.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-676/PotentiallyDangerousFunction.bqrs
  metadata:
    name: Use of potentially dangerous function
    description: Use of a standard library function that is not thread-safe.
    kind: problem
    problem.severity: warning
    security-severity: 10.0
    precision: medium
    id: cpp/potentially-dangerous-function
    tags: |-
      reliability
             security
             external/cwe/cwe-676
  queryHelp: |
    # Use of potentially dangerous function
    This rule finds calls to functions that are dangerous to use. Currently, it checks for calls to `gmtime`, `localtime`, `ctime` and `asctime`.

    The time related functions such as `gmtime` fill data into a `tm` struct or `char` array in shared memory and then returns a pointer to that memory. If the function is called from multiple places in the same program, and especially if it is called from multiple threads in the same program, then the calls will overwrite each other's data.


    ## Recommendation
    Replace calls to `gmtime` with `gmtime_r`. With `gmtime_r`, the application code manages allocation of the `tm` struct. That way, separate calls to the function can use their own storage.

    Similarly replace calls to `localtime` with `localtime_r`, calls to `ctime` with `ctime_r` and calls to `asctime` with `asctime_r` (if those functions exist on your platform).


    ## Example
    The following example checks the local time in two ways:


    ```c
    // BAD: using gmtime
    int is_morning_bad() {
        const time_t now_seconds = time(NULL);
        struct tm *now = gmtime(&now_seconds);
        return (now->tm_hour < 12);
    }

    // GOOD: using gmtime_r
    int is_morning_good() {
        const time_t now_seconds = time(NULL);
        struct tm now;
        gmtime_r(&now_seconds, &now);
        return (now.tm_hour < 12);
    }

    ```
    The first version uses `gmtime`, so it is vulnerable to its data being overwritten by another thread. Even if this code is not used in a multi-threaded context right now, future changes may make the program multi-threaded. The second version of the code uses `gmtime_r`. Since it allocates a new `tm` struct on every call, it is immune to other calls to `gmtime` or `gmtime_r`.


    ## References
    * SEI CERT C Coding Standard: [CON33-C. Avoid race conditions when using library functions](https://wiki.sei.cmu.edu/confluence/display/c/CON33-C.+Avoid+race+conditions+when+using+library+functions).
    * Common Weakness Enumeration: [CWE-676](https://cwe.mitre.org/data/definitions/676.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-704/WcharCharConversion.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-704/WcharCharConversion.bqrs
  metadata:
    name: Cast from char* to wchar_t*
    description: |-
      Casting a byte string to a wide-character string is likely
                    to yield a string that is incorrectly terminated or aligned.
                    This can lead to undefined behavior, including buffer overruns.
    kind: problem
    id: cpp/incorrect-string-type-conversion
    problem.severity: error
    security-severity: 8.8
    precision: high
    tags: |-
      security
             external/cwe/cwe-704
  queryHelp: |
    # Cast from char* to wchar_t*
    This rule indicates a potentially incorrect cast from an byte string (`char *`) to a wide-character string (`wchar_t *`).

    This cast might yield strings that are not correctly terminated; including potential buffer overruns when using such strings with some dangerous APIs.


    ## Recommendation
    Do not explicitly cast byte strings to wide-character strings.

    For string literals, prepend the literal string with the letter "L" to indicate that the string is a wide-character string (`wchar_t *`).

    For converting a byte literal to a wide-character string literal, you would need to use the appropriate conversion function for the platform you are using. Please see the references section for options according to your platform.


    ## Example
    In the following example, an byte string literal (`"a"`) is cast to a wide-character string.


    ```cpp
    wchar_t* pSrc;

    pSrc = (wchar_t*)"a"; // casting a byte-string literal "a" to a wide-character string
    ```
    To fix this issue, prepend the literal with the letter "L" (`L"a"`) to define it as a wide-character string.


    ## References
    * General resources: [std::mbstowcs](https://en.cppreference.com/w/cpp/string/multibyte/mbstowcs)
    * Microsoft specific resources: [Security Considerations: International Features](https://docs.microsoft.com/en-us/windows/desktop/Intl/security-considerations--international-features)
    * Common Weakness Enumeration: [CWE-704](https://cwe.mitre.org/data/definitions/704.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-732/DoNotCreateWorldWritable.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-732/DoNotCreateWorldWritable.bqrs
  metadata:
    name: File created without restricting permissions
    description: Creating a file that is world-writable can allow an attacker to write
      to the file.
    kind: problem
    problem.severity: warning
    security-severity: 7.8
    precision: medium
    id: cpp/world-writable-file-creation
    tags: |-
      security
             external/cwe/cwe-732
  queryHelp: "# File created without restricting permissions\nWhen you create a file,\
    \ take care to give it the most restrictive permissions possible. A typical mistake\
    \ is to create the file with world-writable permissions. This can allow an attacker\
    \ to write to the file, which can give them unexpected control over the program.\n\
    \n\n## Recommendation\nFiles should usually be created with write permissions\
    \ only for the current user. If broader permissions are needed, including the\
    \ users' group should be sufficient. It is very rare that a file needs to be world-writable,\
    \ and care should be taken not to make assumptions about the contents of any such\
    \ file.\n\nOn Unix systems, it is possible for the user who runs the program to\
    \ restrict file creation permissions using `umask`. However, a program should\
    \ not assume that the user will set an `umask`, and should still set restrictive\
    \ permissions by default.\n\n\n## Example\nThis example shows two ways of writing\
    \ a default configuration file. Software often does this to provide the user with\
    \ a convenient starting point for defining their own configuration. However, configuration\
    \ files can also control important aspects of the software's behavior, so it is\
    \ important that they cannot be controlled by an attacker.\n\nThe first example\
    \ creates the default configuration file with the usual \"default\" Unix permissions,\
    \ `0666`. This makes the file world-writable, so that an attacker could write\
    \ in their own configuration that would be read by the program. The second example\
    \ uses more restrictive permissions: a combination of the standard Unix constants\
    \ `S_IWUSR` and `S_IRUSR` which means that only the current user will have read\
    \ and write access to the file. The third example shows another way to create\
    \ a file with more restrictive permissions if a `FILE *` stream pointer is required\
    \ rather than a file descriptor.\n\n\n```c\nvoid write_default_config_bad() {\n\
    \t// BAD - this is world-writable so any user can overwrite the config\n\tint\
    \ out = creat(OUTFILE, 0666);\n\tif (out < 0) {\n\t\t// handle error\n\t}\n\n\t\
    dprintf(out, \"%s\", DEFAULT_CONFIG);\n\tclose(out);\n}\n\nvoid write_default_config_good()\
    \ {\n\t// GOOD - this allows only the current user to modify the file\n\tint out\
    \ = creat(OUTFILE, S_IWUSR | S_IRUSR);\n\tif (out < 0) {\n\t\t// handle error\n\
    \t}\n\n\tdprintf(out, \"%s\", DEFAULT_CONFIG);\n\tclose(out);\n}\n\nvoid write_default_config_good_2()\
    \ {\n\t// GOOD - this allows only the current user to modify the file\n\tint out\
    \ = open(OUTFILE, O_WRONLY | O_CREAT, S_IWUSR | S_IRUSR);\n\tif (out < 0) {\n\t\
    \t// handle error\n\t}\n\n\tFILE *fd = fdopen(out, \"w\");\n\tif (fd == NULL)\
    \ {\n\t\tclose(out);\n\t\t// handle error\n\t}\n\n\tfprintf(fd, \"%s\", DEFAULT_CONFIG);\n\
    \tfclose(fd);\n}\n\n```\n\n## References\n* The CERT Oracle Secure Coding Standard\
    \ for C: [ FIO06-C. Create files with appropriate access permissions ](https://www.securecoding.cert.org/confluence/display/c/FIO06-C.+Create+files+with+appropriate+access+permissions).\n\
    * Common Weakness Enumeration: [CWE-732](https://cwe.mitre.org/data/definitions/732.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-732/OpenCallMissingModeArgument.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-732/OpenCallMissingModeArgument.bqrs
  metadata:
    name: File opened with O_CREAT flag but without mode argument
    description: Opening a file with the O_CREAT flag but without mode argument reads
      arbitrary bytes from the stack.
    kind: problem
    problem.severity: error
    security-severity: 7.8
    precision: high
    id: cpp/open-call-with-mode-argument
    tags: |-
      security
             external/cwe/cwe-732
  queryHelp: "# File opened with O_CREAT flag but without mode argument\nWhen opening\
    \ a file with the `O_CREAT` or `O_TMPFILE` flag, the `mode` must be supplied.\
    \ If the `mode` argument is omitted, some arbitrary bytes from the stack will\
    \ be used as the file mode. This leaks some bits from the stack into the permissions\
    \ of the file.\n\n\n## Recommendation\nThe `mode` must be supplied when `O_CREAT`\
    \ or `O_TMPFILE` is specified.\n\n\n## Example\nThe first example opens a file\
    \ with the `O_CREAT` flag without supplying the `mode` argument. In this case\
    \ arbitrary bytes from the stack will be used as `mode` argument. The second example\
    \ correctly supplies the `mode` argument and creates a file that is user readable\
    \ and writable.\n\n\n```c\nint open_file_bad() {\n\t// BAD - this uses arbitrary\
    \ bytes from the stack as mode argument\n        return open(FILE, O_CREAT)\n\
    }\n\nint open_file_good() {\n\t// GOOD - the mode argument is supplied\n     \
    \   return open(FILE, O_CREAT, S_IRUSR | S_IWUSR)\n}\n\n```\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-732/UnsafeDaclSecurityDescriptor.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-732/UnsafeDaclSecurityDescriptor.bqrs
  metadata:
    name: Setting a DACL to NULL in a SECURITY_DESCRIPTOR
    description: |-
      Setting a DACL to NULL in a SECURITY_DESCRIPTOR will result in an unprotected object.
                    If the DACL that belongs to the security descriptor of an object is set to NULL, a null DACL is created.
                    A null DACL grants full access to any user who requests it;
                    normal security checking is not performed with respect to the object.
    id: cpp/unsafe-dacl-security-descriptor
    kind: problem
    problem.severity: error
    security-severity: 7.8
    precision: high
    tags: |-
      security
             external/cwe/cwe-732
  queryHelp: |
    # Setting a DACL to NULL in a SECURITY_DESCRIPTOR
    This query indicates that a call is setting the DACL field in a `SECURITY_DESCRIPTOR` to null.

    When using `SetSecurityDescriptorDacl` to set a discretionary access control (DACL), setting the `bDaclPresent` argument to `TRUE` indicates the presence of a DACL in the security description in the argument `pDacl`.

    When the `pDacl` parameter does not point to a DACL (i.e. it is `NULL`) and the `bDaclPresent` flag is `TRUE`, a `NULL DACL` is specified.

    A `NULL DACL` grants full access to any user who requests it; normal security checking is not performed with respect to the object.


    ## Recommendation
    You should not use a `NULL DACL` with an object because any user can change the DACL and owner of the security descriptor.


    ## Example
    In the following example, the call to `SetSecurityDescriptorDacl` is setting an unsafe DACL (`NULL DACL`) to the security descriptor.


    ```cpp
    SECURITY_DESCRIPTOR  pSD;
    SECURITY_ATTRIBUTES  SA;

    if (!InitializeSecurityDescriptor(&pSD, SECURITY_DESCRIPTOR_REVISION))
    {
        // error handling
    }
    if (!SetSecurityDescriptorDacl(&pSD,
        TRUE,   // bDaclPresent - this value indicates the presence of a DACL in the security descriptor
        NULL,   // pDacl - the pDacl parameter does not point to a DACL. All access will be allowed
        FALSE))
    {
        // error handling
    }

    ```
    To fix this issue, `pDacl` argument should be a pointer to an `ACL` structure that specifies the DACL for the security descriptor.


    ## References
    * [SetSecurityDescriptorDacl function (Microsoft documentation).](https://docs.microsoft.com/en-us/windows/desktop/api/securitybaseapi/nf-securitybaseapi-setsecuritydescriptordacl)
    * Common Weakness Enumeration: [CWE-732](https://cwe.mitre.org/data/definitions/732.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-807/TaintedCondition.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-807/TaintedCondition.bqrs
  metadata:
    name: Untrusted input for a condition
    description: |-
      Using untrusted inputs in a statement that makes a
                    security decision makes code vulnerable to
                    attack.
    kind: path-problem
    problem.severity: warning
    security-severity: 7.5
    precision: medium
    id: cpp/tainted-permissions-check
    tags: |-
      security
             external/cwe/cwe-807
  queryHelp: |
    # Untrusted input for a condition
    This rule finds code where untrusted inputs are used in an `if` statement, and the body of that statement makes a security decision. This is an example of CWE-807 and makes the program vulnerable to attack. An attacker might be able to gain unauthorized access to the system by manipulating external inputs to the system.


    ## Recommendation
    In most cases, you need to add or strengthen the checks made on the user-supplied data to ensure its integrity. The user-supplied data can then be used as a trusted input to the security decision. For example, instead of checking an HTTP cookie against a predictable fixed string, check a cookie against a randomly generated session key.

    This rule may highlight a few conditions where user-supplied data has been checked and can be trusted. It is not always possible to determine if the checks applied to data are enough to ensure security.


    ## Example
    The following example is included in CWE 807.


    ```c
    struct hostent *hp;struct in_addr myaddr;
    char* tHost = "trustme.example.com";
    myaddr.s_addr=inet_addr(ip_addr_string);

    hp = gethostbyaddr((char *) &myaddr, sizeof(struct in_addr), AF_INET);
    if (hp && !strncmp(hp->h_name, tHost, sizeof(tHost))) {
      trusted = true;
    } else {
      trusted = false;
    }

    ```
    In this example, the result of a reverse DNS query is compared against a fixed string. An attacker can return an incorrect reverse DNS entry for the requesting IP and thus gain the same access as a legitimate user from `trustme.example.com`.

    To fix the problem in this example, you need to add an additional mechanism to test the user-supplied data. For example, numeric IP addresses could be used.


    ## References
    * Common Weakness Enumeration: [CWE-807](https://cwe.mitre.org/data/definitions/807.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-843/TypeConfusion.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-843/TypeConfusion.bqrs
  metadata:
    name: Type confusion
    description: Casting a value to an incompatible type can lead to undefined behavior.
    kind: path-problem
    problem.severity: warning
    security-severity: 9.3
    precision: medium
    id: cpp/type-confusion
    tags: |-
      security
             external/cwe/cwe-843
  queryHelp: |
    # Type confusion
    Certain casts in C and C++ place no restrictions on the target type. For example, C style casts such as `(MyClass*)p` allows the programmer to cast any pointer `p` to an expression of type `MyClass*`. If the runtime type of `p` turns out to be a type that's incompatible with `MyClass`, this results in undefined behavior.


    ## Recommendation
    If possible, use `dynamic_cast` to safely cast between polymorphic types. If `dynamic_cast` is not an option, use `static_cast` to restrict the kinds of conversions that the compiler is allowed to perform. If C++ style casts is not an option, carefully check that all casts are safe.


    ## Example
    Consider the following class hierachy where we define a base class `Shape` and two derived classes `Circle` and `Square` that are mutually incompatible:


    ```cpp
    struct Shape {
      virtual ~Shape();

      virtual void draw() = 0;
    };

    struct Circle : public Shape {
      Circle();

      void draw() override {
        /* ... */
      }

      int getRadius();
    };

    struct Square : public Shape {
      Square();

      void draw() override {
        /* ... */
      }

      int getLength();
    };

    ```
    The following code demonstrates a type confusion vulnerability where the programmer assumes that the runtime type of `p` is always a `Square`. However, if `p` is a `Circle`, the cast will result in undefined behavior.


    ```cpp
    void allocate_and_draw_bad() {
      Shape* shape = new Circle;
      // ...
      // BAD: Assumes that shape is always a Square
      Square* square = static_cast<Square*>(shape);
      int length = square->getLength();
    }
    ```
    The following code fixes the vulnerability by using `dynamic_cast` to safely cast between polymorphic types. If the cast fails, `dynamic_cast` returns a null pointer, which can be checked for and handled appropriately.


    ```cpp
    void allocate_and_draw_good() {
      Shape* shape = new Circle;
      // ...
      // GOOD: Dynamically checks if shape is a Square
      Square* square = dynamic_cast<Square*>(shape);
      if(square) {
        int length = square->getLength();
      } else {
        // handle error
      }
    }
    ```

    ## References
    * Microsoft Learn: [Type conversions and type safety](https://learn.microsoft.com/en-us/cpp/cpp/type-conversions-and-type-safety-modern-cpp).
    * Common Weakness Enumeration: [CWE-843](https://cwe.mitre.org/data/definitions/843.html).
 -
