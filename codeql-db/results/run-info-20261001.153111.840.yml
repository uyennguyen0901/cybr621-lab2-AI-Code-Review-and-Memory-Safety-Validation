  queryHelp: "# Overrunning write\nYou must ensure that you do not exceed the size\
    \ of an allocation during write and read operations. If an operation attempts\
    \ to write to or access an element that is outside the range of the allocation\
    \ then this results in a buffer overflow. Buffer overflows can lead to anything\
    \ from a segmentation fault to a security vulnerability.\n\n\n## Recommendation\n\
    Check the offsets and sizes used in the highlighted operations to ensure that\
    \ a buffer overflow will not occur.\n\n\n## Example\n\n```cpp\nint f(char * s,\
    \ unsigned size) {\n\tchar* buf = (char*)malloc(size);\n\n\tstrncpy(buf, s, size\
    \ + 1); // wrong: copy may exceed size of buf\n\n\tfor (int i = 0; i <= size;\
    \ i++) { // wrong: upper limit that is higher than size of buf\n\t\tcout << buf[i];\n\
    \t}\n}\n\n```\n\n## References\n* I. Gerg. *An Overview and Example of the Buffer-Overflow\
    \ Exploit*. IANewsletter vol 7 no 4. 2005.\n* M. Donaldson. *Inside the Buffer\
    \ Overflow Attack: Mechanism, Method &amp; Prevention*. SANS Institute InfoSec\
    \ Reading Room. 2002.\n* Common Weakness Enumeration: [CWE-119](https://cwe.mitre.org/data/definitions/119.html).\n\
    * Common Weakness Enumeration: [CWE-131](https://cwe.mitre.org/data/definitions/131.html).\n"
 -
