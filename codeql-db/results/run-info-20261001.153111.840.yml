  pack: codeql/cpp-queries#0
  relativeQueryPath: Documentation/CommentedOutCode.ql
  relativeBqrsPath: codeql/cpp-queries/Documentation/CommentedOutCode.bqrs
  metadata:
    name: Commented-out code
    description: Commented-out code makes the remaining code more difficult to read.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/commented-out-code
    tags: |-
      maintainability
             documentation
  queryHelp: |
    # Commented-out code
    Commented-out code is distracting and confusing for developers who read the surrounding code, and its significance is often unclear. It will not get compiled or tested when the code around it changes, so it's likely to break over time. For these reasons, commented-out code should be avoided.


    ## Recommendation
    Remove or reinstate the commented-out code. If you want to include a snippet of example code in a comment, consider enclosing it in quotes or marking it up as appropriate for the source language.


    ## References
    * Mark Needham: [The danger of commenting out code](http://www.markhneedham.com/blog/2009/01/17/the-danger-of-commenting-out-code/).
    * Los Techies: [Commented Code == Technical Debt](http://lostechies.com/rodpaddock/2010/12/29/commented-code-technical-debt).
    * High Integrity C++ Coding Standard: [2.3.2 Do not comment out code](http://www.codingstandard.com/rule/2-3-2-do-not-comment-out-code/).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Documentation/FixmeComments.ql
  relativeBqrsPath: codeql/cpp-queries/Documentation/FixmeComments.bqrs
  metadata:
    name: FIXME comment
    description: Comments containing 'FIXME' indicate that the code has known bugs.
    kind: problem
    problem.severity: recommendation
    precision: very-high
    id: cpp/fixme-comment
    tags: |-
      maintainability
             documentation
             external/cwe/cwe-546
  queryHelp: "# FIXME comment\nThe indicated comment is a FIXME comment. FIXME comments\
    \ are often used to indicate code that does not work correctly or that may not\
    \ work in all supported environments. This may be necessary during the implementation\
    \ of new functionality but FIXME comments should not be present in stable code.\
    \ Any FIXME comments should be reviewed and the code improved as soon as possible\
    \ to avoid the accumulation of partially implemented features.\n\n\n## Recommendation\n\
    Fix the functionality indicated by the comment. If the comment no longer applies,\
    \ delete it to avoid confusion.\n\n\n## Example\n\n```cpp\nint isEven(int n) {\n\
    \t//FIXME: Is only correct for small values of n\n\treturn n == 0 || n == 2;\n\
    }\n```\n\n## References\n* [Wikipedia: Comment tags](https://en.wikipedia.org/wiki/Comment_%28computer_programming%29#Tags)\n\
    * [The case against TODO (and FIXME)](http://wordaligned.org/articles/todo)\n\
    * Common Weakness Enumeration: [CWE-546](https://cwe.mitre.org/data/definitions/546.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Documentation/UncommentedFunction.ql
  relativeBqrsPath: codeql/cpp-queries/Documentation/UncommentedFunction.bqrs
  metadata:
    name: Poorly documented large function
    description: "Large functions that have no or almost no comments are likely to\
      \ be too complex to understand and maintain. The larger a function is, the more\
      \ problematic the lack of comments."
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/poorly-documented-function
    tags: |-
      maintainability
             documentation
             statistical
             non-attributable
  queryHelp: |
    # Poorly documented large function
    This rule finds large functions that have too few comment lines. Documentation becomes more important as a function becomes more complex, and a lack of documentation makes it harder to maintain.


    ## Recommendation
    Add comments to document the purpose of the function. Large, complex functions in particular require detailed documentation, not only because they are harder to understand, but the process of documentation may reveal that the function could be split into smaller, more cohesive functions.


    ## References
    * [C++ Programming, Coding style conventions](https://en.wikibooks.org/wiki/C%2B%2B_Programming/Programming_Languages/C%2B%2B/Code/Style_Conventions#Comments)
    * [Wikipedia: Need for comments](https://en.wikipedia.org/wiki/Comment_%28computer_programming%29#Need_for_comments)
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Header Cleanup/Cleanup-DuplicateIncludeGuard.ql
  relativeBqrsPath: codeql/cpp-queries/Header Cleanup/Cleanup-DuplicateIncludeGuard.bqrs
  metadata:
    name: Duplicate include guard
    description: Using the same include guard macro in more than one header file may
      cause unexpected behavior from the compiler.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/duplicate-include-guard
    tags: |-
      reliability
             maintainability
             modularity
  queryHelp: "# Duplicate include guard\nA common pattern in header files is to use\
    \ pre-processor directives to guard a header file against being processed more\
    \ than once per translation unit. This practice is intended to prevent compilation\
    \ errors. However, pre-processor include guards are prone to human error themselves\
    \ because each include guard must be assigned a unique macro name to function\
    \ correctly. If two header files share the same guard macro, the compiler may\
    \ unexpectedly skip the second file it encounters, leading to compilation errors\
    \ or configuration bugs.\n\nThe query will flag the pre-processor `#ifndef` directive\
    \ at the beginning of any include guard that matches another include guard in\
    \ the project. Browsing the list of results you will be able to find the other\
    \ directive(s) which use the same macro.\n\n\n## Recommendation\nFirst decide\
    \ whether the duplicate include guard is dangerous. A duplicate include guard\
    \ may cause the header file to be skipped over when it shouldn't be, but occasionally\
    \ this design is used on purpose to 'override' an existing header file.\n\nTo\
    \ address the issue, rename the macros used by all but one instance of the duplicate\
    \ include guard. Remember to change both the `#ifndef` and the `#define` directive\
    \ to use the new macro name. Alternatively, consider using the `#pragma once`\
    \ directive to prevent multiple inclusion without the need to define unique macros.\n\
    \n\n## Example\nHere's an example of two header files that have accidentally been\
    \ given the same include guard macro. To fix the issue, rename both occurrences\
    \ of the macro in the second file, for example to ANOTHER_HEADER_FILE_H.\n\n\n\
    ```cpp\n// header_file.h\n\n#ifndef HEADER_FILE_H\n#define HEADER_FILE_H\n\n\t\
    // ...\n\n#endif // HEADER_FILE_H\n```\n\n```cpp\n// another_header_file.h\n\n\
    #ifndef HEADER_FILE_H // should be ANOTHER_HEADER_FILE_H\n#define HEADER_FILE_H\
    \ // should be ANOTHER_HEADER_FILE_H\n\n\t// ...\n\n#endif // HEADER_FILE_H\n\
    ```\n\n## References\n* Wikipedia: [Include guard](https://en.wikipedia.org/wiki/Include_guard)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/AmbiguouslySignedBitField.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/AmbiguouslySignedBitField.bqrs
  metadata:
    name: Ambiguously signed bit-field member
    description: |-
      Bit fields with integral types should have explicit signedness
                    only. For example, use `unsigned int` rather than `int`. It is
                    implementation specific whether an `int`-typed bit field is
                    signed, so there could be unexpected sign extension or
                    overflow.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/ambiguously-signed-bit-field
    tags: |-
      reliability
             readability
             language-features
             external/cwe/cwe-190
  queryHelp: "# Ambiguously signed bit-field member\nThe signedness of a plain char,\
    \ short, int, or long bit field is implementation-specific in C and in older versions\
    \ of C++, and declaring their signedness explicitly removes the ambiguity and\
    \ ensures portability.\n\n\n## Recommendation\nDeclare all members of the bit\
    \ field with explicit signedness.\n\n\n## Example\n\n```cpp\nstruct {\n\tint s\
    \ : 4; //wrong: behavior of bit-field members with implicit signage vary across\
    \ compilers\n\tunsigned int : 24; //correct: explicitly unsigned\n\tsigned int\
    \ : 4; //correct: explicitly signed\n} bits;\n\n```\n\n## References\n* AV Rule\
    \ 154, *Joint Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin\
    \ Corporation, 2005.\n* [C++ Bit Fields](http://en.cppreference.com/w/cpp/language/bit_field)\n\
    * Common Weakness Enumeration: [CWE-190](https://cwe.mitre.org/data/definitions/190.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/BadAdditionOverflowCheck.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/BadAdditionOverflowCheck.bqrs
  metadata:
    name: Bad check for overflow of integer addition
    description: |-
      Checking for overflow of integer addition by comparing
                    against one of the arguments of the addition does not work
                    when the result of the addition is automatically promoted
                    to a larger type.
    kind: problem
    problem.severity: error
    security-severity: 8.1
    precision: very-high
    id: cpp/bad-addition-overflow-check
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-190
             external/cwe/cwe-192
  queryHelp: "# Bad check for overflow of integer addition\nChecking for overflow\
    \ of integer addition needs to be done with care, because automatic type promotion\
    \ can prevent the check from working as intended, with the same value (`true`\
    \ or `false`) always being returned.\n\n\n## Recommendation\nUse an explicit cast\
    \ to make sure that the result of the addition is not implicitly converted to\
    \ a larger type.\n\n\n## Example\n\n```cpp\nbool checkOverflow(unsigned short\
    \ x, unsigned short y) {\n  // BAD: comparison is always false due to type promotion\n\
    \  return (x + y < x);  \n}\n\n```\nOn a typical architecture where `short` is\
    \ 16 bits and `int` is 32 bits, the operands of the addition are automatically\
    \ promoted to `int`, so it cannot overflow and the result of the comparison is\
    \ always false.\n\nThe code below implements the check correctly, by using an\
    \ explicit cast to make sure that the result of the addition is `unsigned short`\
    \ (which may overflow, in which case the comparison would evaluate to `true`).\n\
    \n\n```cpp\nbool checkOverflow(unsigned short x, unsigned short y) {\n  return\
    \ ((unsigned short)(x + y) < x);  // GOOD: explicit cast\n}\n\n```\n\n## References\n\
    * [Preserving Rules](http://c-faq.com/expr/preservingrules.html)\n* [Understand\
    \ integer conversion rules](https://www.securecoding.cert.org/confluence/plugins/servlet/mobile#content/view/20086942)\n\
    * Common Weakness Enumeration: [CWE-190](https://cwe.mitre.org/data/definitions/190.html).\n\
    * Common Weakness Enumeration: [CWE-192](https://cwe.mitre.org/data/definitions/192.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/BadCheckOdd.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/BadCheckOdd.bqrs
  metadata:
    name: Bad check for oddness
    description: |-
      Using "x % 2 == 1" to check whether x is odd does not work for
                    negative numbers.
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/incomplete-parity-check
    tags: |-
      reliability
             correctness
             types
  queryHelp: |
    # Bad check for oddness
    This rule finds code that uses `x % 2 == 1` to check whether a number `x` is odd, which does not work for negative numbers. Applying `%` to negative numbers produces negative results. For example, `(-5) % 2 ` equals `-1`, not `1`. As a result, this check incorrectly considers all negative numbers as even.


    ## Recommendation
    Consider using `x % 2 != 0` or `(x & 1) == 1` instead.


    ## References
    * MSDN Library: [Multiplicative Operators and the Modulus Operator](https://docs.microsoft.com/en-us/cpp/cpp/multiplicative-operators-and-the-modulus-operator).
    * Wikipedia: [Modulo Operation - Common pitfalls](https://en.wikipedia.org/wiki/Modulo_operation#Common_pitfalls).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/BitwiseSignCheck.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/BitwiseSignCheck.bqrs
  metadata:
    name: Sign check of bitwise operation
    description: Checking the sign of the result of a bitwise operation may yield
      unexpected results.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/bitwise-sign-check
    tags: |-
      reliability
             correctness
  queryHelp: "# Sign check of bitwise operation\nThis rule finds code that checks\
    \ the sign of the result of a bitwise operation. Such a check may yield unexpected\
    \ results. As an example, consider the following code that checks if the `n`th\
    \ bit of a variable `x` is set:\n\n```\n  x & (1 << n) > 0 \n```\nIf `x` is a\
    \ 32-bit signed integer, the value of `x & (1 << 31)` is interpreted as a signed\
    \ number. If `x` is negative (that is, its sign bit is set), and `n` is 31, then\
    \ `x & (1 << 31)` evaluates to `0x80000000` (all bits zero except the sign bit).\
    \ The sign check on this value fails, implying that the 31st bit of `x` is unset.\
    \ This is clearly incorrect.\n\n\n## Recommendation\nThe above sign check should\
    \ be rewritten as\n\n```\n  x & (1 << n) != 0\n```\n\n## References\n* Code Project:\
    \ [An introduction to bitwise operators](http://www.codeproject.com/Articles/2247/An-introduction-to-bitwise-operators)\n\
    * MSDN Library: [Signed Bitwise Operations](https://docs.microsoft.com/en-us/cpp/c-language/signed-bitwise-operations)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/ComparisonPrecedence.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/ComparisonPrecedence.bqrs
  metadata:
    name: Unclear comparison precedence
    description: |-
      Using comparisons as operands of other comparisons is unusual
                    in itself, and most readers will require parentheses to be sure
                    of the precedence.
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/comparison-precedence
    tags: |-
      maintainability
             readability
  queryHelp: "# Unclear comparison precedence\nThis rule finds comparison expressions\
    \ that use 2 or more comparison operators and are not completely parenthesized.\
    \ It is best to fully parenthesize complex comparison expressions to explicitly\
    \ define the order of the comparison operators.\n\n\n## Recommendation\nFully\
    \ parenthesize complex comparison expressions to avoid confusion.\n\n\n## Example\n\
    \n```cpp\nvoid h() {\n\tint a, b, c;\n\n\ta < b != c; //parenthesize to explicitly\
    \ define order of operators\n\t(a < b) < c; //correct: parenthesized to specify\
    \ order\n}\n\n```\n\n## References\n* MSDN Library: [C++ built-in operators, precedence,\
    \ and associativity](https://docs.microsoft.com/en-us/cpp/cpp/cpp-built-in-operators-precedence-and-associativity)\n\
    * [Operators](http://www.cplusplus.com/doc/tutorial/operators/)\n* [EXP00-C. Use\
    \ parentheses for precedence of operation](https://wiki.sei.cmu.edu/confluence/display/c/EXP00-C.+Use+parentheses+for+precedence+of+operation)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/FloatComparison.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/FloatComparison.bqrs
  metadata:
    name: Equality test on floating-point values
    description: |-
      Comparing results of floating-point computations with '==' or
                    '!=' is likely to yield surprising results since floating-point
                    computation does not follow the standard rules of algebra.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/equality-on-floats
    tags: |-
      reliability
             correctness
  queryHelp: |
    # Equality test on floating-point values
    This rule finds comparisons using the equals (`==`) operator on floating point values. Such comparisons can yield unexpected results due to conversion or rounding errors. Pay particular attention if you are dealing with very large or very small floating point values as rounding errors will be more prominent when using such values.


    ## Recommendation
    Floating point numbers should be considered equal if their difference is within an appropriate margin of error.


    ## Example

    ```cpp
    //wrong: could evaluate to 0 (false) due to rounding errors
    23.42f == 23.42

    //wrong: could evaluate to 1 (true) due to rounding errors
    1000000000.0f == 1000000001.0f

    //correct: use a margin of error to check equality
    fabs(f1 - f2) < EPSILON

    ```

    ## References
    * D. Goldberg, *What Every Computer Scientist Should Know About Floating-Point Arithmetic*, ACM Computing Surveys, Volume 23, Issue 1, March 1991 ([available online](https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html)).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/IntMultToLong.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/IntMultToLong.bqrs
  metadata:
    name: Multiplication result converted to larger type
    description: |-
      A multiplication result that is converted to a larger type can
                    be a sign that the result can overflow the type converted from.
    kind: problem
    problem.severity: warning
    security-severity: 8.1
    precision: high
    id: cpp/integer-multiplication-cast-to-long
    tags: |-
      reliability
             security
             correctness
             types
             external/cwe/cwe-190
             external/cwe/cwe-192
             external/cwe/cwe-197
             external/cwe/cwe-681
  queryHelp: "# Multiplication result converted to larger type\nThis rule finds code\
    \ that converts the result of an integer multiplication to a larger type. Since\
    \ the conversion applies *after* the multiplication, arithmetic overflow may still\
    \ occur.\n\nThe rule flags every multiplication of two non-constant integer expressions\
    \ that is (explicitly or implicitly) converted to a larger integer type. The conversion\
    \ is an indication that the expression would produce a result that would be too\
    \ large to fit in the smaller integer type.\n\n\n## Recommendation\nUse a cast\
    \ to ensure that the multiplication is done using the larger integer type to avoid\
    \ overflow.\n\n\n## Example\n\n```cpp\nint i = 2000000000;\nlong j = i * i; //Wrong:\
    \ due to overflow on the multiplication between ints, \n                //will\
    \ result to j being -1651507200, not 4000000000000000000\n\nlong k = (long) i\
    \ * i; //Correct: the multiplication is done on longs instead of ints, \n    \
    \                   //and will not overflow\n\nlong l = static_cast<long>(i) *\
    \ i; //Correct: modern C++\n\n```\n\n## References\n* MSDN Library: [Multiplicative\
    \ Operators and the Modulus Operator](https://docs.microsoft.com/en-us/cpp/cpp/multiplicative-operators-and-the-modulus-operator).\n\
    * Cplusplus.com: [Integer overflow](http://www.cplusplus.com/articles/DE18T05o/).\n\
    * Common Weakness Enumeration: [CWE-190](https://cwe.mitre.org/data/definitions/190.html).\n\
    * Common Weakness Enumeration: [CWE-192](https://cwe.mitre.org/data/definitions/192.html).\n\
    * Common Weakness Enumeration: [CWE-197](https://cwe.mitre.org/data/definitions/197.html).\n\
    * Common Weakness Enumeration: [CWE-681](https://cwe.mitre.org/data/definitions/681.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/PointlessComparison.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/PointlessComparison.bqrs
  metadata:
    name: Comparison result is always the same
    description: |-
      When a comparison operation, such as x < y, always
                    returns the same result, it means that the comparison
                    is redundant and may mask a bug because a different
                    check was intended.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/constant-comparison
    tags: |-
      maintainability
             readability
  queryHelp: "# Comparison result is always the same\nComparison operations like `x\
    \ >= y` or `x != y` will always return the same result if the ranges of `x` and\
    \ `y` do not overlap. In some cases this can cause an infinite loop. In the example\
    \ below the loop condition on line 9 is always true because the range of `i` is\
    \ \\[0..5\\], so the loop will never terminate.\n\nThe bounds which were deduced\
    \ for the left and right operands of the comparison are included in the message\
    \ as they often make it easier to understand why a result was reported. For example\
    \ the message for the comparison `x >= y` might read: \"Comparison is always false\
    \ because x &gt;= 5 and 3 &gt;= y.\"\n\n\n## Recommendation\nCheck the expression\
    \ to see whether a different semantics was intended.\n\n\n## Example\n\n```cpp\n\
    int f() {\n  int i;\n  int total = 0;\n\n  for (i = 0; i < 10; i = i+1) {  //\
    \ GOOD: comparison could be either true or false.\n    total += i;\n  }\n\n  for\
    \ (i = 0; i < 10; i = i+1) {  // BAD: comparison is always true, because i <=\
    \ 5. \n    i = i % 5;\n    total += i;\n  }\n\n  return total;\n}\n\n```\n\n##\
    \ References\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/PointlessSelfComparison.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/PointlessSelfComparison.bqrs
  metadata:
    name: Self comparison
    description: |-
      Comparing a variable to itself always produces the
                    same result, unless the purpose is to check for
                    integer overflow or floating point NaN.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/comparison-of-identical-expressions
    tags: |-
      readability
             maintainability
  queryHelp: |+
    # Self comparison
    The purpose of comparing a variable to itself is usually to detect either integer overflow or floating point NaN. If the comparison does neither then it is most likely a coding error.


    ## Recommendation
    If the purpose of the cast is to detect integer overflow, then make sure that the comparison uses explicit casts and that the types are as intended.


    ## Example

    ```cpp
    typedef int T;

    bool checkOverflow(T x) {
      return (x == (int)x);  // Always returns true.
    }

    ```
    The comparison is always true, because the explicit cast to `int` has no effect. This might mean that the definition of `T` has changed since `checkOverflow` was written and that `checkOverflow` is now obsolete.

 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Arithmetic/SignedOverflowCheck.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/SignedOverflowCheck.bqrs
  metadata:
    name: Signed overflow check
    description: |-
      Testing for overflow by adding a value to a variable
                    to see if it "wraps around" works only for
                    unsigned integer values.
    kind: problem
    problem.severity: warning
    security-severity: 8.1
    precision: high
    id: cpp/signed-overflow-check
    tags: |-
      correctness
             security
             external/cwe/cwe-128
             external/cwe/cwe-190
  queryHelp: |
    # Signed overflow check
    When checking for integer overflow, you may often write tests like `a + b < a`. This works fine if `a` or `b` are unsigned integers, since any overflow in the addition will cause the value to simply "wrap around." However, using *signed* integers is problematic because signed overflow has undefined behavior according to the C and C++ standards. If the addition overflows and has an undefined result, the comparison will likewise be undefined; it may produce an unintended result, or may be deleted entirely by an optimizing compiler.


    ## Recommendation
    Solutions to this problem can be thought of as falling into one of two categories:

    1. Rewrite the signed expression so that overflow cannot occur but the signedness remains.
    1. Change the variables and all their uses to be unsigned.
    The following cases all fall into the first category.

    1. Given `unsigned short n1, delta` and `n1 + delta < n1`, it is possible to rewrite it as `(unsigned short)(n1 + delta)&nbsp;<&nbsp;n1`. Note that `n1 + delta` does not actually overflow, due to `int` promotion.
    1. Given `unsigned short n1, delta` and `n1 + delta < n1`, it is also possible to rewrite it as `n1 > USHORT_MAX - delta`. The `limits.h` or `climits` header must then be included.
    1. Given `int n1, delta` and `n1 + delta < n1`, it is possible to rewrite it as `n1 > INT_MAX - delta`. It must be true that `delta >= 0` and the `limits.h` or `climits` header has been included.

    ## Example
    In the following example, even though `delta` has been declared `unsigned short`, C/C++ type promotion rules require that its type is promoted to the larger type used in the addition and comparison, namely a `signed int`. Addition is performed on signed integers, and may have undefined behavior if an overflow occurs. As a result, the entire (comparison) expression may also have an undefined result.


    ```cpp
    bool foo(int n1, unsigned short delta) {
        return n1 + delta < n1; // BAD
    }

    ```
    The following example builds upon the previous one. Instead of performing an addition (which could overflow), we have re-framed the solution so that a subtraction is used instead. Since `delta` is promoted to a `signed int` and `INT_MAX` denotes the largest possible positive value for an `signed int`, the expression `INT_MAX - delta` can never be less than zero or more than `INT_MAX`. Hence, any overflow and underflow are avoided.


    ```cpp
    #include <limits.h>
    bool foo(int n1, unsigned short delta) {
        return n1 > INT_MAX - delta; // GOOD
    }

    ```
    In the following example, even though both `n` and `delta` have been declared `unsigned short`, both are promoted to `signed int` prior to addition. Because we started out with the narrower `short` type, the addition is guaranteed not to overflow and is therefore defined. But the fact that `n1 + delta` never overflows means that the condition `n1 + delta < n1` will never hold true, which likely is not what the programmer intended. (see also the `cpp/bad-addition-overflow-check` query).


    ```cpp
    bool bar(unsigned short n1, unsigned short delta) {
        // NB: Comparison is always false
        return n1 + delta < n1; // GOOD (but misleading)
    }

    ```
    The next example provides a solution to the previous one. Even though `n1 + delta` does not overflow, casting it to an `unsigned short` truncates the addition modulo 2^16, so that `unsigned short` "wrap around" may now be observed. Furthermore, since the left-hand side is now of type `unsigned short`, the right-hand side does not need to be promoted to a `signed int`.


    ```cpp
    bool bar(unsigned short n1, unsigned short delta) {
        return (unsigned short)(n1 + delta) < n1; // GOOD
    }

    ```

    ## References
    * [comp.lang.c FAQ list · Question 3.19 (Preserving rules)](http://c-faq.com/expr/preservingrules.html)
    * [INT31-C. Ensure that integer conversions do not result in lost or misinterpreted data](https://wiki.sei.cmu.edu/confluence/display/c/INT31-C.+Ensure+that+integer+conversions+do+not+result+in+lost+or+misinterpreted+data)
    * W. Dietz, P. Li, J. Regehr, V. Adve. [Understanding Integer Overflow in C/C++](https://www.cs.utah.edu/~regehr/papers/overflow12.pdf)
    * Common Weakness Enumeration: [CWE-128](https://cwe.mitre.org/data/definitions/128.html).
    * Common Weakness Enumeration: [CWE-190](https://cwe.mitre.org/data/definitions/190.html).
 -
