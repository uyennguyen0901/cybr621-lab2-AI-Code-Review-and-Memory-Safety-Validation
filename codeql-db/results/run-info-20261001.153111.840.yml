  metadata:
    name: Irregular enum initialization
    description: "In an enumerator list, the = construct should not be used to explicitly\
      \ initialize members other than the first, unless all items are explicitly initialized.\
      \ An exception is the pattern to use the last element of an enumerator list\
      \ to get the number of possible values."
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/irregular-enum-init
    tags: |-
      reliability
             readability
             language-features
             external/jsf
  queryHelp: "# Irregular enum initialization\nThis rule finds enumerations that initialize\
    \ their members inconsistently. Only the first enumeration member should be initialized\
    \ using '=', or all of them should be initialized. Inconsistent initialization\
    \ of members in enumerations can easily cause defects, especially when adding\
    \ or removing members, or if the code relies on the actual integer values of the\
    \ enumeration members.\n\n\n## Recommendation\nChange the enumeration so that\
    \ only the first member is initialized, or initialize all the members of the enumeration.\
    \ In general, initialize all enumeration members if you actually care about their\
    \ integer values. If not, it is better to let the compiler assign values at compile\
    \ time.\n\n\n## Example\n\n```cpp\n//wrong: inconsistent initialization, only\
    \ the first should be initialized, \n//or all should be initialized\nenum {\n\t\
    VALUE_SHOULD_BE_10 = 10,\n\tVALUE_SHOULD_BE_11,\n\tVALUE_SHOULD_BE_12,\n\tVALUE_SHOULD_BE_20,\
    \ //newly added member, but initialization was forgotten \n\t                \
    \    //(would have a value of 13 instead of 20).\n\tVALUE_SHOULD_BE_30 = 30,\n\
    \tVALUE_SHOULD_BE_40 = 40\n} bad_values;\n\n//correct: all enum values initialized\n\
    enum {\n\tVALUE_SHOULD_BE_10 = 10,\n\tVALUE_SHOULD_BE_11 = 11,\n\tVALUE_SHOULD_BE_12\
    \ = 12,\n\tVALUE_SHOULD_BE_20 = 20, //newly added member, it is less likely to\
    \ forget\n\t                         //putting in initialization since everything\
    \ else \n\t                         //is initialized\n\tVALUE_SHOULD_BE_30 = 30,\n\
    \tVALUE_SHOULD_BE_40 = 40\n} good_values;\n\n```\n\n## References\n* AV Rule 145,\
    \ *Joint Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation,\
    \ 2005.\n* MISRA C++ Rule 8-5-3, *Guidelines for the use of the C++ language in\
    \ critical systems*. The Motor Industry Software Reliability Associate, 2008.\n\
    * MSDN Library: [Enumerations (C++)](https://docs.microsoft.com/en-us/cpp/cpp/enumerations-cpp).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.17 Types/AV Rule 148.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.17 Types/AV Rule 148.bqrs
  metadata:
    name: Use of integer where enum is preferred
    description: Enumeration types should be used instead of integer types (and constants)
      to select from a limited series of choices.
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/integer-used-for-enum
    tags: |-
      maintainability
             readability
             language-features
             external/jsf
  queryHelp: "# Use of integer where enum is preferred\nThis rule finds `switch` statements\
    \ that use an integer instead of an enumeration. Enumerations are preferred when\
    \ dealing with a limited number of choices as they makes it easier to see if a\
    \ case has been left out.\n\n\n## Recommendation\nUse an enumeration instead of\
    \ an integer to represent a limited set of choices.\n\n\n## Example\n\n```cpp\n\
    typedef enum {\n\tCASE_VAL1,\n\tCASE_VAL2\n} caseVals;\n\nvoid f() {\n\tint caseVal;\n\
    \t//Wrong: switch statement uses an integer\n\tswitch(caseVal) {\n\tcase 1:\n\t\
    \t//...\n\tcase 0xFF:\n\t\t//...\n\tdefault:\n\t\t//...\n\t}\n\n\t//Correct: switch\
    \ statement uses enum. It is easier to see if a case \n\t//has been left out,\
    \ and that all cases are valid values\n\tcaseVals caseVal2;\n\tswitch (caseVal2)\
    \ {\n\tcase CASE_VAL1:\n\t\t//...\n\tcase CASE_VAL2:\n\t\t//...\n\tdefault:\n\t\
    }\n}\n\n```\n\n## References\n* AV Rule 148, *Joint Strike Fighter Air Vehicle\
    \ C++ Coding Standards*. Lockheed Martin Corporation, 2005.\n* [C++ Switch statement](http://www.tutorialspoint.com/cplusplus/cpp_switch_statement.htm)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.21 Operators/AV Rule 166.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.21 Operators/AV Rule 166.bqrs
  metadata:
    name: Sizeof with side effects
    description: The sizeof operator should not be used on expressions that contain
      side effects. It is subtle whether the side effects will occur or not.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/sizeof-side-effect
    tags: |-
      reliability
             correctness
             external/jsf
  queryHelp: "# Sizeof with side effects\nThis rule finds `sizeof` expressions that\
    \ have a parameter with side-effects. `sizeof` only uses the type of the parameter,\
    \ so the parameter will not be evaluated. In the C99 standard, using `sizeof`\
    \ on expressions with dynamic arrays may or may not evaluate the side-effect,\
    \ so it is better to avoid it completely.\n\n\n## Recommendation\nSimplify the\
    \ `sizeof` parameter to use only the subexpression that is of the type you need.\n\
    \n\n## Example\n\n```cpp\nint f(void){\n\tint i = 0;\n\tchar arr[20];\n\tint size\
    \ = sizeof(arr[i++]); //wrong: sizeof expression has side effect\n\tcout << i;\
    \ //would output 0 instead of 1\n}\n\n```\n\n## References\n* AV Rule 166, *Joint\
    \ Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation,\
    \ 2005.\n* Tutorialspoint - The C++ Programming Language: [C++ sizeof Operator](http://www.tutorialspoint.com/cplusplus/cpp_sizeof_operator.htm)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.24 Control Flow Structures/AV Rule 196.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.24 Control Flow Structures/AV Rule 196.bqrs
  metadata:
    name: No trivial switch statements
    description: Using a switch statement when there are fewer than two non-default
      cases leads to unclear code.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/trivial-switch
    tags: |-
      maintainability
             readability
             external/jsf
  queryHelp: "# No trivial switch statements\nThe following forms of `switch` statement\
    \ are considered *trivial*:\n\n1. No cases at all.\n1. Just a default case.\n\
    1. Just one non-default case.\n1. A default case and one non-default case.\n\n\
    ## Recommendation\nEither the `switch` statement should be replaced with a simpler\
    \ control flow structure, or it should be extended to handle more cases. Each\
    \ trivial form has a different replacement:\n\n1. If there are no cases, the `switch`\
    \ statement can be removed.\n1. If there is just one default case, the `switch`\
    \ keyword, the `default` keyword, and the subsequent colon can all be removed.\n\
    1. If there is just one non-default case, the `switch` statement can be turned\
    \ into an `if` statement.\n1. If there is one default case and one non-default\
    \ case, the `switch` statement can be turned into an `if`/`else` statement.\n\n\
    ## Example\n\n```cpp\nint f() {\n\tint val = 0;\n\tswitch(val) { //wrong, use\
    \ an if instead\n\tcase 0:\n\t\t//...\n\tdefault:\n\t\t//...\n\t}\n\n\tswitch(val)\
    \ { //correct, has 2 cases and a default\n\tcase 0:\n\t\t//...\n\tcase 1:\n\t\t\
    //...\n\tdefault:\n\t\t//...\n\t}\n}\n\n```\n\n## References\n* AV Rule 196, *Joint\
    \ Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation,\
    \ 2005.\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.24 Control Flow Structures/AV Rule 197.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.24 Control Flow Structures/AV Rule 197.bqrs
  metadata:
    name: Avoid floats in for loops
    description: Floating point variables should not be used as loop counters. For
      loops are best suited to simple increments and termination conditions; while
      loops are preferable for more complex uses.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/loop-variable-float
    tags: |-
      correctness
             reliability
             external/jsf
  queryHelp: "# Avoid floats in for loops\nThis rule finds `float` variables being\
    \ used as loop counter. `float` values are prone to rounding and truncation. In\
    \ particular, very large and very small float values are prone to rounding errors\
    \ and could lead to unexpected loop behavior.\n\n\n## Recommendation\nUse an integral\
    \ variable instead of a float variable for the loop counter.\n\n\n## Example\n\
    \n```cpp\nvoid f() {\n\tfloat i = 0.0f;\n\t//wrong: float used as loop counter\n\
    \tfor (i = 0; i < 1000000.0f; i++) { //may execute 1000000 +x/-x times\n\t\t//...\n\
    \t}\n\tfor (i = 0; i < 100000000.0f; i++) { //may never terminate, as rounding\
    \ errors \n\t                                     //cancel out the addition of\
    \ 1.0 once \n\t                                     //i becomes large enough\n\
    \t\t//...\n\t}\n}\n\n```\n\n## References\n* AV Rule 197, *Joint Strike Fighter\
    \ Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation, 2005.\n* MISRA\
    \ C++ Rule 6-5-1, *Guidelines for the use of the C++ language in critical systems*.\
    \ The Motor Industry Software Reliability Associate, 2008.\n* [FLP30-C. Do not\
    \ use floating-point variables as loop counters](https://www.securecoding.cert.org/confluence/display/c/FLP30-C.+Do+not+use+floating-point+variables+as+loop+counters)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: jsf/4.24 Control Flow Structures/AV Rule 201.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.24 Control Flow Structures/AV Rule 201.bqrs
  metadata:
    name: For loop variable changed in body
    description: "Numeric variables being used within a for loop for iteration counting\
      \ should not be modified in the body of the loop. Reserve for loops for straightforward\
      \ iterations, and use a while loop instead for more complex cases."
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/loop-variable-changed
    tags: |-
      reliability
             readability
             external/jsf
  queryHelp: "# For loop variable changed in body\nThis rule finds `for` loop variables\
    \ that are being modified in the loop body. `for` loops should be reserved for\
    \ simple iteration, use `while` loops for more complicated cases. Most developers\
    \ assume that the `for` loop iteration statement is the only thing that changes\
    \ the value of the loop counter, so changing it inside the loop body can lead\
    \ to confusion.\n\n\n## Recommendation\nUse only the increment expression in the\
    \ `for` loop to modify loop variables, or change it to a `while` loop if the loop\
    \ requires more complicated variable iteration.\n\n\n## Example\n\n```cpp\nvoid\
    \ f() {\n\tint i = 0;\n\tfor (i = 0; i < 10; i++) {\n\t\t//...\n\t\tif (special_case)\
    \ {\n\t\t\ti += 5; //Wrong: loop variable changed in body, which is contrary \n\
    \t\t\t        //to the usual expectation of for loop behavior. \n\t\t\t      \
    \  //Use a while loop instead.\n\t\t\tcontinue;\n\t\t}\n\t}\n}\n\n```\n\n## References\n\
    * AV Rule 201, *Joint Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed\
    \ Martin Corporation, 2005.\n* MISRA C++ Rule 6-5-3, *Guidelines for the use of\
    \ the C++ language in critical systems*. The Motor Industry Software Reliability\
    \ Associate, 2008.\n* [For statements](http://www.learncpp.com/cpp-tutorial/57-for-statements/)\n\
    * Mats Henricson and Erik Nyquist, *Industrial Strength C++*, published by Prentice\
    \ Hall PTR (1997). Chapter 4: Control Flow, Rule 4.1 ([PDF](https://web.archive.org/web/20190919025638/https://mongers.org/industrial-c++/)).\n"
