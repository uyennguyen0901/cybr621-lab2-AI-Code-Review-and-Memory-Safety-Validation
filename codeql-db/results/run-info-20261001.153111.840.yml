  relativeQueryPath: Likely Bugs/Memory Management/SuspiciousSizeof.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/SuspiciousSizeof.bqrs
  metadata:
    name: Suspicious 'sizeof' use
    description: |-
      Taking 'sizeof' of an array parameter is often mistakenly thought
                    to yield the size of the underlying array, but it always yields
                    the machine pointer size.
    kind: problem
    problem.severity: warning
    security-severity: 8.8
    precision: medium
    id: cpp/suspicious-sizeof
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-467
  queryHelp: "# Suspicious 'sizeof' use\nThis rule finds expressions that take the\
    \ size of a function parameter of array type. In C, function parameters of array\
    \ type are treated as if they had the corresponding pointer type, so their size\
    \ is always the size of the pointer type (typically either four or eight). In\
    \ particular, one cannot determine the size of a memory buffer passed as a parameter\
    \ in this way. Using the `sizeof` operator on pointer types will produce unexpected\
    \ results if the developer intended to get the size of an array instead of the\
    \ pointer.\n\n\n## Recommendation\nModify the function to take an extra argument\
    \ indicating the buffer size.\n\n\n## Example\n\n```cpp\nvoid f(char s[]) {\n\t\
    int size = sizeof(s); //wrong: s is now a char*, not an array. \n\t          \
    \            //sizeof(s) will evaluate to sizeof(char *)\n}\n\n```\n\n## References\n\
    * Comp.lang.c, Frequently Asked Questions: [Question 6.3: So what is meant by\
    \ the \"equivalence of pointers and arrays\" in C?](http://c-faq.com/aryptr/aryptrequiv.html).\n\
    * Common Weakness Enumeration: [CWE-467](https://cwe.mitre.org/data/definitions/467.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/UninitializedLocal.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/UninitializedLocal.bqrs
  metadata:
    name: Potentially uninitialized local variable
    description: |-
      Reading from a local variable that has not been assigned to
                    will typically yield garbage.
    kind: path-problem
    id: cpp/uninitialized-local
    problem.severity: warning
    security-severity: 7.8
    precision: medium
    tags: |-
      security
             external/cwe/cwe-665
             external/cwe/cwe-457
  queryHelp: "# Potentially uninitialized local variable\nA local non-static variable\
    \ of a non-class type has an undefined value before it is initialized. For example,\
    \ it is incorrect to rely on an uninitialized integer to have the value `0`.\n\
    \n\n## Recommendation\nReview the code and consider whether the variable should\
    \ have an initializer or whether some path through the program lacks an assignment\
    \ to the variable.\n\n\n## Example\nThe function `absWrong` does not initialize\
    \ the variable `j` in the case where `i = 0`. Functions `absCorrect1` and `absCorrect2`\
    \ remedy this deficiency by adding an initializer and adding an assignment to\
    \ one of the paths through the program, respectively.\n\n\n```cpp\nint absWrong(int\
    \ i) {\n\tint j;\n\tif (i > 0) {\n\t\tj = i;\n\t} else if (i < 0) {\n\t\tj = -i;\n\
    \t}\n\treturn j; // wrong: j may not be initialized before use\n}\n\nint absCorrect1(int\
    \ i) {\n\tint j = 0;\n\tif (i > 0) {\n\t\tj = i;\n\t} else if (i < 0) {\n\t\t\
    j = -i;\n\t}\n\treturn j; // correct: j always initialized before use\n}\n\nint\
    \ absCorrect2(int i) {\n\tint j;\n\tif (i > 0) {\n\t\tj = i;\n\t} else if (i <\
    \ 0) {\n\t\tj = -i;\n\t} else {\n\t\tj = 0;\n\t}\n\treturn j; // correct: j always\
    \ initialized before use\n}\n```\n\n## References\n* ISO/IEC 9899:2011: [Programming\
    \ languages - C (Section 6.3.2.1)](https://www.iso.org/standard/57853.html).\n\
    * Common Weakness Enumeration: [CWE-665](https://cwe.mitre.org/data/definitions/665.html).\n\
    * Common Weakness Enumeration: [CWE-457](https://cwe.mitre.org/data/definitions/457.html).\n"
 -
