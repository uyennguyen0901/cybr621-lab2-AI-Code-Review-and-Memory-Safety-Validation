  metadata:
    name: Complex condition
    description: Boolean expressions that are too deeply nested are hard to read and
      understand. Consider naming intermediate results as local variables.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/complex-condition
    tags: |-
      testability
             readability
             maintainability
             statistical
             non-attributable
  queryHelp: "# Complex condition\nThis rule finds boolean expressions that have more\
    \ than 5 consecutive operators that are not of the same type (e.g. alternating\
    \ `&&` and `||` operators). Long chains of operators of the same type are not\
    \ flagged as violations of this rule.\n\nComplex boolean expressions are hard\
    \ to read. Consequently, when modifying such expressions there is an increased\
    \ risk of introducing defects. Naming intermediate results as local variables\
    \ will make the logic easier to read and understand.\n\n\n## Recommendation\n\
    Use local variables or macros to represent intermediate values to make the condition\
    \ easier to understand.\n\n\n## Example\n\n```cpp\n//This condition is too complex\
    \ and can be improved by using local variables\nbool accept_message =\n\t(message_type\
    \ == CONNECT && _state != CONNECTED) ||\n\t(message_type == DISCONNECT && _state\
    \ == CONNECTED) ||\n\t(message_type == DATA && _state == CONNECTED);\n\n//This\
    \ condition is acceptable, as all the logical operators are of the same type (&&)\n\
    bool valid_connect =\n\tmessage_type == CONNECT && \n\t_state != CONNECTED &&\n\
    \ttime_since_prev_connect > MAX_CONNECT_INTERVAL &&\n\tmessage_length <= MAX_PACKET_SIZE\
    \ &&\n\tchecksum(message) == get_checksum_field(message);\n```\n\n## References\n\
    * [Operators](http://www.cplusplus.com/doc/tutorial/operators/)\n* [Conditionals](http://geosoft.no/development/cppstyle.html#Conditionals)\n"
 -
