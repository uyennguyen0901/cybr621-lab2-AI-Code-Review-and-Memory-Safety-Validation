  relativeQueryPath: Likely Bugs/Leap Year/UncheckedReturnValueForTimeFunctions.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Leap Year/UncheckedReturnValueForTimeFunctions.bqrs
  metadata:
    name: Unchecked return value for time conversion function
    description: |-
      When the return value of a fallible time conversion function is
                    not checked for failure, its output parameters may contain
                    invalid dates.
    kind: problem
    problem.severity: warning
    id: cpp/leap-year/unchecked-return-value-for-time-conversion-function
    precision: medium
    tags: |-
      leap-year
             correctness
  queryHelp: "# Unchecked return value for time conversion function\nThe leap year\
    \ rule for the Gregorian calendar, which has become the internationally accepted\
    \ civil calendar, is: every year that is exactly divisible by four is a leap year,\
    \ except for years that are exactly divisible by 100, but these centurial years\
    \ are leap years if they are exactly divisible by 400.\n\nA leap year bug occurs\
    \ when software (in any language) is written without consideration of leap year\
    \ logic, or with flawed logic to calculate leap years; which typically results\
    \ in incorrect results.\n\nThe impact of these bugs may range from almost unnoticeable\
    \ bugs such as an incorrect date, to severe bugs that affect reliability, availability\
    \ or even the security of the affected system.\n\nWhen using a function that transforms\
    \ a date structure, and the year on the input argument for the API has been manipulated,\
    \ it is important to check for the return value of the function to make sure it\
    \ succeeded.\n\nOtherwise, the function may have failed, and the output parameter\
    \ may contain invalid data that can cause any number of problems on the affected\
    \ system.\n\nThe following is a list of the functions that this query covers:\n\
    \n* `FileTimeToSystemTime`\n* `SystemTimeToFileTime`\n* `SystemTimeToTzSpecificLocalTime`\n\
    * `SystemTimeToTzSpecificLocalTimeEx`\n* `TzSpecificLocalTimeToSystemTime`\n*\
    \ `TzSpecificLocalTimeToSystemTimeEx`\n* `RtlLocalTimeToSystemTime`\n* `RtlTimeToSecondsSince1970`\n\
    * `_mkgmtime`\n\n## Recommendation\nWhen calling an API that transforms a date\
    \ variable that was manipulated, always check for the return value to verify that\
    \ the API call succeeded.\n\n\n## Example\nIn this example, we are adding 1 year\
    \ to the current date. This may work most of the time, but on any given February\
    \ 29th, the resulting value will be invalid.\n\n\n```c\nSYSTEMTIME st;\nFILETIME\
    \ ft;\nGetSystemTime(&st);\n\n// Flawed logic may result in invalid date\nst.wYear++;\n\
    \n// The following code may fail\nSystemTimeToFileTime(&st, &ft);\n```\nTo fix\
    \ this bug, you must verify the return value for `SystemTimeToFileTime` and handle\
    \ any potential error accordingly.\n\n\n```c\nSYSTEMTIME st;\nFILETIME ft;\nGetSystemTime(&st);\n\
    \n// Flawed logic may result in invalid date\nst.wYear++;\n\n// Check for leap\
    \ year, and adjust the date accordingly\nbool isLeapYear = st.wYear % 4 == 0 &&\
    \ (st.wYear % 100 != 0 || st.wYear % 400 == 0);\nst.wDay = st.wMonth == 2 && st.wDay\
    \ == 29 && !isLeapYear ? 28 : st.wDay;\n\nif (!SystemTimeToFileTime(&st, &ft))\n\
    {\n\t// handle error\n}\n\n```\n\n## References\n* NASA / Goddard Space Flight\
    \ Center - [Calendars](https://eclipse.gsfc.nasa.gov/SEhelp/calendars.html)\n\
    * Wikipedia - [ Leap year bug](https://en.wikipedia.org/wiki/Leap_year_bug)\n\
    * Microsoft Azure blog - [ Is your code ready for the leap year?](https://azure.microsoft.com/en-us/blog/is-your-code-ready-for-the-leap-year/)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/AmbiguousAssignmentOfComparison.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/AmbiguousAssignmentOfComparison.bqrs
  metadata:
    name: Ambiguous assignment of comparison result used as truth value
    description: |-
      Using an assignment of an unparenthesized comparison as
                    a truth value may indicate unintended operator grouping.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/ambiguous-assignment-of-comparison
    tags: |-
      quality
             reliability
             correctness
             external/cwe/cwe-783
  queryHelp: |
    # Ambiguous assignment of comparison result used as truth value
    Assignment operators have lower precedence than comparison operators. For example, `status = read_status() < 0` assigns the comparison result (zero or one) to `status`. This can be unintended when the programmer meant to assign the return value first and then compare it with zero.


    ## Recommendation
    Use parentheses to make the intended order of operations explicit. To assign first and compare the assigned value, parenthesize the assignment. To intentionally assign the comparison result, parenthesize the comparison. An explicit cast around the comparison also makes that order clear.


    ## Example
    In the first condition, `status` receives either zero or one instead of the value returned by `read_status()`. The second condition explicitly performs the assignment before the comparison.


    ```cpp
    int read_status();

    int check_status() {
      int status;
      if (status = read_status() < 0) // BAD: assigns the comparison result.
        return status;

      if ((status = read_status()) < 0) // GOOD: assigns first, then compares.
        return status;

      return 0;
    }

    ```

    ## References
    * SEI CERT C Coding Standard: [EXP00-C. Use parentheses for precedence of operation](https://wiki.sei.cmu.edu/confluence/display/c/EXP00-C.+Use+parentheses+for+precedence+of+operation).
    * C++ reference: [Operator precedence](https://en.cppreference.com/w/cpp/language/operator_precedence.html).
    * Common Weakness Enumeration: [CWE-783](https://cwe.mitre.org/data/definitions/783.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/AssignWhereCompareMeant.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/AssignWhereCompareMeant.bqrs
  metadata:
    name: Assignment where comparison was intended
    description: |-
      The '=' operator may have been used accidentally, where '=='
                    was intended.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/assign-where-compare-meant
    tags: |-
      reliability
             correctness
             external/cwe/cwe-481
  queryHelp: |
    # Assignment where comparison was intended
    This rule finds uses of the assignment operator `=` in places where the equality operator `==` would make more sense. This is a very common mistake in C and C++, because of the similarity of the `=` and the `==` operator, and the fact that the `if` statement accepts a condition with an integral type, instead of limiting it to just the `bool` type.

    The rule flags every occurrence of an assignment in a position where its result is interpreted as a truth value. An assignment is only flagged if its right hand side is a compile-time constant.


    ## Recommendation
    Check to ensure that the flagged expressions are not typos. If an assignment is really intended to be treated as a truth value, it may be better to surround it with parentheses.


    ## Example

    ```cpp
    if(p = NULL) { //most likely == was intended. Otherwise it evaluates to the value
                   //of the rhs of the assignment (which is NULL)
     ...
    }

    ```

    ## References
    * Tutorialspoint - The C++ Programming Language: [Operators in C++](http://www.tutorialspoint.com/cplusplus/cpp_operators.htm)
    * Wikipedia: [Operators in C and C++](https://en.wikipedia.org/wiki/Operators_in_C_and_C%2B%2B#Comparison_operators.2Frelational_operators)
    * Common Weakness Enumeration: [CWE-481](https://cwe.mitre.org/data/definitions/481.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/CompareWhereAssignMeant.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/CompareWhereAssignMeant.bqrs
  metadata:
    name: Comparison where assignment was intended
    description: |-
      The '==' operator may have been used accidentally, where '='
                    was intended, resulting in a useless test.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/compare-where-assign-meant
    tags: |-
      reliability
             correctness
             external/cwe/cwe-482
  queryHelp: |
    # Comparison where assignment was intended
    This rule finds uses of the equality operator `==` in places where the assignment operator `=` would make more sense. This is a common mistake in C and C++, because of the similarity of the `=` and the `==` operator, and the fact that expressions are valid as top-level statements.

    The rule flags every occurrence of an equality operator in a position where its result is discarded.


    ## Recommendation
    Check to ensure that the flagged expressions are not typos. If the result of an equality test is really intended to be discarded, it should be explicitly cast to `void`.


    ## Example

    ```cpp
    int x;
    x == 4; // most likely = was intended. Otherwise this statement has no effect.
    ...

    ```

    ## References
    * Tutorialspoint - The C++ Programming Language: [Operators in C++](http://www.tutorialspoint.com/cplusplus/cpp_operators.htm)
    * Wikipedia: [Operators in C and C++](https://en.wikipedia.org/wiki/Operators_in_C_and_C%2B%2B#Comparison_operators.2Frelational_operators)
    * Common Weakness Enumeration: [CWE-482](https://cwe.mitre.org/data/definitions/482.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/DubiousNullCheck.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/DubiousNullCheck.bqrs
  metadata:
    name: Dubious NULL check
    description: |-
      The address of a field (except the first) will never be NULL,
                    so it is misleading, at best, to check for that case.
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/dubious-null-check
    tags: |-
      reliability
             readability
  queryHelp: |
    # Dubious NULL check
    The expression `&foo->bar` gets the address of `foo`'s member `bar`, which is the address of `foo` plus the offset of the `bar` member. If said offset is non-zero, then the expression `&foo->bar` only equals `NULL` when the address of `foo` is negative. While this is not impossible, it can only happen if `foo` is a negative integer explicitly cast to a pointer, or if `foo` is a pointer into kernel-mode address space. As neither of these cases are particularly likely, the `NULL`-check is dubious.


    ## Recommendation
    Either the `NULL`-check is entirely redundant, or the wrong thing is being checked against `NULL`. In the former case, the check can be replaced with boolean `true` or `false`, and then the surrounding context can be simplified. In the latter case, consider which sub-expressions might be `NULL`, and test them instead. In particular, simply removing the ampersand may yield a more suitable expression to test.


    ## Example
    ```cpp

    struct person {
      int id;
      char* name;
    };

    bool hasName(person* p) {
      return  p       != NULL  // This check is sensible,
          &&  p->name != NULL  // as is this one.
          && &p->name != NULL; // But this check is dubious.
    }

    ```
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/ExprHasNoEffect.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/ExprHasNoEffect.bqrs
  metadata:
    name: Expression has no effect
    description: |-
      A pure expression whose value is ignored is likely to be the
                    result of a typo.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/useless-expression
    tags: |-
      maintainability
             correctness
             external/cwe/cwe-561
  queryHelp: "# Expression has no effect\nThis rule finds expressions without side\
    \ effects (i.e. changing variable values) that are used in a context where their\
    \ value is ignored. These expressions are most likely intended to be part of a\
    \ condition but were coded improperly.\n\nIn most cases these are defects caused\
    \ by the unintended use of the comma operator. It is easy to misuse the comma\
    \ operator (particularly in conditions) and it would be good practice to use it\
    \ only when the brevity it allows is absolutely necessary (e.g. macro definitions).\n\
    \n\n## Recommendation\nMake sure that the flagged expressions are not oversights.\
    \ To document that the value of the expression is deliberately ignored, you could\
    \ explicitly cast it to `void`.\n\n\n## Example\n\n```cpp\nvoid f(int j) {\n\t\
    int i=0;\n\tfor(i; i<10, j>0; ++i, --j) { //i < 10 has no effect, since the comma\
    \ \n\t                              //operator only returns the value of the last\
    \ expression\n\t\t/* ... */\n\t}\n}\n\n```\n\n## References\n* Tutorialspoint\
    \ - The C++ Programming Language: [C++ Comma Operator](http://www.tutorialspoint.com/cplusplus/cpp_comma_operator.htm)\n\
    * Common Weakness Enumeration: [CWE-561](https://cwe.mitre.org/data/definitions/561.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/FutileConditional.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/FutileConditional.bqrs
  metadata:
    name: Futile conditional
    description: |-
      An if-statement with an empty then-branch and no else-branch
                    may indicate that the code is incomplete.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/empty-if
    tags: |-
      reliability
             readability
  queryHelp: |
    # Futile conditional
    This rule finds If-statements with an empty then-branch and no else-branch. These statements are usually unimplemented skeleton code that should be implemented, or real unused code that should be removed to avoid confusion and misuse.


    ## Recommendation
    There might be missing statements in the then-branch or the expression in the condition can be rewritten without using an If-statement.


    ## Example

    ```cpp
    //empty then and else branches, will not do anything (other than the check)
    if (check(i)) {
    }

    ```
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/IncorrectNotOperatorUsage.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/IncorrectNotOperatorUsage.bqrs
  metadata:
    name: Incorrect 'not' operator usage
    description: |-
      Usage of a logical-not (!) operator as an operand for a bit-wise operation.
                    This commonly indicates the usage of an incorrect operator instead of the bit-wise not (~) operator,
                    also known as ones' complement operator.
    kind: problem
    id: cpp/incorrect-not-operator-usage
    problem.severity: warning
    security-severity: 7.5
    precision: medium
    tags: |-
      security
             external/cwe/cwe-480
  queryHelp: |
    # Incorrect 'not' operator usage
    This rule finds logical-not operator usage as an operator for in a bit-wise operation.

    Due to the nature of logical operation result value, only the lowest bit could possibly be set, and it is unlikely to be intent in bitwise operations. Violations are often indicative of a typo, using a logical-not (`!`) operator instead of the bit-wise not (`~`) operator.

    This rule is restricted to analyze bit-wise and (`&`) and bit-wise or (`|`) operation in order to provide better precision.

    This rule ignores instances where a double negation (`!!`) is explicitly used as the operator of the bitwise operation, as this is a commonly used as a mechanism to normalize an integer value to either 1 or 0.

    NOTE: It is not recommended to use this rule in kernel code or older C code as it will likely find several false positive instances.


    ## Recommendation
    Carefully inspect the flagged expressions. Consider the intent in the code logic, and decide whether it is necessary to change the not operator.


    ## Example
    Here is an example of this issue and how it can be fixed:


    ```cpp
    #define FLAGS   0x4004

    void f_warning(int i)
    {
        // BAD: the usage of the logical not operator in this case is unlikely to be correct
        // as the output is being used as an operator for a bit-wise and operation
        if (i & !FLAGS)
        {
            // code
        }
    }

    void f_fixed(int i)
    {
        if (i & ~FLAGS) // GOOD: Changing the logical not operator for the bit-wise not operator would fix this logic
        {
            // code
        }
    }

    ```
    In other cases, particularly when the expressions have `bool` type, the fix may instead be of the form `a && !b`.


    ## References
    * [warning C6317: incorrect operator: logical-not (!) is not interchangeable with ones-complement (~)](https://docs.microsoft.com/en-us/visualstudio/code-quality/c6317?view=vs-2017)
    * Common Weakness Enumeration: [CWE-480](https://cwe.mitre.org/data/definitions/480.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/MissingEnumCaseInSwitch.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/MissingEnumCaseInSwitch.bqrs
  metadata:
    name: Missing enum case in switch
    description: |-
      A switch statement over an enum type is missing a case for some enum constant
                    and does not have a default case. This may cause logic errors.
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/missing-case-in-switch
    tags: |-
      reliability
             correctness
             external/cwe/cwe-478
  queryHelp: "# Missing enum case in switch\nThis rule finds `switch` statements that\
    \ switch on values of an enumeration type but do not provide cases for all the\
    \ enumeration constants or a default case. This is an indication that there may\
    \ be cases unhandled by the `switch` statement.\n\n\n## Recommendation\nProvide\
    \ a case for every enumeration constant, or introduce a `default` case if several\
    \ constants should be treated the same way.\n\n\n## Example\n\n```cpp\ntypedef\
    \ enum {\n\tRED,\n\tORANGE,\n\tYELLOW,\n\tGREEN,\n\tBLUE,\n\tINDIGO,\n\tVIOLET\n\
    } colors;\n\nint f(colors c) {\n\tswitch (c) {\n\tcase RED:\n\t\t//...\n\tcase\
    \ GREEN:\n\t\t//...\n\tcase BLUE:\n\t\t//...\n\t\t//wrong: does not use all enum\
    \ values, and has no default\n\t}\n\n\tswitch(c) {\n\tcase RED:\n\t\t//...\n\t\
    case GREEN:\n\t\t//...\n\tdefault:\n\t\t//correct: does not use all enum values,\
    \ but has a default\n\t}\n}\n\n```\n\n## References\n* Tutorialspoint - The C++\
    \ Programming Language: [C++ switch statement](http://www.tutorialspoint.com/cplusplus/cpp_switch_statement.htm)\n\
    * MSDN Library: [switch statement (C++)](https://docs.microsoft.com/en-us/cpp/cpp/switch-statement-cpp)\n\
    * M. Henricson and E. Nyquist, *Industrial Strength C++*, Chapter 4: Control Flow,\
    \ Rec 4.5. Prentice Hall PTR, 1997 ([available online](https://web.archive.org/web/20190919025638/https://mongers.org/industrial-c++/)).\n\
    * Common Weakness Enumeration: [CWE-478](https://cwe.mitre.org/data/definitions/478.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/ShortCircuitBitMask.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/ShortCircuitBitMask.bqrs
  metadata:
    name: Short-circuiting operator applied to flag
    description: |-
      A short-circuiting logical operator is applied to what looks like a flag.
                    This may be a typo for a bitwise operator.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/logical-operator-applied-to-flag
    tags: |-
      reliability
             correctness
             external/cwe/cwe-480
  queryHelp: |
    # Short-circuiting operator applied to flag
    This rule finds a short-circuiting logical operator that is applied to what looks like a bit-mask. This may be a typo for a bitwise operator. Bit-masks are assumed to be constant operands whose value is a power of 2, except 1 and 0, since these could be legitimate truth values. Hexadecimal and octal literals are also considered bit masks.


    ## Recommendation
    Check if there should be a bitwise operator used instead of logical operator, or whether the constant should be compared to something.


    ## Example

    ```cpp

    unsigned int new_mask = old_mask || 0x0100; //wrong, || logical operator just returns 1 or 0

    unsigned int new_mask = old_mask | 0x0100; //right, | is a bit-mask operator

    ```

    ## References
    * B. Stroustrup, *The C++ Programming Language special ed*, p 123 Short-circuit operators. Addison-Wesley, 2000.
    * Common Weakness Enumeration: [CWE-480](https://cwe.mitre.org/data/definitions/480.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/UsingStrcpyAsBoolean.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/UsingStrcpyAsBoolean.bqrs
  metadata:
    name: Use of string copy function in a condition
    description: |-
      The return value for strcpy, strncpy, or related string copy
                    functions have no reserved return value to indicate an error.
                    Using them in a condition is likely to be a logic error.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/string-copy-return-value-as-boolean
    tags: correctness
  queryHelp: "# Use of string copy function in a condition\nThis query identifies\
    \ calls to string copy functions used in conditions, either directly or as part\
    \ of an equality operator or logical operator. The most common string copy functions\
    \ always return their `destination` parameter and do not have a return value reserved\
    \ to indicate an error. Therefore, such a function call always evaluates to true\
    \ in a Boolean context.\n\nThe string copy functions that the rule takes into\
    \ consideration are:\n\n* `strcpy`\n* `wcscpy`\n* `_mbscpy`\n* `strncpy`\n* `_strncpy_l`\n\
    * `wcsncpy`\n* `_wcsncpy_l`\n* `_mbsncpy`\n* `_mbsncpy_l`\nNOTE: It is highly\
    \ recommended to consider using a more secure version of string manipulation functions\
    \ such as as `strcpy_s`.\n\n\n## Recommendation\nCheck to ensure that the flagged\
    \ expressions are not typos.\n\nIf a string comparison is intended, change the\
    \ function to the appropriate string comparison function.\n\nIf a string copy\
    \ is really intended, very likely a secure version of the string copy function\
    \ such as `strcpy_s` was intended instead of the insecure version of the string\
    \ copy function.\n\n\n## Example\n\n```cpp\nif(strcpy(szbuf1, \"Manager\") ==\
    \ 0) // most likely strcmp was intended instead of strcpy\n{\n\t// ...\n}\n\n\
    ```\n\n## References\n* Microsoft Code Analysis for C/C++ Warnings: [C6324](https://docs.microsoft.com/en-us/previous-versions/visualstudio/visual-studio-2012/ccf4h9w8(v=vs.110))\n\
    * Microsoft C library reference: [strcpy, wcscpy, _mbscpy](https://docs.microsoft.com/en-us/cpp/c-runtime-library/reference/strcpy-wcscpy-mbscpy)\n\
    * US-CERT: [strcpy_s() and strcat_s()](https://www.us-cert.gov/bsi/articles/knowledge/coding-practices/strcpy_s-and-strcat_s)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Likely Typos/inconsistentLoopDirection.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Likely Typos/inconsistentLoopDirection.bqrs
  metadata:
    name: Inconsistent direction of for loop
    description: A for-loop iteration expression goes backward with respect of the
      initialization statement and condition expression.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/inconsistent-loop-direction
    tags: |-
      correctness
             external/cwe/cwe-835
    msrc.severity: important
  queryHelp: |
    # Inconsistent direction of for loop
    A `for-loop` iteration expression goes backwards with respect of the initialization statement and condition expression.

    This warning indicates that a `for-loop` might not function as intended.


    ## Recommendation
    To fix this issue, check that the loop condition is correct and change the iteration expression to match.


    ## Example
    In the following example, the initialization statement (`i = 0`) and the condition expression (`i < 100`) indicate that the intended iteration expression should have been incrementing, but instead a postfix decrement operator is used (`i--`).


    ```c
    void f()
    {
        for (signed char i = 0; i < 100; i--)
        {
            // code ...
        }
    }
    ```
    To fix this issue, change the iteration expression to match the direction of the initialization statement and the condition expression: `i++`.


    ## References
    * [warning C6293: Ill-defined for-loop: counts down from minimum](https://docs.microsoft.com/en-us/previous-versions/visualstudio/visual-studio-2012/58teb7hd(v=vs.110))
    * Common Weakness Enumeration: [CWE-835](https://cwe.mitre.org/data/definitions/835.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/AllocaInLoop.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/AllocaInLoop.bqrs
  metadata:
    name: Call to alloca in a loop
    description: Using alloca in a loop can lead to a stack overflow
    kind: problem
    problem.severity: warning
    security-severity: 7.5
    precision: high
    id: cpp/alloca-in-loop
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-770
  queryHelp: |
    # Call to alloca in a loop
    The `alloca` macro allocates memory by expanding the current stack frame. Invoking `alloca` within a loop may lead to a stack overflow because the memory is not released until the function returns.


    ## Recommendation
    Consider invoking `alloca` once outside the loop, or using `malloc` or `new` to allocate memory on the heap if the allocation must be done inside the loop.


    ## Example
    The variable `path` is allocated inside a loop with `alloca`. Consequently, storage for all copies of the path is present in the stack frame until the end of the function.


    ```cpp
    char *dir_path;
    char **dir_entries;
    int count;

    for (int i = 0; i < count; i++) {
      char *path = (char*)alloca(strlen(dir_path) + strlen(dir_entry[i]) + 2);
      // use path
    }

    ```
    In the revised example, `path` is allocated with `malloc` and freed at the end of the loop.


    ```cpp
    char *dir_path;
    char **dir_entries;
    int count;

    for (int i = 0; i < count; i++) {
      char *path = (char*)malloc(strlen(dir_path) + strlen(dir_entry[i]) + 2);
      // use path
      free(path);
    }

    ```

    ## References
    * Linux Programmer's Manual: [ALLOCA(3)](http://man7.org/linux/man-pages/man3/alloca.3.html).
    * Common Weakness Enumeration: [CWE-770](https://cwe.mitre.org/data/definitions/770.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/PointerOverflow.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/PointerOverflow.bqrs
  metadata:
    name: Pointer overflow check
    description: |-
      Adding a value to a pointer to check if it overflows relies
                    on undefined behavior and may lead to memory corruption.
    kind: problem
    problem.severity: error
    security-severity: 2.1
    precision: high
    id: cpp/pointer-overflow-check
    tags: |-
      reliability
             security
             external/cwe/cwe-758
  queryHelp: |
    # Pointer overflow check
    When checking for integer overflow, you may often write tests like `p + i < p`. This works fine if `p` and `i` are unsigned integers, since any overflow in the addition will cause the value to simply "wrap around." However, using this pattern when `p` is a pointer is problematic because pointer overflow has undefined behavior according to the C and C++ standards. If the addition overflows and has an undefined result, the comparison will likewise be undefined; it may produce an unintended result, or may be deleted entirely by an optimizing compiler.


    ## Recommendation
    To check whether an index `i` is less than the length of an array, simply compare these two numbers as unsigned integers: `i < ARRAY_LENGTH`. If the length of the array is defined as the difference between two pointers `ptr` and `p_end`, write `i < p_end - ptr`. If `i` is signed, cast it to unsigned in order to guard against negative `i`. For example, write `(size_t)i < p_end - ptr`.


    ## Example
    An invalid check for pointer overflow is most often seen as part of checking whether a number `a` is too large by checking first if adding the number to `ptr` goes past the end of an allocation and then checking if adding it to `ptr` creates a pointer so large that it overflows and wraps around.


    ```cpp
    bool not_in_range(T *ptr, T *ptr_end, size_t i) {
        return ptr + i >= ptr_end || ptr + i < ptr; // BAD
    }

    ```
    In both of these checks, the operations are performed in the wrong order. First, an expression that may cause undefined behavior is evaluated (`ptr + i`), and then the result is checked for being in range. But once undefined behavior has happened in the pointer addition, it cannot be recovered from: it's too late to perform the range check after a possible pointer overflow.

    While it's not the subject of this query, the expression `ptr + i < ptr_end` is also an invalid range check. It's undefined behavior in C/C++ to create a pointer that points more than one past the end of an allocation.

    The next example shows how to portably check whether an unsigned number is outside the range of an allocation between `ptr` and `ptr_end`.


    ```cpp
    bool not_in_range(T *ptr, T *ptr_end, size_t i) {
        return i >= ptr_end - ptr; // GOOD
    }
    ```

    ## References
    * Embedded in Academia: [Pointer Overflow Checking](https://blog.regehr.org/archives/1395).
    * LWN: [GCC and pointer overflows](https://lwn.net/Articles/278137/).
    * Common Weakness Enumeration: [CWE-758](https://cwe.mitre.org/data/definitions/758.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/ReturnCstrOfLocalStdString.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/ReturnCstrOfLocalStdString.bqrs
  metadata:
    name: Return c_str of local std::string
    description: |-
      Returning the c_str of a locally allocated std::string
         could cause the program to crash or behave non-deterministically
         because the memory is deallocated when the std::string goes out of
         scope.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/return-c-str-of-std-string
    tags: |-
      reliability
             correctness
  queryHelp: |
    # Return c_str of local std::string
    The `c_str` method of `std::string` returns a raw pointer to the memory buffer owned by the `std::string`. The pointer is only safe to use while the `std::string` is still in scope. When the `std::string` goes out of scope, its destructor is called and the memory is deallocated, so it is no longer safe to use the pointer.


    ## Example

    ```cpp
    #include <string>

    const char* hello() {
      std::string str("hello");
      return str.c_str();  // BAD: returning a dangling pointer.
    }

    ```

    ## Recommendation
    Avoid using C-strings. It is much safer to use `std::string` throughout the codebase, because then the memory will be automatically managed.

    If C-strings must be used, then be very careful to make sure that there are no pointers to the string that can outlive the lifetime of the string. For example, if the C-string is stack-allocated then it unsafe to store a pointer to the string anywhere on the heap unless you are sure that the heap memory will be deallocated before the end of the function.


    ## Example

    ```cpp
    #include <string>

    std::string hello() {
      std::string str("hello");
      return str;  // GOOD: returning a std::string is safe.
    }

    ```

    ## References
    * cplusplus.com: [std::string::c_str](http://www.cplusplus.com/reference/string/string/c_str/)
    * stackoverflow.com: [What is std::string::c_str() lifetime?](https://stackoverflow.com/questions/6456359/what-is-stdstringc-str-lifetime/6456408)
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/ReturnStackAllocatedMemory.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/ReturnStackAllocatedMemory.bqrs
  metadata:
    name: Returning stack-allocated memory
    description: |-
      A function returns a pointer to a stack-allocated region of
                    memory. This memory is deallocated at the end of the function,
                    which may lead the caller to dereference a dangling pointer.
    kind: path-problem
    id: cpp/return-stack-allocated-memory
    problem.severity: warning
    security-severity: 9.3
    precision: high
    tags: |-
      reliability
             security
             external/cwe/cwe-825
  queryHelp: "# Returning stack-allocated memory\nThis rule finds return statements\
    \ that return pointers to an object allocated on the stack. The lifetime of a\
    \ stack allocated memory location only lasts until the function returns, and the\
    \ contents of that memory become undefined after that. Clearly, using a pointer\
    \ to stack memory after the function has already returned will have undefined\
    \ results.\n\n\n## Recommendation\nUse the functions of the `malloc` family, or\
    \ `new`, to dynamically allocate memory on the heap for data that is used across\
    \ function calls.\n\n\n## Example\nThe following example allocates an object on\
    \ the stack and returns a pointer to it. This is incorrect because the object\
    \ is deallocated when the function returns, and the pointer becomes invalid.\n\
    \n\n```cpp\nRecord *mkRecord(int value) {\n\tRecord myRecord(value);\n\n\treturn\
    \ &myRecord; // BAD: returns a pointer to `myRecord`, which is a stack-allocated\
    \ object.\n}\n\n```\nTo fix this, allocate the object on the heap using `new`\
    \ and return a pointer to the heap-allocated object.\n\n\n```cpp\nRecord *mkRecord(int\
    \ value) {\n\tRecord *myRecord = new Record(value);\n\n\treturn myRecord; // GOOD:\
    \ returns a pointer to a `myRecord`, which is a heap-allocated object.\n}\n\n\
    ```\n\n## References\n* Common Weakness Enumeration: [CWE-825](https://cwe.mitre.org/data/definitions/825.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/StackAddressEscapes.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/StackAddressEscapes.bqrs
  metadata:
    name: Local variable address stored in non-local memory
    description: |-
      Storing the address of a local variable in non-local
                    memory can cause a dangling pointer bug if the address
                    is used after the function returns.
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/stack-address-escape
    tags: reliability
  queryHelp: |
    # Local variable address stored in non-local memory
    This rule finds assignments that might store the address of a local variable in non-local memory. The address of the local variable is only valid until the function returns, after which it becomes a dangling pointer. Such code is safe if the dangling pointer is never used after the function returns, but it is not a recommended coding practice. There is also a risk that the code is not thread-safe, unless the non-local memory is protected by a mutex.


    ## Recommendation
    1. If it is necessary to take the address of a local variable, then make sure that the address is only stored in memory that does not outlive the local variable. For example, it is safe to store the address in another local variable. Similarly, it is also safe to pass the address of a local variable to another function provided that the other function only uses it locally and does not store it in non-local memory.
    1. If it is necessary to store an address which will outlive the current function scope, then it should be allocated on the heap. Care should be taken to make sure that the memory is deallocated when it is no longer needed, particularly when using low-level memory management routines such as `malloc`/`free` or `new`/`delete`. Modern C++ applications often use smart pointers, such as `std::shared_ptr`, to reduce the chance of a memory leak.

    ## Example

    ```cpp
    static const int* xptr;

    void example1() {
      int x = 0;
      xptr = &x; // BAD: address of local variable stored in non-local memory.
    }

    void example2() {
      static const int x = 0;
      xptr = &x; // GOOD: storing address of static variable is safe.
    }

    ```

    ## References
    * Wikipedia: [Dangling pointer](https://en.wikipedia.org/wiki/Dangling_pointer).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Memory Management/StrncpyFlippedArgs.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Memory Management/StrncpyFlippedArgs.bqrs
  metadata:
    name: Possibly wrong buffer size in string copy
    description: |-
      Calling 'strncpy' with the size of the source buffer
                    as the third argument may result in a buffer overflow.
    kind: problem
    problem.severity: warning
    security-severity: 9.3
    precision: medium
    id: cpp/bad-strncpy-size
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-676
             external/cwe/cwe-119
             external/cwe/cwe-251
  queryHelp: |
    # Possibly wrong buffer size in string copy
    The standard library function `strncpy` copies a source string to a destination buffer. The third argument defines the maximum number of characters to copy and should be less than or equal to the size of the destination buffer. Calls of the form `strncpy(dest, src, strlen(src))` or `strncpy(dest, src, sizeof(src))` incorrectly set the third argument to the size of the source buffer. Executing a call of this type may cause a buffer overflow. Buffer overflows can lead to anything from a segmentation fault to a security vulnerability.


    ## Recommendation
    Check the highlighted function calls carefully, and ensure that the size parameter is derived from the size of the destination buffer, not the source buffer.


    ## Example
    In the following examples, the size of the source buffer is incorrectly used as a parameter to `strncpy`:


    ```cpp
    char src[256];
    char dest1[128];

    ...

    strncpy(dest1, src, sizeof(src)); // wrong: size of dest should be used

    char *dest2 = (char *)malloc(sz1 + sz2 + sz3);
    strncpy(dest2, src, strlen(src)); // wrong: size of dest should be used

    ```
    The corrected version uses the size of the destination buffer, or a variable containing the size of the destination buffer as the size parameter to `strncpy`:


    ```cpp
    char src[256];
    char dest1[128];

    ...

    strncpy(dest1, src, sizeof(dest1)); // correct

    size_t destSize = sz1 + sz2 + sz3;
    char *dest2 = (char *)malloc(destSize);
    strncpy(dest2, src, destSize); // correct

    ```

    ## References
    * cplusplus.com: [strncpy](https://cplusplus.com/reference/cstring/strncpy/).
    * I. Gerg. *An Overview and Example of the Buffer-Overflow Exploit*. IANewsletter vol 7 no 4. 2005.
    * M. Donaldson. *Inside the Buffer Overflow Attack: Mechanism, Method &amp; Prevention*. SANS Institute InfoSec Reading Room. 2002.
    * Common Weakness Enumeration: [CWE-676](https://cwe.mitre.org/data/definitions/676.html).
    * Common Weakness Enumeration: [CWE-119](https://cwe.mitre.org/data/definitions/119.html).
    * Common Weakness Enumeration: [CWE-251](https://cwe.mitre.org/data/definitions/251.html).
 -
