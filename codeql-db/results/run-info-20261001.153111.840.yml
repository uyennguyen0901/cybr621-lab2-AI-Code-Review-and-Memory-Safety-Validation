  relativeQueryPath: Likely Bugs/Arithmetic/UnsignedGEZero.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Arithmetic/UnsignedGEZero.bqrs
  metadata:
    name: Unsigned comparison to zero
    description: |-
      An unsigned value is always non-negative, even if it has been
                    assigned a negative number, so the comparison is redundant and
                    may mask a bug because a different check was intended.
    kind: problem
    problem.severity: warning
    precision: very-high
    id: cpp/unsigned-comparison-zero
    tags: |-
      maintainability
             readability
  queryHelp: "# Unsigned comparison to zero\nThis rule finds expressions of the form\
    \ `x >= 0` where `x` is an unsigned value. This comparison is pointless as it\
    \ will always yield `1`.\n\n\n## Recommendation\nCheck the expression to see whether\
    \ a different semantics was intended.\n\n\n## Example\n\n```cpp\ntypedef long\
    \ long LONGLONG;\n\nint f(unsigned int u, LONGLONG l) {\n\tif(u > 0 || l >=0)\
    \       //correct: unsigned value is check for > 0\n\t\treturn 23;\n\treturn u\
    \ >= 0;           //wrong: unsigned values are always greater than or equal to\
    \ 0\n}\n\n```\n\n## References\n* [Variables. Data types.](http://www.cplusplus.com/doc/tutorial/variables/)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/ContinueInFalseLoop.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/ContinueInFalseLoop.bqrs
  metadata:
    name: Continue statement that does not continue
    description: |-
      A 'continue' statement only re-runs the loop if the loop-condition is true. Therefore
                    using 'continue' in a loop with a constant false condition is misleading and usually
                    a bug.
    kind: problem
    id: cpp/continue-in-false-loop
    problem.severity: warning
    precision: high
    tags: correctness
  queryHelp: |
    # Continue statement that does not continue
    A `continue` statement only re-runs the loop if the loop condition is true. Therefore using `continue` in a loop with a constant false condition will never cause the loop body to be re-run, which is misleading.


    ## Recommendation
    Replace the `continue` statement with a `break` statement if the intent is to break from the loop.


    ## References
    * Tutorialspoint - C Programming Language: [Continue Statement in C](https://www.tutorialspoint.com/cprogramming/c_continue_statement.htm).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Conversion/ArrayArgSizeMismatch.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Conversion/ArrayArgSizeMismatch.bqrs
  metadata:
    name: Array argument size mismatch
    description: |-
      Finds function calls where the size of an array being passed is smaller than the array size of the declared parameter.
                    This could lead to accesses to memory locations beyond the parameter's array bounds.
    kind: problem
    id: cpp/array-arg-size-mismatch
    problem.severity: warning
    precision: high
    tags: reliability
  queryHelp: "# Array argument size mismatch\nThis rule looks for function calls where\
    \ the size of the array being passed is smaller than the size of the declared\
    \ array parameter for the function. This is most likely going to lead to memory\
    \ accesses that are beyond the bounds of the passed array.\n\nThe size of the\
    \ array being passed is very likely wrong as it does not match that of the function's\
    \ parameter.\n\n\n## Recommendation\nCheck the array being passed to the function\
    \ is correct, or modify its size to match that of the function's array parameter.\n\
    \n\n## Example\n\n```cpp\n\n//Function foo's array parameter has a specified size\n\
    void foo(int a[10]) {\n\tint i = 0;\n\tfor (i = 0; i <10; i++) {\n\t\ta[i] = i\
    \ * 2;\n\t}\n}\n\n...\n\nint my_arr[5];\nfoo(my_arr); //my_arr is smaller than\
    \ foo's array parameter, and will cause access to memory outside its bounds\n\
    ```\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Conversion/CastArrayPointerArithmetic.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Conversion/CastArrayPointerArithmetic.bqrs
  metadata:
    name: Upcast array used in pointer arithmetic
    description: |-
      An array with elements of a derived struct type is cast to a
                    pointer to the base type of the struct. If pointer arithmetic or
                    an array dereference is done on the resulting pointer, it will
                    use the width of the base type, leading to misaligned reads.
    kind: path-problem
    problem.severity: warning
    security-severity: 9.3
    precision: high
    id: cpp/upcast-array-pointer-arithmetic
    tags: |-
      correctness
             reliability
             security
             external/cwe/cwe-119
             external/cwe/cwe-843
  queryHelp: "# Upcast array used in pointer arithmetic\nA pointer to a derived class\
    \ may be implicitly converted to a pointer to its base type when passed as an\
    \ argument to a function expecting a pointer to the base type. If pointer arithmetic\
    \ or an array dereference is then used, it will be performed using the size of\
    \ the base type. This can lead to reading data from unexpected fields in the derived\
    \ type.\n\n\n## Recommendation\nOnly convert pointers to single objects. If you\
    \ must work with a sequence of objects that are converted to a base type, use\
    \ an array of pointers rather than a pointer to an array.\n\n\n## Example\n\n\
    ```cpp\nclass Base {\npublic:\n\tint x;\n}\n\nclass Derived: public Base {\npublic:\n\
    \tint y;\n};\n\nvoid dereference_base(Base *b) {\n\tb[2].x;\n}\n\nvoid dereference_derived(Derived\
    \ *d) {\n\td[2].x;\n}\n\nvoid test () {\n\tDerived[4] d;\n\tdereference_base(d);\
    \ // BAD: implicit conversion to Base*\n\n\tdereference_derived(d); // GOOD: implicit\
    \ conversion to Derived*, which will be the right size\n}\n\n```\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Conversion/ImplicitDowncastFromBitfield.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Conversion/ImplicitDowncastFromBitfield.bqrs
  metadata:
    name: Implicit downcast from bitfield
    description: |-
      A bitfield is implicitly downcast to a smaller integer type.
                    This could lead to loss of upper bits of the bitfield.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/implicit-bitfield-downcast
    tags: |-
      reliability
             correctness
             types
  queryHelp: "# Implicit downcast from bitfield\nA bitfield may be unintentionally\
    \ truncated when implicitly cast to an integer type storing fewer bits. This can\
    \ lead to inaccurate iteration or allocation when the bitfield is used to count\
    \ elements of a data structure, or to loss of information stored in the upper\
    \ portion of the bitfield.\n\n\n## Recommendation\nUse the bitfield with a wider\
    \ integer type, or use an explicit cast if the truncation is intended.\n\n\n##\
    \ Example\nIn the following example, a bitfield is accessed both through a method\
    \ that truncates it and through direct field access. This results in a buffer\
    \ overflow in the for loop.\n\n\n```c\ntypedef struct {\n\tunsigned int x : 24;\n\
    } my_struct;\n\nunsigned short getX(my_struct s ) {\n\treturn s.x; //BAD: implicit\
    \ truncation\n}\n\nunsigned int getXGood(my_struct s) {\n\treturn s.x //GOOD:\
    \ no truncation\n}\n\nint main (int argc, char **argv) {\n\tmy_struct s;\n\ts.x\
    \ = USHORT_MAX + 1;\n\tint* array = calloc(sizeof(int), getX(s)); //BAD: buffer\
    \ allocated is smaller than intended\n\tfor (int i = 0; i < s.x; i++) {\n\t\t\
    array[i] = i;\n\t}\n\n\tint* array2 = calloc(sizeof(int), getXGood(s)); //GOOD\n\
    \tfor (int i = 0; i < s.x; i++) {\n\t\tarray[i] = i;\n\t}\n}\n\n```\n\n## References\n\
    * [cpp-reference.com: Bit field](http://en.cppreference.com/w/cpp/language/bit_field)\n\
    * [cpp-reference.com: Implicit conversion](http://en.cppreference.com/w/cpp/language/implicit_conversion)\n\
    * [https://cwe.mitre.org/data/definitions/681.html](https://cwe.mitre.org/data/definitions/681.html)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Conversion/LossyFunctionResultCast.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Conversion/LossyFunctionResultCast.bqrs
  metadata:
    name: Lossy function result cast
    description: |-
      Finds function calls whose result type is a floating point type, and which are casted to an integral type.
                    Includes only expressions with implicit cast and excludes function calls to ceil, floor and round.
    kind: problem
    id: cpp/lossy-function-result-cast
    problem.severity: warning
    precision: medium
    tags: correctness
  queryHelp: "# Lossy function result cast\nThis rule finds function calls whose result\
    \ type is a floating point type, which are implicitly cast to an integral type.\
    \ Such code may not behave as intended when the floating point return value has\
    \ a fractional part, or takes an extreme value outside the range that can be represented\
    \ by the integer type.\n\n\n## Recommendation\nConsider changing the surrounding\
    \ expression to match the floating point type. If rounding is intended, explicitly\
    \ round using a standard function such as `trunc`, `floor` or `round`.\n\n\n##\
    \ Example\n\n```cpp\ndouble getWidth();\n\nvoid f() {\n\tint width = getWidth();\n\
    \t\n\t// ...\n}\n\n```\nIn this example, the result of the call to `getWidth()`\
    \ is implicitly cast to `int`, resulting in an unintended loss of accuracy. To\
    \ fix this, the type of variable `width` could be changed from `int` to `double`.\n\
    \n\n## References\n* Microsoft Visual C++ Documentation: [Type Conversions and\
    \ Type Safety (Modern C++)](https://docs.microsoft.com/en-us/cpp/cpp/type-conversions-and-type-safety-modern-cpp?view=vs-2017).\n\
    * Cplusplus.com: [Type conversions](http://www.cplusplus.com/doc/tutorial/typecasting/).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Conversion/LossyPointerCast.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Conversion/LossyPointerCast.bqrs
  metadata:
    name: Lossy pointer cast
    description: |-
      A pointer type is converted to a smaller integer type. This may
                    lead to loss of information in the variable and is highly
                    non-portable.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/lossy-pointer-cast
    tags: |-
      reliability
             correctness
             types
  queryHelp: "# Lossy pointer cast\nThis rule finds expressions of pointer type which\
    \ are (implicitly or explicitly) converted to an integer type of smaller size.\
    \ This results in truncation of the most significant bits of the larger integer\
    \ type.\n\nSuch conversions are highly non-portable, since the relative size of\
    \ integer and pointer types may differ between architectures. For example, while\
    \ on a 32-bit architecture both type `int` and type `char*` are four bytes wide,\
    \ the latter occupies eight bytes on a 64-bit machine.\n\n\n## Recommendation\n\
    Avoid converting between pointer types and integer types.\n\n\n## Example\n\n\
    ```cpp\nvoid f(char *p) {\n\tint my_ptr = p; //Wrong: pointer assigned to int,\
    \ would be incorrect if sizeof(char*) \n\t                //is larger than sizeof(int)\n\
    \t//...\n}\n\n```\n\n## References\n* MSDN Library: [Type Conversions and Type\
    \ Safety](https://docs.microsoft.com/en-us/cpp/cpp/type-conversions-and-type-safety-modern-cpp).\n\
    * Cplusplus.com: [Type conversions](http://www.cplusplus.com/doc/tutorial/typecasting/).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Format/NonConstantFormat.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Format/NonConstantFormat.bqrs
  metadata:
    name: Non-constant format string
    description: |-
      Passing a value that is not a string literal 'format' string to a printf-like function can lead
                    to a mismatch between the number of arguments defined by the 'format' and the number
                    of arguments actually passed to the function. If the format string ultimately stems
                    from an untrusted source, this can be used for exploits.
                    This query finds format strings coming from non-literal sources. Note that format strings of
                    type `const char*` it is still considered non-constant if the value is not coming from a string
                    literal. For example, for a parameter with type `const char*` of an exported function that is
                    used as a format string, there is no way to ensure the originating value was a string literal.
    kind: path-problem
    problem.severity: recommendation
    security-severity: 9.3
    precision: high
    id: cpp/non-constant-format
    tags: |-
      maintainability
             correctness
             security
             external/cwe/cwe-134
  queryHelp: |
    # Non-constant format string
    The `printf` function, related functions like `sprintf` and `fprintf`, and other functions built atop `vprintf` all accept a format string as one of their arguments. When such format strings are literal constants, it is easy for the programmer (and static analysis tools) to verify that the format specifiers (such as `%s` and `%02x`) in the format string are compatible with the trailing arguments of the function call. When such format strings are not literal constants, it is more difficult to maintain the program: programmers (and static analysis tools) must perform non-local data-flow analysis to deduce what values the format string argument might take.


    ## Recommendation
    If the argument passed as a format string is meant to be a plain string rather than a format string, then pass `%s` as the format string, and pass the original argument as the sole trailing argument.

    If the argument passed as a format string is a parameter to the enclosing function, then consider redesigning the enclosing function's API to be less brittle.


    ## Example
    The following program is meant to echo its command line arguments:


    ```c
    #include <stdio.h>
    int main(int argc, char** argv) {
      for(int i = 1; i < argc; ++i) {
        printf(argv[i]);
      }
    }
    ```
    The above program behaves as expected in most cases, but breaks when one of its command line arguments contains a percent character. In such cases, the behavior of the program is undefined: it might echo garbage, it might crash, or it might give a malicious attacker root access. One way of addressing the problem is to use a constant `%s` format string, as in the following program:


    ```c
    #include <stdio.h>
    int main(int argc, char** argv) {
      for(int i = 1; i < argc; ++i) {
        printf("%s", argv[i]);
      }
    }
    ```

    ## Example
    The following program defines a `log_with_timestamp` function:


    ```c
    void log_with_timestamp(const char* message) {
      struct tm now;
      time(&now);
      printf("[%s] ", asctime(now));
      printf(message);
    }

    int main(int argc, char** argv) {
      log_with_timestamp("Application is starting...\n");
      /* ... */
      log_with_timestamp("Application is closing...\n");
      return 0;
    }
    ```
    In the code that is visible, the reader can verify that `log_with_timestamp` is never called with a log message containing a percent character, but even if all current calls are correct, this presents an ongoing maintenance burden to ensure that newly-introduced calls don't contain percent characters. As in the previous example, one solution is to make the log message a trailing argument of the function call:


    ```c
    void log_with_timestamp(const char* message) {
      struct tm now;
      time(&now);
      printf("[%s] %s", asctime(now), message);
    }

    int main(int argc, char** argv) {
      log_with_timestamp("Application is starting...\n");
      /* ... */
      log_with_timestamp("Application is closing...\n");
      return 0;
    }
    ```
    An alternative solution is to allow `log_with_timestamp` to accept format arguments:


    ```c
    void log_with_timestamp(const char* message, ...) {
      va_list args;
      va_start(args, message);
      struct tm now;
      time(&now);
      printf("[%s] ", asctime(now));
      vprintf(message, args);
      va_end(args);
    }

    int main(int argc, char** argv) {
      log_with_timestamp("%s is starting...\n", argv[0]);
      /* ... */
      log_with_timestamp("%s is closing...\n", argv[0]);
      return 0;
    }
    ```
    In this formulation, the non-constant format string to `printf` has been replaced with a non-constant format string to `vprintf`. The analysis will no longer consider the body of `log_with_timestamp` to be a problem, and will instead check that every call to `log_with_timestamp` passes a constant format string.


    ## References
    * CERT C Coding Standard: [FIO30-C. Exclude user input from format strings](https://www.securecoding.cert.org/confluence/display/c/FIO30-C.+Exclude+user+input+from+format+strings).
    * M. Howard, D. Leblanc, J. Viega, *19 Deadly Sins of Software Security: Programming Flaws and How to Fix Them*.
    * Common Weakness Enumeration: [CWE-134](https://cwe.mitre.org/data/definitions/134.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Format/SnprintfOverflow.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Format/SnprintfOverflow.bqrs
  metadata:
    name: Potentially overflowing call to snprintf
    description: Using the return value from snprintf without proper checks can cause
      overflow.
    kind: problem
    problem.severity: warning
    security-severity: 8.1
    precision: high
    id: cpp/overflowing-snprintf
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-190
             external/cwe/cwe-253
  queryHelp: "# Potentially overflowing call to snprintf\nThe return value of a call\
    \ to `snprintf` is the number of characters that *would have* been written to\
    \ the buffer assuming there was sufficient space. In the event that the operation\
    \ reaches the end of the buffer and more than one character is discarded, the\
    \ return value will be greater than the buffer size. This can cause incorrect\
    \ behavior, for example:\n\n\n## Example\n\n```cpp\n#define BUF_SIZE (32)\n\n\
    int main(int argc, char *argv[])\n{\n\tchar buffer[BUF_SIZE];\n\tsize_t pos =\
    \ 0;\n\tint i;\n\n\tfor (i = 0; i < argc; i++)\n\t{\n\t\tpos += snprintf(buffer\
    \ + pos, BUF_SIZE - pos, \"%s\", argv[i]);\n\t\t\t// BUF_SIZE - pos may overflow\n\
    \t}\n}\n\n```\n\n## Recommendation\nThe return value of `snprintf` should always\
    \ be checked if it is used, and values larger than the buffer size should be accounted\
    \ for.\n\n\n## Example\n\n```cpp\n#define BUF_SIZE (32)\n\nint main(int argc,\
    \ char *argv[])\n{\n\tchar buffer[BUF_SIZE];\n\tsize_t pos = 0;\n\tint i;\n\n\t\
    for (i = 0; i < argc; i++)\n\t{\n\t\tint n = snprintf(buffer + pos, BUF_SIZE -\
    \ pos, \"%s\", argv[i]);\n\t\tif (n < 0 || n >= BUF_SIZE - pos)\n\t\t{\n\t\t\t\
    break;\n\t\t}\n\t\tpos += n;\n\t}\n}\n\n```\n\n## References\n* cplusplus.com:\
    \ [snprintf](http://www.cplusplus.com/reference/cstdio/snprintf/).\n* Red Hat\
    \ Customer Portal: [The trouble with snprintf](https://access.redhat.com/blogs/766093/posts/1976193).\n\
    * Common Weakness Enumeration: [CWE-190](https://cwe.mitre.org/data/definitions/190.html).\n\
    * Common Weakness Enumeration: [CWE-253](https://cwe.mitre.org/data/definitions/253.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Format/TooManyFormatArguments.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Format/TooManyFormatArguments.bqrs
  metadata:
    name: Too many arguments to formatting function
    description: |-
      A printf-like function called with too many arguments will
                    ignore the excess arguments and output less than might
                    have been intended.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/too-many-format-arguments
    tags: |-
      reliability
             correctness
  queryHelp: |
    # Too many arguments to formatting function
    Each call to the `printf` function, or a related function, should include the number of arguments defined by the format. Passing the function more arguments than required is usually harmless from a security perspective but indicates that different behavior was intended.


    ## Recommendation
    Review the format and arguments expected by the highlighted function calls. Update either the format or the arguments so that the expected number of arguments are passed to the function.


    ## Example

    ```cpp
    void log_connection_attempt(const char *user_name, char char *ip_address) {
      // This does not print `ip_address`.
      fprintf(stderr, "Connection attempted by '%s'\n", user_name, ip_address);
    }

    ```

    ## References
    * CERT C Coding Standard: [FIO47-C. Use valid format strings](https://wiki.sei.cmu.edu/confluence/display/c/FIO47-C.+Use+valid+format+strings).
    * Microsoft C Runtime Library Reference: [printf, wprintf](https://docs.microsoft.com/en-us/cpp/c-runtime-library/reference/printf-printf-l-wprintf-wprintf-l).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Format/WrongNumberOfFormatArguments.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Format/WrongNumberOfFormatArguments.bqrs
  metadata:
    name: Too few arguments to formatting function
    description: |-
      Calling a printf-like function with too few arguments can be
                    a source of security issues.
    kind: problem
    problem.severity: error
    security-severity: 5.0
    precision: high
    id: cpp/wrong-number-format-arguments
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-234
             external/cwe/cwe-685
  queryHelp: |
    # Too few arguments to formatting function
    Each call to the `printf` function, or a related function, should include the number of arguments defined by the format. Passing the function more arguments than required is harmless (although it may be indicative of other defects). However, passing the function fewer arguments than are defined by the format can be a security vulnerability since the function will process the next item on the stack as the missing arguments.

    This might lead to an information leak if a sensitive value from the stack is printed. It might cause a crash if a value on the stack is interpreted as a pointer and leads to accessing unmapped memory. Finally, it may lead to a follow-on vulnerability if an attacker can use this problem to cause the output string to be too long or have unexpected contents.


    ## Recommendation
    Review the format and arguments expected by the highlighted function calls. Update either the format or the arguments so that the expected number of arguments are passed to the function.


    ## Example

    ```cpp
    int main() {
      printf("%d, %s\n", 42); // Will crash or print garbage
      return 0;
    }

    ```

    ## References
    * CERT C Coding Standard: [FIO47-C. Use valid format strings](https://wiki.sei.cmu.edu/confluence/display/c/FIO47-C.+Use+valid+format+strings).
    * Microsoft C Runtime Library Reference: [printf, wprintf](https://docs.microsoft.com/en-us/cpp/c-runtime-library/reference/printf-printf-l-wprintf-wprintf-l).
    * Common Weakness Enumeration: [CWE-234](https://cwe.mitre.org/data/definitions/234.html).
    * Common Weakness Enumeration: [CWE-685](https://cwe.mitre.org/data/definitions/685.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Format/WrongTypeFormatArguments.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Format/WrongTypeFormatArguments.bqrs
  metadata:
    name: Wrong type of arguments to formatting function
    description: |-
      Calling a printf-like function with the wrong type of arguments causes unpredictable
                    behavior.
    kind: problem
    problem.severity: error
    security-severity: 7.5
    precision: high
    id: cpp/wrong-type-format-argument
    tags: |-
      reliability
             correctness
             security
             external/cwe/cwe-686
  queryHelp: |
    # Wrong type of arguments to formatting function
    Each call to the `printf` function or a related function should include the type and sequence of arguments defined by the format. If the function is passed arguments of a different type or in a different sequence then the arguments are reinterpreted to fit the type and sequence expected, resulting in unpredictable behavior.


    ## Recommendation
    Review the format and arguments expected by the highlighted function calls. Update either the format or the arguments so that the expected type and sequence of arguments are passed to the function.


    ## Example
    In the following example, the wrong format specifier is given for an integer format argument:


    ```cpp
    int main() {
      printf("%s\n", 42); // BAD: printf will treat 42 as a char*, will most likely segfault
      return 0;
    }

    ```
    The corrected version uses `%i` as the format specifier for the integer format argument:


    ```cpp
    int main() {
      printf("%i\n", 42); // GOOD: printf will treat 42 as an int
      return 0;
    }

    ```

    ## References
    * Microsoft Learn: [Format specification syntax: printf and wprintf functions](https://learn.microsoft.com/en-us/cpp/c-runtime-library/format-specification-syntax-printf-and-wprintf-functions?view=msvc-170).
    * cplusplus.com:[](https://cplusplus.com/reference/cstdio/printf/)printf
    * CERT C Coding Standard: [FIO47-C. Use valid format strings](https://wiki.sei.cmu.edu/confluence/display/c/FIO47-C.+Use+valid+format+strings).
    * Common Weakness Enumeration: [CWE-686](https://cwe.mitre.org/data/definitions/686.html).
 -
