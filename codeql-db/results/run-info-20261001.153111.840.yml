  relativeQueryPath: Security/CWE/CWE-193/InvalidPointerDeref.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-193/InvalidPointerDeref.bqrs
  metadata:
    name: Invalid pointer dereference
    description: Dereferencing an out-of-bounds pointer is undefined behavior and
      may lead to security vulnerabilities.
    kind: path-problem
    problem.severity: error
    security-severity: 9.3
    precision: medium
    id: cpp/invalid-pointer-deref
    tags: |-
      reliability
             security
             external/cwe/cwe-119
             external/cwe/cwe-125
             external/cwe/cwe-193
             external/cwe/cwe-787
  queryHelp: "# Invalid pointer dereference\nThe program performs an out-of-bounds\
    \ read or write operation, which can cause program instability. In addition, attackers\
    \ may take advantage of the situation, and implement techniques to use this vulnerability\
    \ to execute arbitrary code.\n\n\n## Recommendation\nEnsure that pointer dereferences\
    \ are properly guarded to ensure that they cannot be used to read or write past\
    \ the end of the allocation.\n\n\n## Example\nThe first example allocates a buffer\
    \ of size `size` and creates a local variable that stores the location that is\
    \ one byte past the end of the allocation. This local variable is then dereferenced,\
    \ which results in an out-of-bounds write. The second example subtracts one from\
    \ the `end` variable before dereferencing it. This subtraction ensures that the\
    \ write correctly updates the final byte of the allocation.\n\n\n```cpp\nvoid\
    \ *malloc(unsigned);\nunsigned get_size();\nvoid write_data(const unsigned char*,\
    \ const unsigned char*);\n\nint main(int argc, char* argv[]) {\n  unsigned size\
    \ = get_size();\n  \n  {\n    unsigned char *begin = (unsigned char*)malloc(size);\n\
    \    if(!begin) return -1;\n\n    unsigned char* end = begin + size;\n    write_data(begin,\
    \ end);\n    *end = '\\0'; // BAD: Out-of-bounds write\n  }\n\n  {\n    unsigned\
    \ char *begin = (unsigned char*)malloc(size);\n    if(!begin) return -1;\n\n \
    \   unsigned char* end = begin + size;\n    write_data(begin, end);\n    *(end\
    \ - 1) = '\\0'; // GOOD: writing to the last byte\n  }\n\n}\n```\n\n## References\n\
    * CERT C Coding Standard: [ARR30-C. Do not form or use out-of-bounds pointers\
    \ or array subscripts](https://wiki.sei.cmu.edu/confluence/display/c/ARR30-C.+Do+not+form+or+use+out-of-bounds+pointers+or+array+subscripts).\n\
    * OWASP: [Buffer Overflow](https://owasp.org/www-community/vulnerabilities/Buffer_Overflow).\n\
    * Common Weakness Enumeration: [CWE-119](https://cwe.mitre.org/data/definitions/119.html).\n\
    * Common Weakness Enumeration: [CWE-125](https://cwe.mitre.org/data/definitions/125.html).\n\
    * Common Weakness Enumeration: [CWE-193](https://cwe.mitre.org/data/definitions/193.html).\n\
    * Common Weakness Enumeration: [CWE-787](https://cwe.mitre.org/data/definitions/787.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-253/HResultBooleanConversion.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-253/HResultBooleanConversion.bqrs
  metadata:
    name: Cast between HRESULT and a Boolean type
    description: Casting an HRESULT to/from a Boolean type and then using it in a
      test expression will yield an incorrect result because success (S_OK) in HRESULT
      is indicated by a value of 0.
    kind: problem
    id: cpp/hresult-boolean-conversion
    problem.severity: error
    security-severity: 7.5
    precision: high
    tags: |-
      security
             external/cwe/cwe-253
  queryHelp: |
    # Cast between HRESULT and a Boolean type
    This query indicates that an `HRESULT` is being cast to a Boolean type or vice versa.

    The typical success value (`S_OK`) of an `HRESULT` equals 0. However, 0 indicates failure for a Boolean type.

    Casting an `HRESULT` to a Boolean type and then using it in a test expression will yield an incorrect result.


    ## Recommendation
    To check if a call that returns an `HRESULT` succeeded use the `FAILED` macro.


    ## Example
    In the following example, `HRESULT` is used in a test expression incorrectly as it may yield an incorrect result.


    ```cpp
    LPMALLOC pMalloc;
    HRESULT hr = CoGetMalloc(1, &pMalloc);

    if (!hr)
    {
        // code ...
    }

    ```
    To fix this issue, use the `FAILED` macro in the test expression.


    ## References
    * Common Weakness Enumeration: [CWE-253](https://cwe.mitre.org/data/definitions/253.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-290/AuthenticationBypass.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-290/AuthenticationBypass.bqrs
  metadata:
    name: Authentication bypass by spoofing
    description: |-
      Authentication by checking that the peer's address
                    matches a known IP or web address is unsafe as it is
                    vulnerable to spoofing attacks.
    kind: path-problem
    problem.severity: warning
    security-severity: 8.1
    precision: medium
    id: cpp/user-controlled-bypass
    tags: |-
      security
             external/cwe/cwe-290
  queryHelp: |
    # Authentication bypass by spoofing
    Code which relies on an IP address or domain name for authentication can be exploited by an attacker who spoofs their address.


    ## Recommendation
    IP address verification can be a useful part of an authentication scheme, but it should not be the single factor required for authentication. Make sure that other authentication methods are also in place.


    ## Example
    In this example (taken from [CWE-290: Authentication Bypass by Spoofing](http://cwe.mitre.org/data/definitions/290.html)), the client is authenticated by checking that its IP address is `127.0.0.1`. An attacker might be able to bypass this authentication by spoofing their IP address.


    ```cpp

    #define BUFFER_SIZE (4 * 1024)

    void receiveData()
    {
      int sock;
      sockaddr_in addr, addr_from;
      char buffer[BUFFER_SIZE];
      int msg_size;
      socklen_t addr_from_len;

      // configure addr
      memset(&addr, 0, sizeof(addr));
      addr.sin_family = AF_INET;
      addr.sin_port = htons(1234);
      addr.sin_addr.s_addr = INADDR_ANY;

      // create and bind the socket
      sock = socket(AF_INET, SOCK_DGRAM, 0);
      bind(sock, (sockaddr *)&addr, sizeof(addr));

      // receive message
      addr_from_len = sizeof(addr_from);
      msg_size = recvfrom(sock, buffer, BUFFER_SIZE, 0, (sockaddr *)&addr_from, &addr_from_len);

      // BAD: the address is controllable by the user, so it
      // could be spoofed to bypass the security check below.
      if ((msg_size > 0) && (strcmp("127.0.0.1", inet_ntoa(addr_from.sin_addr)) == 0))
      {
        // ...
      }
    }

    ```

    ## References
    * Common Weakness Enumeration: [CWE-290](https://cwe.mitre.org/data/definitions/290.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-295/SSLResultConflation.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-295/SSLResultConflation.bqrs
  metadata:
    name: Certificate result conflation
    description: Only accept SSL certificates that pass certificate verification.
    kind: problem
    problem.severity: error
    security-severity: 7.5
    precision: medium
    id: cpp/certificate-result-conflation
    tags: |-
      security
             external/cwe/cwe-295
  queryHelp: "# Certificate result conflation\nWhen checking the result of SSL certificate\
    \ verification, accepting any error code may allow an attacker to impersonate\
    \ someone who is trusted.\n\n\n## Recommendation\nWhen checking an SSL certificate\
    \ with `SSL_get_verify_result`, only `X509_V_OK` is a success code. If there is\
    \ any other result the certificate should not be accepted.\n\n\n## Example\nIn\
    \ this example the error code `X509_V_ERR_CERT_HAS_EXPIRED` is treated the same\
    \ as an OK result. An expired certificate should not be accepted as it is more\
    \ likely to be compromised than a valid certificate.\n\n\n```cpp\n// ...\n\nif\
    \ (cert = SSL_get_peer_certificate(ssl))\n{\n\tresult = SSL_get_verify_result(ssl);\n\
    \n\tif ((result == X509_V_OK) || (result == X509_V_ERR_CERT_HAS_EXPIRED)) // BAD\
    \ (conflates OK and a non-OK codes)\n\t{\n\t\tdo_ok();\n\t} else {\n\t\tdo_error();\n\
    \t}\n}\n\n```\nIn the corrected example, only a result of `X509_V_OK` is accepted.\n\
    \n\n```cpp\n// ...\n\nif (cert = SSL_get_peer_certificate(ssl))\n{\n\tresult =\
    \ SSL_get_verify_result(ssl);\n\n\tif (result == X509_V_OK) // GOOD\n\t{\n\t\t\
    do_ok();\n\t} else {\n\t\tdo_error();\n\t}\n}\n\n```\n\n## References\n* Common\
    \ Weakness Enumeration: [CWE-295](https://cwe.mitre.org/data/definitions/295.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-295/SSLResultNotChecked.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-295/SSLResultNotChecked.bqrs
  metadata:
    name: Certificate not checked
    description: Always check the result of certificate verification after fetching
      an SSL certificate.
    kind: problem
    problem.severity: error
    security-severity: 7.5
    precision: medium
    id: cpp/certificate-not-checked
    tags: |-
      security
             external/cwe/cwe-295
  queryHelp: "# Certificate not checked\nAfter fetching an SSL certificate, always\
    \ check the result of certificate verification.\n\n\n## Recommendation\nAlways\
    \ check the result of SSL certificate verification. A certificate that has been\
    \ revoked may indicate that data is coming from an attacker, whereas a certificate\
    \ that has expired or was self-signed may indicate an increased likelihood that\
    \ the data is malicious.\n\n\n## Example\nIn this example, the `SSL_get_peer_certificate`\
    \ function is used to get the certificate of a peer. However it is unsafe to use\
    \ that information without checking if the certificate is valid.\n\n\n```cpp\n\
    // ...\n\nX509 *cert = SSL_get_peer_certificate(ssl); // BAD (SSL_get_verify_result\
    \ is never called)\n\n// ...\n```\nIn the corrected example, we use `SSL_get_verify_result`\
    \ to check that certificate verification was successful.\n\n\n```cpp\n// ...\n\
    \nX509 *cert = SSL_get_peer_certificate(ssl); // GOOD\nif (cert)\n{\n\tresult\
    \ = SSL_get_verify_result(ssl);\n\tif (result == X509_V_OK)\n\t{\n\t\t// ...\n\
    ```\n\n## References\n* Common Weakness Enumeration: [CWE-295](https://cwe.mitre.org/data/definitions/295.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-311/CleartextBufferWrite.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-311/CleartextBufferWrite.bqrs
  metadata:
    name: Cleartext storage of sensitive information in buffer
    description: |-
      Storing sensitive information in cleartext can expose it
                    to an attacker.
    kind: path-problem
    problem.severity: warning
    security-severity: 7.5
    precision: medium
    id: cpp/cleartext-storage-buffer
    tags: |-
      security
             external/cwe/cwe-312
  queryHelp: |
    # Cleartext storage of sensitive information in buffer
    Sensitive information that is stored unencrypted is accessible to an attacker who gains access to the storage.


    ## Recommendation
    Ensure that sensitive information is always encrypted before being stored to a file or transmitted over the network. It may be wise to encrypt information before it is put into a buffer that may be readable in memory.

    In general, decrypt sensitive information only at the point where it is necessary for it to be used in cleartext.


    ## Example
    The following example shows two ways of storing user credentials in a file. In the 'BAD' case, the credentials are simply stored in cleartext. In the 'GOOD' case, the credentials are encrypted before storing them.


    ```c
    #include <sodium.h>
    #include <stdio.h>
    #include <string.h>

    void writeCredentialsBad(FILE *file, const char *cleartextCredentials) {
      // BAD: write password to disk in cleartext
      fputs(cleartextCredentials, file);
    }

    int writeCredentialsGood(FILE *file, const char *cleartextCredentials, const unsigned char *key, const unsigned char *nonce) {
      size_t credentialsLen = strlen(cleartextCredentials);
      size_t ciphertext_len = crypto_secretbox_MACBYTES + credentialsLen;
      unsigned char *ciphertext = malloc(ciphertext_len);
      if (!ciphertext) {
        logError();
        return -1;
      }

      // encrypt the password first
      if (crypto_secretbox_easy(ciphertext, (const unsigned char *)cleartextCredentials, credentialsLen, nonce, key) != 0) {
        free(ciphertext);
        logError();
        return -1;
      }

      // GOOD: write encrypted password to disk
      fwrite(ciphertext, 1, ciphertext_len, file);

      free(ciphertext);
      return 0;
    }

    ```
    Note that for the 'GOOD' example to work we need to link against an encryption library (in this case libsodium), initialize it with a call to `sodium_init`, and create the key and nonce with `crypto_secretbox_keygen` and `randombytes_buf` respectively. We also need to store those details securely so they can be used for decryption.


    ## References
    * M. Dowd, J. McDonald and J. Schuhm, *The Art of Software Security Assessment*, 1st Edition, Chapter 2 - 'Common Vulnerabilities of Encryption', p. 43. Addison Wesley, 2006.
    * M. Howard and D. LeBlanc, *Writing Secure Code*, 2nd Edition, Chapter 9 - 'Protecting Secret Data', p. 299. Microsoft, 2002.
    * Common Weakness Enumeration: [CWE-312](https://cwe.mitre.org/data/definitions/312.html).
 -
