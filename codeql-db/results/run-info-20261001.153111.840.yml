  relativeQueryPath: Best Practices/Likely Errors/OffsetUseBeforeRangeCheck.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Likely Errors/OffsetUseBeforeRangeCheck.bqrs
  metadata:
    name: Array offset used before range check
    description: |-
      Accessing an array offset before checking the range means that
                    the program may attempt to read beyond the end of a buffer
    kind: problem
    id: cpp/offset-use-before-range-check
    problem.severity: warning
    security-severity: 8.2
    precision: medium
    tags: |-
      reliability
             security
             external/cwe/cwe-120
             external/cwe/cwe-125
  queryHelp: "# Array offset used before range check\nThe program contains an and-expression\
    \ where the array access is defined before the range check. Consequently the array\
    \ is accessed without any bounds checking. The range check does not protect the\
    \ program from segmentation faults caused by attempts to read beyond the end of\
    \ a buffer.\n\n\n## Recommendation\nUpdate the and-expression so that the range\
    \ check precedes the array offset. This will ensure that the bounds are checked\
    \ before the array is accessed.\n\n\n## Example\nThe `find` function can read\
    \ past the end of the buffer pointed to by `str` if `start` is longer than or\
    \ equal to the length of the buffer (or longer than `len`, depending on the contents\
    \ of the buffer).\n\n\n```c\nint find(int start, char *str, char goal)\n{\n  \
    \  int len = strlen(str);\n    //Potential buffer overflow\n    for (int i = start;\
    \ str[i] != 0 && i < len; i++) { \n        if (str[i] == goal)\n            return\
    \ i; \n    }\n    return -1;\n}\n\nint findRangeCheck(int start, char *str, char\
    \ goal)\n{\n    int len = strlen(str);\n    //Range check protects against buffer\
    \ overflow\n    for (int i = start; i < len && str[i] != 0 ; i++) {\n        if\
    \ (str[i] == goal)\n            return i; \n    }\n    return -1;\n}\n\n\n\n\n\
    ```\nUpdate the and-expression so that the range check precedes the array offset\
    \ (for example, the `findRangeCheck` function).\n\n\n## References\n* cplusplus.com:\
    \ [ C++: array](http://www.cplusplus.com/reference/array/array/).\n* Wikipedia:\
    \ [ Bounds checking](https://en.wikipedia.org/wiki/Bounds_checking).\n* Common\
    \ Weakness Enumeration: [CWE-120](https://cwe.mitre.org/data/definitions/120.html).\n\
    * Common Weakness Enumeration: [CWE-125](https://cwe.mitre.org/data/definitions/125.html).\n"
 -
