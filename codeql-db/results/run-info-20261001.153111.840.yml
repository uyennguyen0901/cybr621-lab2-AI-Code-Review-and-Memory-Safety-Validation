  queryHelp: "# Unbounded write\nThe program performs a buffer copy or write operation\
    \ with no upper limit on the size of the copy. An unexpectedly long input that\
    \ reaches this code will cause the buffer to overflow. In addition to causing\
    \ program instability, techniques exist which may allow an attacker to use this\
    \ vulnerability to execute arbitrary code.\n\n\n## Recommendation\nAlways control\
    \ the length of buffer copy and buffer write operations. `strncpy` should be used\
    \ over `strcpy`, `snprintf` over `sprintf`, and in other cases 'n-variant' functions\
    \ should be preferred.\n\n\n## Example\n\n```c\nvoid congratulateUser(const char\
    \ *userName)\n{\n\tchar buffer[80];\n\n\t// BAD: this could overflow the buffer\
    \ if the UserName is long\n\tsprintf(buffer, \"Congratulations, %s!\", userName);\n\
    \n\tMessageBox(hWnd, buffer, \"New Message\", MB_OK);\n}\n```\nIn this example,\
    \ the call to `sprintf` may overflow `buffer`. This occurs if the argument `userName`\
    \ is very long, such that the resulting string is more than the 80 characters\
    \ allowed.\n\nTo fix the problem the call to `sprintf` should be replaced with\
    \ `snprintf`, specifying a maximum length of 80 characters.\n\n\n## References\n\
    * CERT C Coding Standard: [STR31-C. Guarantee that storage for strings has sufficient\
    \ space for character data and the null terminator](https://www.securecoding.cert.org/confluence/display/c/STR31-C.+Guarantee+that+storage+for+strings+has+sufficient+space+for+character+data+and+the+null+terminator).\n\
    * CERT C++ Coding Standard: [STR50-CPP. Guarantee that storage for strings has\
    \ sufficient space for character data and the null terminator](https://www.securecoding.cert.org/confluence/display/cplusplus/STR50-CPP.+Guarantee+that+storage+for+strings+has+sufficient+space+for+character+data+and+the+null+terminator).\n\
    * Common Weakness Enumeration: [CWE-120](https://cwe.mitre.org/data/definitions/120.html).\n\
    * Common Weakness Enumeration: [CWE-787](https://cwe.mitre.org/data/definitions/787.html).\n\
    * Common Weakness Enumeration: [CWE-805](https://cwe.mitre.org/data/definitions/805.html).\n"
