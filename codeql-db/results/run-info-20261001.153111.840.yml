  queryHelp: "# Year field changed using an arithmetic operation without checking\
    \ for leap year\nThe leap year rule for the Gregorian calendar, which has become\
    \ the internationally accepted civil calendar, is: every year that is exactly\
    \ divisible by four is a leap year, except for years that are exactly divisible\
    \ by 100, but these centurial years are leap years if they are exactly divisible\
    \ by 400.\n\nA leap year bug occurs when software (in any language) is written\
    \ without consideration of leap year logic, or with flawed logic to calculate\
    \ leap years; which typically results in incorrect results.\n\nThe impact of these\
    \ bugs may range from almost unnoticeable bugs such as an incorrect date, to severe\
    \ bugs that affect reliability, availability or even the security of the affected\
    \ system.\n\nWhen performing arithmetic operations on a variable that represents\
    \ a year, it is important to consider that the resulting value may not be a valid\
    \ date.\n\nThe typical example is doing simple year arithmetic (i.e. `date.year++`)\
    \ without considering if the resulting value will be a valid date or not.\n\n\n\
    ## Recommendation\nWhen modifying a year field on a date structure, verify if\
    \ the resulting year is a leap year.\n\n\n## Example\nIn this example, we are\
    \ adding 1 year to the current date. This may work most of the time, but on any\
    \ given February 29th, the resulting value will be invalid.\n\n\n```c\nSYSTEMTIME\
    \ st;\nFILETIME ft;\nGetSystemTime(&st);\n\n// Flawed logic may result in invalid\
    \ date\nst.wYear++;\n\n// The following code may fail\nSystemTimeToFileTime(&st,\
    \ &ft);\n```\nTo fix this bug, check the result for leap year.\n\n\n```c\nSYSTEMTIME\
    \ st;\nFILETIME ft;\nGetSystemTime(&st);\n\n// Flawed logic may result in invalid\
    \ date\nst.wYear++;\n\n// Check for leap year, and adjust the date accordingly\n\
    bool isLeapYear = st.wYear % 4 == 0 && (st.wYear % 100 != 0 || st.wYear % 400\
    \ == 0);\nst.wDay = st.wMonth == 2 && st.wDay == 29 && !isLeapYear ? 28 : st.wDay;\n\
    \nif (!SystemTimeToFileTime(&st, &ft))\n{\n\t// handle error\n}\n\n```\n\n## References\n\
    * NASA / Goddard Space Flight Center - [Calendars](https://eclipse.gsfc.nasa.gov/SEhelp/calendars.html)\n\
    * Wikipedia - [ Leap year bug](https://en.wikipedia.org/wiki/Leap_year_bug)\n\
    * Microsoft Azure blog - [ Is your code ready for the leap year?](https://azure.microsoft.com/en-us/blog/is-your-code-ready-for-the-leap-year/)\n"
 -
