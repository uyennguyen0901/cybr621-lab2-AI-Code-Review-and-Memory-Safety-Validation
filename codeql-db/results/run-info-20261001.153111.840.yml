  relativeQueryPath: Likely Bugs/InconsistentCallOnResult.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/InconsistentCallOnResult.bqrs
  metadata:
    name: Inconsistent operation on return value
    description: "A function is called, and the same operation is usually performed\
      \ on the return value - for example, free, delete, close etc. However, in some\
      \ cases it is not performed. These unusual cases may indicate misuse of the\
      \ API and could cause resource leaks."
    kind: problem
    problem.severity: warning
    precision: medium
    id: cpp/inconsistent-call-on-result
    tags: |-
      reliability
             correctness
             statistical
             non-attributable
             external/cwe/cwe-252
  queryHelp: |
    # Inconsistent operation on return value
    If the same operation (e.g. `free`, `delete`, `close`, etc.) is usually performed on the result of a method call, then any instances where it is not performed may indicate misuse of the API and could cause resource leaks or other issues.


    ## Recommendation
    Examine the code to determine if the return value is treated correctly in this particular case.


    ## References
    * Tutorialspoint - The C++ Programming Language: [C++ Dynamic Memory](http://www.tutorialspoint.com/cplusplus/cpp_dynamic_memory.htm)
    * Common Weakness Enumeration: [CWE-252](https://cwe.mitre.org/data/definitions/252.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/InconsistentCheckReturnNull.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/InconsistentCheckReturnNull.bqrs
  metadata:
    name: Inconsistent nullness check
    description: |-
      The result value of a function is often checked for nullness,
                    but not always. Since the value is mostly checked, it is likely
                    that the function can return null values in some cases, and
                    omitting the check could crash the program.
    kind: problem
    problem.severity: error
    precision: medium
    id: cpp/inconsistent-null-check
    tags: |-
      reliability
             correctness
             statistical
             non-attributable
             external/cwe/cwe-476
  queryHelp: |
    # Inconsistent nullness check
    A common source of defects is to forget to check if the result of a function call was NULL. This rules detects calls to a function where most other calls check the result for NULL but this particular call does not. This is inconsistent with the rest of the code and may be a defect or at least confusing for other developers.

    The flagged calls will not necessarily result in run-time errors, but all of them benefit from being audited. It is important not to mechanically add nullness checks at every flagged location, because an unnecessary nullness check is very confusing to other developers. A developer that is familiar with the code will most likely immediately know what the right action is on a null result, and if that is not the case there is most likely something confusing about the API of the called function.


    ## Recommendation
    Diagnose if the called function can actually return NULL with the context at this particular call. If that is the case the code should be updated to cater for that situation. If the call can not return null in this location, it may be good to add an assert to document that the code does not handle NULL. This documentation is important since most calls expect to receive a NULL value.


    ## Example

    ```cpp
    struct property {
      char *name;
      int value;
    };

    struct property * get_property(char *key);
    struct property * get_property_default(char *key, int default_value);

    void check_properties() {
      // this call will get flagged since most
      // calls to get_property handle NULL
      struct property *p1 = get_property("time");
      if(p1->value > 600) {
        ...
      }

      // this call will not get flagged since
      // the result of the call is checked for NULL
      struct property *p2 = get_property("time");
      if(p2 != NULL && p2->value > 600) {
        ...
      }

      // this call will not get flagged since calls
      // to get_property_default rarely handle NULL
      struct property *p3 = get_property_default("time", 50);
      if(p3->value > 60) {
        ...
      }
    }

    ```

    ## References
    * Tutorialspoint - The C++ Programming Language: [C++ Dynamic Memory](http://www.tutorialspoint.com/cplusplus/cpp_dynamic_memory.htm), [C++ NULL pointers](http://www.tutorialspoint.com/cplusplus/cpp_null_pointers.htm).
    * Code project: [Chained null checks and the Maybe monad](http://www.codeproject.com/Articles/109026/Chained-null-checks-and-the-Maybe-monad).
    * Common Weakness Enumeration: [CWE-476](https://cwe.mitre.org/data/definitions/476.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Leap Year/Adding365DaysPerYear.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Leap Year/Adding365DaysPerYear.bqrs
  metadata:
    name: Arithmetic operation assumes 365 days per year
    description: |-
      When an arithmetic operation modifies a date by a constant
                    value of 365, it may be a sign that leap years are not taken
                    into account.
    kind: problem
    problem.severity: warning
    id: cpp/leap-year/adding-365-days-per-year
    precision: medium
    tags: |-
      leap-year
             correctness
  queryHelp: |
    # Arithmetic operation assumes 365 days per year
    The leap year rule for the Gregorian calendar, which has become the internationally accepted civil calendar, is: every year that is exactly divisible by four is a leap year, except for years that are exactly divisible by 100, but these centurial years are leap years if they are exactly divisible by 400.

    A leap year bug occurs when software (in any language) is written without consideration of leap year logic, or with flawed logic to calculate leap years; which typically results in incorrect results.

    The impact of these bugs may range from almost unnoticeable bugs such as an incorrect date, to severe bugs that affect reliability, availability or even the security of the affected system.

    When performing arithmetic operations on a variable that represents a date, leap years must be taken into account. It is not safe to assume that a year is 365 days long.


    ## Recommendation
    Determine whether the time span in question contains a leap day, then perform the calculation using the correct number of days. Alternatively, use an established library routine that already contains correct leap year logic.


    ## References
    * NASA / Goddard Space Flight Center - [Calendars](https://eclipse.gsfc.nasa.gov/SEhelp/calendars.html)
    * Wikipedia - [ Leap year bug](https://en.wikipedia.org/wiki/Leap_year_bug)
    * Microsoft Azure blog - [ Is your code ready for the leap year?](https://azure.microsoft.com/en-us/blog/is-your-code-ready-for-the-leap-year/)
 -
