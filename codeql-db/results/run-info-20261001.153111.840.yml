  queryHelp: "# Potentially overrunning write\nThe program performs a buffer copy\
    \ or write operation with no upper limit on the size of the copy, and it appears\
    \ that certain inputs will cause a buffer overflow to occur in this case. In addition\
    \ to causing program instability, techniques exist which may allow an attacker\
    \ to use this vulnerability to execute arbitrary code.\n\n\n## Recommendation\n\
    Always control the length of buffer copy and buffer write operations. `strncpy`\
    \ should be used over `strcpy`, `snprintf` over `sprintf`, and in other cases\
    \ 'n-variant' functions should be preferred.\n\n\n## Example\n\n```c\nvoid sayHello(uint32_t\
    \ userId)\n{\n\tchar buffer[18];\n\n\t// BAD: this message overflows the buffer\
    \ if userId >= 10000\n\tsprintf(buffer, \"Hello, user %d!\", userId);\n\n\tMessageBox(hWnd,\
    \ buffer, \"New Message\", MB_OK);\n}\n```\nIn this example, the call to `sprintf`\
    \ writes a message of 14 characters (including the terminating null) plus the\
    \ length of the string conversion of \\`userId\\` into a buffer with space for\
    \ just 18 characters. As such, if \\`userId\\` is greater or equal to \\`10000\\\
    `, the last characters overflow the buffer resulting in undefined behavior.\n\n\
    To fix this issue these changes should be made:\n\n* Control the size of the buffer\
    \ by declaring it with a compile time constant.\n* Preferably, replace the call\
    \ to `sprintf` with `snprintf`, using the defined constant size of the buffer\
    \ or \\`sizeof(buffer)\\` as maximum length to write. This will prevent the buffer\
    \ overflow.\n* Optionally, if \\`userId\\` is expected to be less than \\`10000\\\
    `, then return or throw an error if \\`userId\\` is out of bounds.\n* Otherwise,\
    \ consider increasing the buffer size to at least 25 characters, so that the message\
    \ is displayed correctly regardless of the value of \\`userId\\`.\n\n## References\n\
    * CERT C Coding Standard: [STR31-C. Guarantee that storage for strings has sufficient\
    \ space for character data and the null terminator](https://www.securecoding.cert.org/confluence/display/c/STR31-C.+Guarantee+that+storage+for+strings+has+sufficient+space+for+character+data+and+the+null+terminator).\n\
    * CERT C++ Coding Standard: [STR50-CPP. Guarantee that storage for strings has\
    \ sufficient space for character data and the null terminator](https://www.securecoding.cert.org/confluence/display/cplusplus/STR50-CPP.+Guarantee+that+storage+for+strings+has+sufficient+space+for+character+data+and+the+null+terminator).\n\
    * Common Weakness Enumeration: [CWE-120](https://cwe.mitre.org/data/definitions/120.html).\n\
    * Common Weakness Enumeration: [CWE-787](https://cwe.mitre.org/data/definitions/787.html).\n\
    * Common Weakness Enumeration: [CWE-805](https://cwe.mitre.org/data/definitions/805.html).\n"
 -
