  metadata:
    name: Unterminated variadic call
    description: |-
      Calling a variadic function without a sentinel value
                    may result in a buffer overflow if the function expects
                    a specific value to terminate the argument list.
    kind: problem
    problem.severity: warning
    security-severity: 8.8
    precision: medium
    id: cpp/unterminated-variadic-call
    tags: |-
      reliability
             security
             external/cwe/cwe-121
  queryHelp: "# Unterminated variadic call\nThe program calls a function that expects\
    \ the variable argument list to be terminated with a sentinel value (typically\
    \ NULL, 0 or -1). In this case, the sentinel value has been omitted as a final\
    \ argument. This defect may result in incorrect behavior of the function and unintended\
    \ stack memory access, leading to incorrect program results, instability, and\
    \ even vulnerability to buffer overflow style attacks.\n\n\n## Recommendation\n\
    Each description of a defect highlighted by this rule includes a suggested value\
    \ for the terminator. Check that this value is correct, then add it to the end\
    \ of the call.\n\n\n## Example\n\n```cpp\n#include <stdarg.h>\n\nvoid pushStrings(char\
    \ *firstString, ...)\n{\n\tva_list args;\n\tchar *arg;\n\n\tva_start(args, firstString);\n\
    \n\t// process inputs, beginning with firstString, ending when NULL is reached\n\
    \targ = firstString;\n\twhile (arg != NULL)\n\t{\n\t\t// push the string\n\t\t\
    pushString(arg);\n\t\n\t\t// move on to the next input\n\t\targ = va_arg(args,\
    \ char *);\n\t}\n\n\tva_end(args);\n}\n\nvoid badFunction()\n{\n\tpushStrings(\"\
    hello\", \"world\", NULL); // OK\n\t\n\tpushStrings(\"apple\", \"pear\", \"banana\"\
    , NULL); // OK\n\n\tpushStrings(\"car\", \"bus\", \"train\"); // BAD, not terminated\
    \ with the expected NULL\n}\n```\nIn this example, the third call to `pushStrings`\
    \ is not correctly terminated. This call should be updated to include `NULL` as\
    \ the fourth and final argument to this call.\n\n\n## References\n* Common Weakness\
    \ Enumeration: [CWE-121](https://cwe.mitre.org/data/definitions/121.html).\n"
 -
