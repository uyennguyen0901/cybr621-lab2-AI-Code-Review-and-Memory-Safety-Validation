    description: "Global variables should have descriptive names, to help document\
      \ their use, avoid namespace pollution and reduce the risk of shadowing with\
      \ local variables."
    kind: problem
    problem.severity: recommendation
    precision: very-high
    id: cpp/short-global-name
    tags: maintainability
  queryHelp: |
    # Short global name
    This rule finds global variables which have a name of length three characters or less. It is particularly important to use descriptive names for global variables. Use of a clear naming convention for global variables helps document their use, avoids pollution of the namespace and reduces the risk of shadowing with local variables.


    ## Recommendation
    Review the purpose of the each global variable flagged by this rule and update each name to reflect the purpose of the variable.


    ## References
    * Mats Henricson and Erik Nyquist, *Industrial Strength C++*, published by Prentice Hall PTR (1997). Chapter 1: Naming, Rec 1.1 ([PDF](https://web.archive.org/web/20190919025638/https://mongers.org/industrial-c++/)).
    * [Global variables](http://www.learncpp.com/cpp-tutorial/42-global-variables/).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/SwitchLongCase.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/SwitchLongCase.bqrs
  metadata:
    name: Long switch case
    description: A switch statement with too much code in its cases can make the control
      flow hard to follow. Consider wrapping the code for each case in a function
      and just using the switch statement to invoke the appropriate function in each
      case.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/long-switch
    tags: |-
      maintainability
             readability
  queryHelp: "# Long switch case\nThis rule finds switch statements that have too\
    \ much code in their cases. Long case statements often lead to large amounts of\
    \ nesting, adding to the difficulty of understanding what the code actually does.\
    \ Consider wrapping the code for each case in a function and just using the switch\
    \ statement to invoke the appropriate function in each case.\n\nThe indicated\
    \ switch statement has a case that is more than 30 lines long.\n\n\n## Recommendation\n\
    Consider creating a separate function for the code in the long case statement.\n\
    \n\n## Example\n\n```cpp\n//This switch statement has long case statements, and\
    \ can become difficult to\n//read as the processing for each message type becomes\
    \ more complex\nswitch (message_type) {\n\tcase CONNECT:\n\t\t_state = CONNECTING;\n\
    \t\tint message_id = message_get_id(message);\n\t\tint source = connect_get_source(message);\n\
    \t\t//More code here...\n\t\tsend(connect_response);\n\t\tbreak;\n\tcase DISCONNECT:\n\
    \t\t_state = DISCONNECTING;\n\t\tint message_id = message_get_id(message);\n\t\
    \tint source = disconnect_get_source(message);\n\t\t//More code here...\n\t\t\
    send(disconnect_response);\n\t\tbreak;\n\tdefault:\n\t\tlog(\"Invalid message,\
    \ id : %d\", message_get_id(message));\n}\n\n//This is better, as each case is\
    \ split out to a separate function\nswitch (packet_type) {\n\tcase STREAM:\n\t\
    \tprocess_stream_packet(packet);\n\t\tbreak;\n\tcase DATAGRAM:\n\t\tprocess_datagram_packet(packet);\n\
    \t\tbreak;\n\tdefault:\n\t\tlog(\"Invalid packet type: %d\", packet_type);\n}\n\
    ```\n\n## References\n* [Switch statements](http://www.learncpp.com/cpp-tutorial/53-switch-statements/)\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/Unused Entities/UnusedLocals.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Unused Entities/UnusedLocals.bqrs
  metadata:
    name: Unused local variable
    description: |-
      A local variable that is never called or accessed may be an
                    indication that the code is incomplete or has a typo.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/unused-local-variable
    tags: |-
      maintainability
             useless-code
             external/cwe/cwe-563
  queryHelp: "# Unused local variable\nThis rule finds local variables that are never\
    \ accessed after declaration. Unused variables should be removed to increase readability\
    \ and avoid misuse.\n\n\n## Recommendation\nRemoving these unused local variables\
    \ will make code more readable.\n\n\n## Example\n\n```cpp\n{\n\tint x = 0; //x\
    \ is unused\n\tint y = 0;\n\tcout << y;\n}\n\n```\n\n## References\n* [Variable\
    \ scope](http://www.tutorialspoint.com/cplusplus/cpp_variable_scope.htm)\n* [MSC12-C.\
    \ Detect and remove code that has no effect](https://wiki.sei.cmu.edu/confluence/display/c/MSC12-C.+Detect+and+remove+code+that+has+no+effect+or+is+never+executed)\n\
    * Common Weakness Enumeration: [CWE-563](https://cwe.mitre.org/data/definitions/563.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/Unused Entities/UnusedStaticFunctions.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Unused Entities/UnusedStaticFunctions.bqrs
  metadata:
    name: Unused static function
    description: |-
      A static function that is never called or accessed may be an
                    indication that the code is incomplete or has a typo.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/unused-static-function
    tags: |-
      efficiency
             useless-code
             external/cwe/cwe-561
  queryHelp: "# Unused static function\nThis rule finds static functions with definitions\
    \ that are never called or accessed. These unused functions should be removed\
    \ to increase code readability, reduce object size and avoid misuse.\n\n\n## Recommendation\n\
    Removing these unused static functions will make code more readable. A common\
    \ pitfall is that code using a static function is guarded by conditional compilation\
    \ but the static function is not. Notice that this detects directly unused functions\
    \ and removing a static function may expose more unused functions.\n\n\n## Example\n\
    \n```cpp\n//start of file\nstatic void f() { //static function f() is unused in\
    \ the file\n    //...\n}\nstatic void g() {\n    //...\n}\nvoid public_func()\
    \ { //non-static function public_func is not called in file, \n              \
    \       //but could be visible in other files\n    //...\n    g(); //call to g()\n\
    \    //...\n}\n//end of file\n\n```\n\n## References\n* [MSC12-C. Detect and remove\
    \ code that has no effect](https://wiki.sei.cmu.edu/confluence/display/c/MSC12-C.+Detect+and+remove+code+that+has+no+effect+or+is+never+executed)\n\
    * Common Weakness Enumeration: [CWE-561](https://cwe.mitre.org/data/definitions/561.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/Unused Entities/UnusedStaticVariables.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Unused Entities/UnusedStaticVariables.bqrs
  metadata:
    name: Unused static variable
    description: |-
      A static variable that is never accessed may be an indication
                    that the code is incomplete or has a typo.
    kind: problem
    problem.severity: recommendation
    precision: high
    id: cpp/unused-static-variable
    tags: |-
      efficiency
             useless-code
             external/cwe/cwe-563
  queryHelp: "# Unused static variable\nThis rule finds static variables that are\
    \ never accessed. These static variables should be removed, to increase code comprehensibility,\
    \ reduce memory usage and avoid misuse. Unused static `const` variables could\
    \ also be an indication of a defect caused by an unhandled case.\n\n\n## Recommendation\n\
    Check that the unused static variable does not indicate a defect, for example,\
    \ an unhandled case. If the static variable is genuinely not needed, then removing\
    \ it will make code more readable. If the static variable is needed then you should\
    \ update the code to fix the defect.\n\n\n## Example\n\n```cpp\nvoid f() {\n\t\
    static int i = 0; //i is unused\n\t...\n\treturn;\n}\n\n```\n\n## References\n\
    * [Variable scope](http://www.tutorialspoint.com/cplusplus/cpp_variable_scope.htm)\n\
    * [Detect and remove code that has no effect](https://www.securecoding.cert.org/confluence/display/c/MSC12-C.+Detect+and+remove+code+that+has+no+effect+or+is+never+executed)\n\
    * [Minimize the scope of variables and functions](https://wiki.sei.cmu.edu/confluence/display/c/DCL19-C.+Minimize+the+scope+of+variables+and+functions)\n\
    * Common Weakness Enumeration: [CWE-563](https://cwe.mitre.org/data/definitions/563.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Best Practices/UseOfGoto.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/UseOfGoto.bqrs
  metadata:
    name: Use of goto
    description: |-
      The goto statement can make the control flow of a function hard
                    to understand, when used for purposes other than error handling.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/use-of-goto
    tags: |-
      maintainability
             readability
             language-features
  queryHelp: |
    # Use of goto
    Use of `goto` statements makes code more difficult to understand and maintain. Consequently, the use of `goto` statements is deprecated except as a mechanism for breaking out of multiple nested loops, or jumping to error-handling code at the end of a function. This rule identifies complex (and therefore hard to understand) uses of `goto` statements. Function bodies that include multiple `goto` statements that jump forward and multiple `goto` statements that jump backwards are highlighted.


    ## Recommendation
    In most cases the code can be rewritten and/or rearranged by:

    * using structured control flow constructs, such as `if`, `while`, and `for`;
    * using `break` or `continue` to stop a loop iteration early; or
    * using `return` to exit a function early
    The `goto` statement may be the best solution for breaking out of deeply nested loops, or for jumping to error handling code, without adversely affecting the readability of the function. Such uses will not be flagged by this rule.


    ## References
    * *Joint Strike Fighter Air Vehicle C++ Coding Standards*, AV Rule 189. Lockheed Martin Corporation, 2005.
    * E. W. Dijkstra Archive: [A Case against the GO TO Statement (EWD-215)](http://www.cs.utexas.edu/users/EWD/transcriptions/EWD02xx/EWD215.html).
    * MSDN Library: [goto Statement (C++)](https://docs.microsoft.com/en-us/cpp/cpp/goto-statement-cpp).
    * Mats Henricson and Erik Nyquist, *Industrial Strength C++*, Rule 4.6. Prentice Hall PTR, 1997. ([PDF](https://web.archive.org/web/20190919025638/https://mongers.org/industrial-c++/)).
    * cplusplus.com: [Control Structures](http://www.cplusplus.com/doc/tutorial/control/).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/DeadCodeGoto.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/DeadCodeGoto.bqrs
  metadata:
    name: Dead code due to goto or break statement
    description: A goto or break statement is followed by unreachable code.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/dead-code-goto
    tags: |-
      maintainability
             external/cwe/cwe-561
  queryHelp: |
    # Dead code due to goto or break statement
    Code immediately following a `goto` or `break` statement will not be executed, unless there is a label or switch case. When the code is necessary, this leads to logical errors or resource leaks. If the code is unnecessary, it may confuse readers.


    ## Recommendation
    If the unreachable code is necessary, move the `goto` or `break` statement to after the code. Otherwise, delete the unreachable code.


    ## Example

    ```cpp
    goto err1;
    free(pointer); // BAD: this line is unreachable
    err1: return -1;

    free(pointer); // GOOD: this line is reachable
    goto err2;
    err2: return -1;

    ```

    ## References
    * The CERT C Secure Coding Standard: [MSC12-C. Detect and remove code that has no effect or is never executed](https://wiki.sei.cmu.edu/confluence/display/c/MSC12-C.+Detect+and+remove+code+that+has+no+effect+or+is+never+executed).
    * Common Weakness Enumeration: [CWE-561](https://cwe.mitre.org/data/definitions/561.html).
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/DoubleFree.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/DoubleFree.bqrs
  metadata:
    name: Potential double free
    description: Freeing a resource more than once can lead to undefined behavior
      and cause memory corruption.
    kind: path-problem
    precision: high
    id: cpp/double-free
    problem.severity: warning
    security-severity: 9.3
    tags: |-
      reliability
             security
             external/cwe/cwe-415
  queryHelp: "# Potential double free\nDeallocating memory more than once can lead\
    \ to a double-free vulnerability. This can be exploited to corrupt the allocator's\
    \ internal data structures, which can lead to denial-of-service attacks by crashing\
    \ the program, or security vulnerabilities, by allowing an attacker to overwrite\
    \ arbitrary memory locations.\n\n\n## Recommendation\nEnsure that all execution\
    \ paths deallocate the allocated memory at most once. In complex cases it may\
    \ help to reassign a pointer to a null value after deallocating it. This will\
    \ prevent double-free vulnerabilities since most deallocation functions will perform\
    \ a null-pointer check before attempting to deallocate memory.\n\n\n## Example\n\
    In the following example, `buff` is allocated and then freed twice:\n\n\n```cpp\n\
    int* f() {\n\tint *buff = malloc(SIZE*sizeof(int));\n\tdo_stuff(buff);\n\tfree(buff);\n\
    \tint *new_buffer = malloc(SIZE*sizeof(int));\n\tfree(buff); // BAD: If new_buffer\
    \ is assigned the same address as buff,\n              // the memory allocator\
    \ will free the new buffer memory region,\n              // leading to use-after-free\
    \ problems and memory corruption.\n\treturn new_buffer;\n}\n\n```\nReviewing the\
    \ code above, the issue can be fixed by simply deleting the additional call to\
    \ `free(buff)`.\n\n\n```cpp\nint* f() {\n\tint *buff = malloc(SIZE*sizeof(int));\n\
    \tdo_stuff(buff);\n\tfree(buff); // GOOD: buff is only freed once.\n\tint *new_buffer\
    \ = malloc(SIZE*sizeof(int));\n\treturn new_buffer;\n}\n\n```\nIn the next example,\
    \ `task` may be deleted twice, if an exception occurs inside the `try` block after\
    \ the first `delete`:\n\n\n```cpp\nvoid g() {\n\tMyTask *task = nullptr;\n\n\t\
    try\n\t{\n\t\ttask = new MyTask;\n\n\t\t...\n\n\t\tdelete task;\n\n\t\t...\n\t\
    } catch (...) {\n\t\tdelete task; // BAD: potential double-free\n\t}\n}\n\n```\n\
    The problem can be solved by assigning a null value to the pointer after the first\
    \ `delete`, as calling `delete` a second time on the null pointer is harmless.\n\
    \n\n```cpp\nvoid g() {\n\tMyTask *task = nullptr;\n\n\ttry\n\t{\n\t\ttask = new\
    \ MyTask;\n\n\t\t...\n\n\t\tdelete task;\n\t\ttask = nullptr;\n\n\t\t...\n\t}\
    \ catch (...) {\n\t\tdelete task; // GOOD: harmless if task is NULL\n\t}\n}\n\n\
    ```\n\n## References\n* OWASP: [Doubly freeing memory](https://owasp.org/www-community/vulnerabilities/Doubly_freeing_memory).\n\
    * Common Weakness Enumeration: [CWE-415](https://cwe.mitre.org/data/definitions/415.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/IncorrectCheckScanf.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/IncorrectCheckScanf.bqrs
  metadata:
    name: Incorrect return-value check for a 'scanf'-like function
    description: |-
      Failing to account for EOF in a call to a scanf-like function can lead to
                   undefined behavior.
    kind: problem
    problem.severity: warning
    security-severity: 7.5
    precision: high
    id: cpp/incorrectly-checked-scanf
    tags: |-
      security
             correctness
             external/cwe/cwe-253
  queryHelp: "# Incorrect return-value check for a 'scanf'-like function\nThis query\
    \ finds calls of `scanf`-like functions with improper return-value checking. Specifically,\
    \ it flags uses of `scanf` where the return value is only checked against zero.\n\
    \nFunctions in the `scanf` family return either `EOF` (a negative value) in case\
    \ of IO failure, or the number of items successfully read from the input. Consequently,\
    \ a simple check that the return value is nonzero is not enough.\n\n\n## Recommendation\n\
    Ensure that all uses of `scanf` check the return value against the expected number\
    \ of arguments rather than just against zero.\n\n\n## Example\nThe following examples\
    \ show different ways of guarding a `scanf` output. In the BAD examples, the results\
    \ are only checked against zero. In the GOOD examples, the results are checked\
    \ against the expected number of matches instead.\n\n\n```cpp\n{\n  int i, j;\n\
    \n  // BAD: The result is only checked against zero\n  if (scanf(\"%d %d\", &i,\
    \ &j)) { \n      use(i);\n      use(j);\n  }\n\n  // BAD: The result is only checked\
    \ against zero\n  if (scanf(\"%d %d\", &i, &j) == 0) { \n    i = 0;\n    j = 0;\n\
    \  }\n  use(i);\n  use(j);\n\n  if (scanf(\"%d %d\", &i, &j) == 2) { \n      //\
    \ GOOD: the result is checked against 2\n  }\n\n  // GOOD: the result is compared\
    \ directly\n  int r = scanf(\"%d %d\", &i, &j);\n  if (r < 2) {\n    return;\n\
    \  }\n  if (r == 1) { \n    j = 0;\n  }\n}\n\n```\n\n## References\n* SEI CERT\
    \ C++ Coding Standard: [ERR62-CPP. Detect errors when converting a string to a\
    \ number](https://wiki.sei.cmu.edu/confluence/display/cplusplus/ERR62-CPP.+Detect+errors+when+converting+a+string+to+a+number).\n\
    * SEI CERT C Coding Standard: [ERR33-C. Detect and handle standard library errors](https://wiki.sei.cmu.edu/confluence/display/c/ERR33-C.+Detect+and+handle+standard+library+errors).\n\
    * cppreference.com: [scanf, fscanf, sscanf, scanf_s, fscanf_s, sscanf_s](https://en.cppreference.com/w/c/io/fscanf).\n\
    * Common Weakness Enumeration: [CWE-253](https://cwe.mitre.org/data/definitions/253.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/LargeParameter.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/LargeParameter.bqrs
  metadata:
    name: Large object passed by value
    description: "An object larger than 64 bytes is passed by value to a function.\
      \ Passing large objects by value unnecessarily use up scarce stack space, increase\
      \ the cost of calling a function and can be a security risk. Use a const pointer\
      \ to the object instead."
    kind: problem
    problem.severity: recommendation
    precision: very-high
    id: cpp/large-parameter
    tags: |-
      efficiency
             readability
             statistical
             non-attributable
  queryHelp: |
    # Large object passed by value
    This rule finds parameters greater than (for example) 64 bytes in size that are passed by value to function calls. It is not good practice to put large objects on the stack, as widespread use of this anti-pattern throughout a software project can easily lead to stack overflows. Performance-wise, the initial copy to the stack is more likely than not to be more expensive than any cost due to indirection caused accessing the object through a pointer. In terms of security, an overrun on an array in an object copied to the stack is a much greater risk than one that happens on the heap.

    In C++, there is the added cost of calling the constructor and destructor of the object being passed as well as those of any other objects that it (recursively) contains.


    ## Recommendation
    Pass the address of the object instead. There is usually no good reason for putting anything large on the stack.


    ## Example

    ```cpp
    typedef struct Names {
        char first[100];
        char last[100];
    } Names;

    int doFoo(Names n) { //wrong: n is passed by value (meaning the entire structure
                         //is copied onto the stack, instead of just a pointer)
        ...
    }

    int doBar(const Names &n) { //better, only a reference is passed
        ...
    }

    ```

    ## References
    * S. Meyers. *Effective C++ 3d ed.* pp 86-90. Addison-Wesley Professional, 2005.
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Critical/MissingCheckScanf.ql
  relativeBqrsPath: codeql/cpp-queries/Critical/MissingCheckScanf.bqrs
  metadata:
    name: Missing return-value check for a 'scanf'-like function
    description: |-
      Failing to check that a call to 'scanf' actually writes to an
                    output variable can lead to unexpected behavior at reading time.
    kind: path-problem
    problem.severity: warning
    security-severity: 7.5
    precision: medium
    id: cpp/missing-check-scanf
    tags: |-
      security
             correctness
             external/cwe/cwe-252
             external/cwe/cwe-253
  queryHelp: |
    # Missing return-value check for a 'scanf'-like function
    This query finds calls of `scanf`-like functions with missing or improper return-value checking.

    Specifically, the query flags uses of variables that may have been modified by `scanf` and subsequently are used without being guarded by a correct return-value check. A proper check is one that ensures that the corresponding `scanf` has returned (at least) a certain minimum constant.

    Functions in the `scanf` family return either EOF (a negative value) in case of IO failure, or the number of items successfully read from the input. Consequently, a simple check that the return value is truthy (nonzero) is not enough.

    > WARNING: This query has medium precision because, in the current implementation, it takes a strict stance on unguarded uses of output variables, and flags them as problematic even if they have already been initialized.

    ## Recommendation
    Ensure that all subsequent uses of `scanf` output arguments occur in a branch of an `if` statement (or similar), in which it is known that the corresponding `scanf` call has in fact read all possible items from its input. This can be done by comparing the return value to a numerical constant.


    ## Example
    This example shows different ways of guarding a `scanf` output:


    ```cpp
    {
      int i, j, r;

      r = scanf("%d %d", &i, &j);

      use(i); // BAD: i is not guarded

      if (r >= 1) {
        use(i); // GOOD: i is guarded correctly
        use(j); // BAD: j is guarded incorrectly
      }

      if (r != 2)
        return;

      use(j); // GOOD: j is guarded correctly
    }

    ```

    ## References
    * SEI CERT C++ Coding Standard: [ERR62-CPP. Detect errors when converting a string to a number](https://wiki.sei.cmu.edu/confluence/display/cplusplus/ERR62-CPP.+Detect+errors+when+converting+a+string+to+a+number).
    * SEI CERT C Coding Standard: [ERR33-C. Detect and handle standard library errors](https://wiki.sei.cmu.edu/confluence/display/c/ERR33-C.+Detect+and+handle+standard+library+errors).
    * cppreference.com: [scanf, fscanf, sscanf, scanf_s, fscanf_s, sscanf_s](https://en.cppreference.com/w/c/io/fscanf).
    * Common Weakness Enumeration: [CWE-252](https://cwe.mitre.org/data/definitions/252.html).
    * Common Weakness Enumeration: [CWE-253](https://cwe.mitre.org/data/definitions/253.html).
