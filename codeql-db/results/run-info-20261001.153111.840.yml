  relativeQueryPath: Security/CWE/CWE-022/TaintedPath.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-022/TaintedPath.bqrs
  metadata:
    name: Uncontrolled data used in path expression
    description: |-
      Accessing paths influenced by users can allow an
                    attacker to access unexpected resources.
    kind: path-problem
    problem.severity: warning
    security-severity: 7.5
    precision: medium
    id: cpp/path-injection
    tags: |-
      security
             external/cwe/cwe-022
             external/cwe/cwe-023
             external/cwe/cwe-036
             external/cwe/cwe-073
  queryHelp: "# Uncontrolled data used in path expression\nAccessing paths controlled\
    \ by users can allow an attacker to access unexpected resources. This can result\
    \ in sensitive information being revealed or deleted, or an attacker being able\
    \ to influence behavior by modifying unexpected files.\n\nPaths that are naively\
    \ constructed from data controlled by a user may be absolute paths, or may contain\
    \ unexpected special characters such as \"..\". Such a path could point anywhere\
    \ on the file system.\n\n\n## Recommendation\nValidate user input before using\
    \ it to construct a file path.\n\nCommon validation methods include checking that\
    \ the normalized path is relative and does not contain any \"..\" components,\
    \ or checking that the path is contained within a safe folder. The method you\
    \ should use depends on how the path is used in the application, and whether the\
    \ path should be a single path component.\n\nIf the path should be a single path\
    \ component (such as a file name), you can check for the existence of any path\
    \ separators (\"/\" or \"\\\\\"), or \"..\" sequences in the input, and reject\
    \ the input if any are found.\n\nNote that removing \"../\" sequences is *not*\
    \ sufficient, since the input could still contain a path separator followed by\
    \ \"..\". For example, the input \".../...//\" would still result in the string\
    \ \"../\" if only \"../\" sequences are removed.\n\nFinally, the simplest (but\
    \ most restrictive) option is to use an allow list of safe patterns and make sure\
    \ that the user input matches one of these patterns.\n\n\n## Example\nIn this\
    \ example, a file name is read from a user and then used to access a file. However,\
    \ a malicious user could enter a file name anywhere on the file system, such as\
    \ \"/etc/passwd\" or \"../../../etc/passwd\".\n\n\n```c\nint main(int argc, char**\
    \ argv) {\n  char *userAndFile = argv[2];\n  \n  {\n    char fileBuffer[PATH_MAX];\n\
    \    snprintf(fileBuffer, sizeof(fileBuffer), \"/home/%s\", userAndFile);\n  \
    \  // BAD: a string from the user is used in a filename\n    fopen(fileBuffer,\
    \ \"wb+\");\n  }\n}\n\n```\nIf the input should only be a file name, you can check\
    \ that it doesn't contain any path separators or \"..\" sequences.\n\n\n```c\n\
    #include <stdio.h>\n#include <string.h>\n\nint main(int argc, char** argv) {\n\
    \    char *fileName = argv[2];\n    // Check for invalid sequences in the user\
    \ input\n    if (strstr(fileName , \"..\") || strchr(fileName , '/') || strchr(fileName\
    \ , '\\\\')) {\n        printf(\"Invalid filename.\\n\");\n        return 1;\n\
    \    }\n\n    char fileBuffer[PATH_MAX];\n    snprintf(fileBuffer, sizeof(fileBuffer),\
    \ \"/home/user/files/%s\", fileName);\n    // GOOD: We know that the filename\
    \ is safe and stays within the public folder\n    FILE *file = fopen(fileBuffer,\
    \ \"wb+\");\n}\n```\nIf the input should be within a specific directory, you can\
    \ check that the resolved path is still contained within that directory.\n\n\n\
    ```c\n#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char** argv)\
    \ {\n    char *userAndFile = argv[2];\n    const char *baseDir = \"/home/user/public/\"\
    ;\n    char fullPath[PATH_MAX];\n\n    // Attempt to concatenate the base directory\
    \ and the user-supplied path\n    snprintf(fullPath, sizeof(fullPath), \"%s%s\"\
    , baseDir, userAndFile);\n\n    // Resolve the absolute path, normalizing any\
    \ \"..\" or \".\"\n    char *resolvedPath = realpath(fullPath, NULL);\n    if\
    \ (resolvedPath == NULL) {\n        perror(\"Error resolving path\");\n      \
    \  return 1;\n    }\n\n    // Check if the resolved path starts with the base\
    \ directory\n    if (strncmp(baseDir, resolvedPath, strlen(baseDir)) != 0) {\n\
    \        free(resolvedPath);\n        return 1;\n    }\n\n    // GOOD: Path is\
    \ within the intended directory\n    FILE *file = fopen(resolvedPath, \"wb+\"\
    );\n    free(resolvedPath);\n}\n```\n\n## References\n* OWASP: [Path Traversal](https://owasp.org/www-community/attacks/Path_Traversal).\n\
    * Linux man pages: [realpath(3)](https://man7.org/linux/man-pages/man3/realpath.3.html).\n\
    * Common Weakness Enumeration: [CWE-22](https://cwe.mitre.org/data/definitions/22.html).\n\
    * Common Weakness Enumeration: [CWE-23](https://cwe.mitre.org/data/definitions/23.html).\n\
    * Common Weakness Enumeration: [CWE-36](https://cwe.mitre.org/data/definitions/36.html).\n\
    * Common Weakness Enumeration: [CWE-73](https://cwe.mitre.org/data/definitions/73.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-078/ExecTainted.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-078/ExecTainted.bqrs
  metadata:
    name: Uncontrolled data used in OS command
    description: |-
      Using user-supplied data in an OS command, without
                    neutralizing special elements, can make code vulnerable
                    to command injection.
    kind: path-problem
    problem.severity: error
    security-severity: 9.8
    precision: high
    id: cpp/command-line-injection
    tags: |-
      security
             external/cwe/cwe-078
             external/cwe/cwe-088
  queryHelp: "# Uncontrolled data used in OS command\nThe code passes user input as\
    \ part of a call to `system` or `popen` without escaping special elements. It\
    \ generates a command line using `sprintf`, with the user-supplied data directly\
    \ passed as a formatting argument. This leaves the code vulnerable to attack by\
    \ command injection.\n\n\n## Recommendation\nUse a library routine to escape characters\
    \ in the user-supplied string before passing it to a command shell.\n\n\n## Example\n\
    The following example runs an external command in two ways. The first way uses\
    \ `sprintf` to build a command directly out of a user-supplied argument. As such,\
    \ it is vulnerable to command injection. The second way quotes the user-provided\
    \ value before embedding it in the command; assuming the `encodeShellString` utility\
    \ is correct, this code should be safe against command injection.\n\n\n```c\n\
    int main(int argc, char** argv) {\n  char *userName = argv[2];\n  \n  {\n    //\
    \ BAD: a string from the user is injected directly into\n    // a command line.\n\
    \    char command1[1000] = {0};\n    sprintf(command1, \"userinfo -v \\\"%s\\\"\
    \", userName);\n    system(command1);\n  }\n\n  {\n    // GOOD: the user string\
    \ is encoded by a library routine.\n    char userNameQuoted[1000] = {0};\n   \
    \ encodeShellString(userNameQuoted, 1000, userName); \n    char command2[1000]\
    \ = {0};\n    sprintf(command2, \"userinfo -v %s\", userNameQuoted);\n    system(command2);\n\
    \  }\n}\n\n```\n\n## References\n* CERT C Coding Standard: [STR02-C. Sanitize\
    \ data passed to complex subsystems](https://www.securecoding.cert.org/confluence/display/c/STR02-C.+Sanitize+data+passed+to+complex+subsystems).\n\
    * OWASP: [Command Injection](https://www.owasp.org/index.php/Command_Injection).\n\
    * Common Weakness Enumeration: [CWE-78](https://cwe.mitre.org/data/definitions/78.html).\n\
    * Common Weakness Enumeration: [CWE-88](https://cwe.mitre.org/data/definitions/88.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Security/CWE/CWE-079/CgiXss.ql
  relativeBqrsPath: codeql/cpp-queries/Security/CWE/CWE-079/CgiXss.bqrs
  metadata:
    name: CGI script vulnerable to cross-site scripting
    description: |-
      Writing user input directly to a web page
                    allows for a cross-site scripting vulnerability.
    kind: path-problem
    problem.severity: error
    security-severity: 7.8
    precision: high
    id: cpp/cgi-xss
    tags: |-
      security
             external/cwe/cwe-079
  queryHelp: |
    # CGI script vulnerable to cross-site scripting
    Directly writing an HTTP request parameter back to a web page allows for a cross-site scripting vulnerability. The data is displayed in a user's web browser as belonging to one site, but it is provided by some other site that the user browses to. In effect, such an attack allows one web site to insert content in the other one.

    For web servers implemented with the Common Gateway Interface (CGI), HTTP parameters are supplied via the `QUERY_STRING` environment variable.


    ## Recommendation
    To guard against cross-site scripting, consider escaping special characters before writing the HTTP parameter back to the page.


    ## Example
    In the following example, the `bad_server` writes a parameter directly back to the HTML page that the user will see. The `good_server` first escapes any HTML special characters before writing to the HTML page.


    ```c
    void bad_server() {
      char* query = getenv("QUERY_STRING");
      puts("<p>Query results for ");
      // BAD: Printing out an HTTP parameter with no escaping
      puts(query);
      puts("\n<p>\n");
      puts(do_search(query));
    }

    void good_server() {
      char* query = getenv("QUERY_STRING");
      puts("<p>Query results for ");
      // GOOD: Escape HTML characters before adding to a page
      char* query_escaped = escape_html(query);
      puts(query_escaped);
      free(query_escaped);

      puts("\n<p>\n");
      puts(do_search(query));
    }

    ```

    ## References
    * OWASP: [XSS (Cross Site Scripting) Prevention Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html).
    * Wikipedia: [Cross-site scripting](https://en.wikipedia.org/wiki/Cross-site_scripting).
    * IETF Tools: [The Common Gateway Specification (CGI)](http://tools.ietf.org/html/draft-robinson-www-interface-00).
    * Common Weakness Enumeration: [CWE-79](https://cwe.mitre.org/data/definitions/79.html).
 -
