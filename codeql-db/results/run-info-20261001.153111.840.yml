  queryHelp: "# Call to function with extraneous arguments\nA function is called with\
    \ more arguments than there are parameters of the function.\n\nThis may indicate\
    \ that an incorrect function is being called, or that the signature (parameter\
    \ list) of the called function is not known to the author.\n\nIn C, function calls\
    \ generally need to provide the same number of arguments as there are arguments\
    \ to the function. (Variadic functions can accept additional arguments.) Providing\
    \ more arguments than there are parameters incurs an unneeded computational overhead,\
    \ both in terms of time and of additional stack space.\n\n\n## Recommendation\n\
    Call the function with the correct number of arguments.\n\n\n## Example\n\n```c\n\
    void one_argument();\n\nvoid calls() {\n\t\n\tone_argument(1); // GOOD: `one_argument`\
    \ will accept and use the argument\n\t\n\tone_argument(1, 2); // BAD: `one_argument`\
    \ will use the first argument but ignore the second\n}\n\nvoid one_argument(int\
    \ x);\n\n```\n\n## References\n* SEI CERT C Coding Standard: [ DCL20-C. Explicitly\
    \ specify void when a function accepts no arguments ](https://wiki.sei.cmu.edu/confluence/display/c/DCL20-C.+Explicitly+specify+void+when+a+function+accepts+no+arguments)\n"
