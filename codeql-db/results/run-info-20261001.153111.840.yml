  relativeQueryPath: Best Practices/Likely Errors/Slicing.ql
  relativeBqrsPath: codeql/cpp-queries/Best Practices/Likely Errors/Slicing.bqrs
  metadata:
    name: Slicing
    description: "Assigning a non-reference instance of a derived type to a variable\
      \ of the base type slices off all members added by the derived class, and can\
      \ cause an unexpected state."
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/slicing
    tags: |-
      reliability
             correctness
             types
  queryHelp: "# Slicing\nThis query finds assignments of a non-reference instance\
    \ of a derived type to a variable of the base type where the derived type has\
    \ more fields than the base. These assignments slice off all the fields added\
    \ by the derived type, and can cause unexpected state when accessed as the derived\
    \ type.\n\n\n## Recommendation\nChange the type of the variable at the left-hand\
    \ side of the assignment to the subclass.\n\n\n## Example\n\n```cpp\nstatic int\
    \ idctr = 0;\n//Basic connection with id\nclass Connection {\npublic:\n    int\
    \ connId;\n    virtual void print_info() {\n        cout << \"id: \" << connId\
    \ << \"\\n\";\n    }\n    Connection() {\n        connId = idctr++;\n    }\n};\n\
    \n//Adds counters, and an overriding print_info\nclass MeteredConnection : public\
    \ Connection {\npublic:\n    int txCtr;\n    int rxCtr;\n    MeteredConnection()\
    \ {\n        txCtr = 0;\n        rxCtr = 0;\n    }\n    virtual void print_info()\
    \ {\n        cout << \"id: \" << connId << \"\\n\" << \"tx/rx: \" << txCtr <<\
    \ \"/\" << rxCtr << \"\\n\";\n    }\n};\n\nint main(int argc, char* argv[]) {\n\
    \    Connection conn;\n    MeteredConnection m_conn;\n\n    Connection curr_conn\
    \ = conn;\n    curr_conn.print_info();\n    curr_conn = m_conn; //Wrong: Derived\
    \ MetricConnection assigned to Connection \n                        //variable,\
    \ will slice off the counters and the overriding print_info\n    curr_conn.print_info();\
    \ //Will not print the counters.\n\n    Connection* curr_pconn = &conn;\n    curr_pconn->print_info();\n\
    \    curr_pconn = &m_conn; //Correct: Pointer assigned to address of the MetricConnection.\
    \ \n                          //Counters and virtual functions remain intact.\n\
    \    curr_pconn->print_info(); //Will call the correct method MeteredConnection::print_info\n\
    }\n\n```\n\n## References\n* Wikipedia: [Object slicing](https://en.wikipedia.org/wiki/Object_slicing).\n\
    * DevX.com: [Slicing in C++](http://www.devx.com/tips/Tip/14570).\n"
 -
