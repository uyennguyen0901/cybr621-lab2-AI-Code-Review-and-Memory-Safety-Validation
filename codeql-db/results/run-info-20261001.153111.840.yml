  relativeQueryPath: jsf/4.10 Classes/AV Rule 82.ql
  relativeBqrsPath: codeql/cpp-queries/jsf/4.10 Classes/AV Rule 82.bqrs
  metadata:
    name: Overloaded assignment does not return 'this'
    description: An assignment operator should return a reference to *this. Both the
      standard library types and the built-in types behave in this manner.
    kind: problem
    problem.severity: warning
    precision: high
    id: cpp/assignment-does-not-return-this
    tags: |-
      reliability
             readability
             language-features
             external/jsf
  queryHelp: "# Overloaded assignment does not return 'this'\nThis rule finds assignment\
    \ operator definitions that do not return a reference to `this`. The reference\
    \ to `this` is required for an assignment expression to have a meaningful value\
    \ (i.e. so that expressions like `a = b = 3` would work correctly). Not returning\
    \ a reference to `this` would give the assignment expression an unexpected value,\
    \ most likely causing such chained assignments to fail. Both the standard library\
    \ types and the built-in types behave in this manner, and the default behavior\
    \ of the assignment operator is an almost universal assumption of all developers\
    \ that it is unwise to change it considerably. If the desired behavior is significantly\
    \ different from that of the default assignment operator, it may be better to\
    \ define a separate function instead.\n\n\n## Recommendation\nMake sure that the\
    \ assignment operator overload returns a reference to `this`. Define a separate\
    \ function if the desired assignment operator differs significantly from the default\
    \ behavior.\n\n\n## Example\n\n```cpp\nclass B {\n\tB& operator=(const B& other)\
    \ {\n\t\t... //incorrect, does not return a reference to this\n\t}\n};\n\nclass\
    \ C {\n\tC& operator=(const C& other) {\n\t\t...\n\t\treturn *this; //correct,\
    \ returns reference to this\n\t}\n};\n\n```\n\n## References\n* AV Rule 82, *Joint\
    \ Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation,\
    \ 2005.\n* S. Meyers. *Effective C++ 3d ed.* pp 52-53. Addison-Wesley Professional,\
    \ 2005.\n* [C++ Operator Overloading Guidelines](http://courses.cms.caltech.edu/cs11/material/cpp/donnie/cpp-ops.html)\n"
 -
