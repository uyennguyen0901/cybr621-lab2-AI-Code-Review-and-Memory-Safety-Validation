  relativeQueryPath: Likely Bugs/Protocols/TlsSettingsMisconfiguration.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Protocols/TlsSettingsMisconfiguration.bqrs
  metadata:
    name: boost::asio TLS settings misconfiguration
    description: "Using the TLS or SSLv23 protocol from the boost::asio library, but\
      \ not disabling deprecated protocols, or disabling minimum-recommended protocols."
    kind: problem
    problem.severity: error
    precision: medium
    security-severity: 7.5
    id: cpp/boost/tls-settings-misconfiguration
    tags: |-
      security
             external/cwe/cwe-326
  queryHelp: "# boost::asio TLS settings misconfiguration\nUsing the TLS or SSLv23\
    \ protocol from the boost::asio library, but not disabling deprecated protocols\
    \ may expose the software to known vulnerabilities or permit weak encryption algorithms\
    \ to be used. Disabling the minimum-recommended protocols is also flagged.\n\n\
    \n## Recommendation\nWhen using the TLS or SSLv23 protocol, set the `no_tlsv1`\
    \ and `no_tlsv1_1` options, but do not set `no_tlsv1_2`. When using the SSLv23\
    \ protocol, also set the `no_sslv3` option.\n\n\n## Example\nIn the following\
    \ example, the `no_tlsv1_1` option has not been set. Use of TLS 1.1 is not recommended.\n\
    \n\n```cpp\n\nvoid useTLS_bad()\n{\n\tboost::asio::ssl::context ctx(boost::asio::ssl::context::tls);\n\
    \tctx.set_options(boost::asio::ssl::context::no_tlsv1); // BAD: missing no_tlsv1_1\n\
    \n\t// ...\n}\n\n```\nIn the corrected example, the `no_tlsv1` and `no_tlsv1_1`\
    \ options have both been set, ensuring the use of TLS 1.2 or later.\n\n\n```cpp\n\
    \nvoid useTLS_good()\n{\n\tboost::asio::ssl::context ctx(boost::asio::ssl::context::tls);\n\
    \tctx.set_options(boost::asio::ssl::context::no_tlsv1 | boost::asio::ssl::context::no_tlsv1_1);\
    \ // GOOD\n\n\t// ...\n}\n\n```\n\n## References\n* [Boost.Asio documentation](https://www.boost.org/doc/libs/1_71_0/doc/html/boost_asio.html).\n\
    * Common Weakness Enumeration: [CWE-326](https://cwe.mitre.org/data/definitions/326.html).\n"
 -
  pack: codeql/cpp-queries#0
  relativeQueryPath: Likely Bugs/Protocols/UseOfDeprecatedHardcodedProtocol.ql
  relativeBqrsPath: codeql/cpp-queries/Likely Bugs/Protocols/UseOfDeprecatedHardcodedProtocol.bqrs
  metadata:
    name: boost::asio use of deprecated hardcoded protocol
    description: Using a deprecated hard-coded protocol using the boost::asio library.
    kind: problem
    problem.severity: error
    precision: medium
    security-severity: 7.5
    id: cpp/boost/use-of-deprecated-hardcoded-security-protocol
    tags: |-
      security
             external/cwe/cwe-327
  queryHelp: "# boost::asio use of deprecated hardcoded protocol\nUsing boost::asio\
    \ library but specifying a deprecated hardcoded protocol.\n\n\n## Recommendation\n\
    Only use modern protocols such as TLS 1.2 or TLS 1.3.\n\n\n## Example\nIn the\
    \ following example, the `sslv2` protocol is specified. This protocol is out of\
    \ date and its use is not recommended.\n\n\n```cpp\n\nvoid useProtocol_bad()\n\
    {\n\tboost::asio::ssl::context ctx_sslv2(boost::asio::ssl::context::sslv2); //\
    \ BAD: outdated protocol\n\n\t// ...\n}\n\n```\nIn the corrected example, the\
    \ `tlsv13` protocol is used instead.\n\n\n```cpp\n\nvoid useProtocol_good()\n\
    {\n\tboost::asio::ssl::context cxt_tlsv13(boost::asio::ssl::context::tlsv13);\n\
    \n\t// ...\n}\n\n```\n\n## References\n* [Boost.Asio documentation](https://www.boost.org/doc/libs/1_71_0/doc/html/boost_asio.html).\n\
    * Common Weakness Enumeration: [CWE-327](https://cwe.mitre.org/data/definitions/327.html).\n"
 -
