  relativeBqrsPath: codeql/cpp-queries/jsf/4.10 Classes/AV Rule 95.bqrs
  metadata:
    name: Redefined default parameter
    description: An inherited default parameter shall never be redefined. Default
      values are bound statically which is confusing when combined with dynamically
      bound function calls.
    kind: problem
    problem.severity: error
    precision: high
    id: cpp/redefined-default-parameter
    tags: |-
      maintainability
             readability
             external/jsf
  queryHelp: "# Redefined default parameter\nInherited default parameters should not\
    \ be redefined because this obscures the behavior of the code. Default values\
    \ are statically bound and when they are redefined in dynamically bound function\
    \ calls this reduces readability of the code, increasing the risk of introducing\
    \ defects.\n\nFor example, while C++ dynamically binds virtual methods, the default\
    \ parameters of those methods are statically bound. Hence, the draw() method of\
    \ the derived type (Circle), if referenced through a base type pointer (Shape\
    \ \\*), will be invoked with the default parameters of the base type (Shape).\n\
    \n\n```cpp\nenum Shape_color { red, green, blue };\nclass Shape \n{\n  public:\n\
    \    virtual void draw (Shape_color color = green) const;\n    ...\n}\nclass Circle\
    \ : public Shape \n{\n  public:\n    virtual void draw (Shape_color  color = red)\
    \ const;\n    ...\n}\nvoid fun()\n{\n  Shape* sp;\n\n  sp = new Circle;\n  sp->draw\
    \ ();      // Invokes Circle::draw(green) even though the default\n}\t\t\t\t \
    \  \t// parameter for Circle is red.\n\n```\n\n## References\n* AV Rule 95, *Joint\
    \ Strike Fighter Air Vehicle C++ Coding Standards*. Lockheed Martin Corporation,\
    \ 2005.\n* Scott Meyers. Item 38, Effective C++: 50 Specific Ways to Improve Your\
    \ Programs and Design, 2nd Edition. Addison-Wesley, 1998.\n"
 -
